ses all resources of the other VPC to private IPs", "A shared internet gateway attached to both VPCs, with security groups restricting the traffic"], "a": 1, "e": "<b>VPC Peering<\/b> establishes a direct, private network connection between two VPCs (even across different accounts or regions), allowing resources to communicate as if they were on the same network using private IPs — as long as the CIDR blocks of the peered VPCs don't overlap, since peering is not transitive and requires explicit routes on both sides.", "w": "(A) Peering works across accounts without a transit gateway (which is another option). (D) An internet gateway sends traffic over the public internet. (C) Endpoints expose services, not whole VPCs."}, {"id": 526603079, "d": "dep", "t": "vpc", "q": "An application in a VPC needs to reach Amazon S3 without traffic leaving the AWS network and without incurring NAT Gateway data processing charges. Which VPC feature is the standard solution?", "o": ["A VPC peering connection to the S3 service VPC, with a route for the S3 prefix list", "An interface VPC endpoint for S3, which is the only type of endpoint that S3 supports", "A NAT gateway in a public subnet, which routes S3 traffic privately without data charges", "A gateway VPC endpoint for S3 with a route table entry, which has no hourly or data charge"], "a": 3, "e": "S3 (along with DynamoDB) supports a <b>Gateway VPC Endpoint<\/b>, which is added as a target in a route table and provides private connectivity to the service within the AWS network, avoiding both the public internet and NAT Gateway data-processing charges for that traffic — Gateway endpoints themselves have no hourly or per-GB charge.", "w": "(B) S3 supports gateway endpoints, which are free; interface endpoints cost money. (C) NAT gateways charge for data processing. (A) You cannot peer with the S3 service VPC."}, {"id": 143268683, "d": "sec", "t": "vpc", "q": "What is the function of VPC Flow Logs?", "o": ["They record accepted and rejected IP traffic metadata for network interfaces, useful for troubleshooting", "They block traffic that matches known malicious IP addresses before it reaches the instances", "They record the HTTP requests and responses of instances, including headers and payloads", "They record API calls made to VPC resources, such as who changed a route table"], "a": 0, "e": "<b>VPC Flow Logs<\/b> capture metadata about network traffic (not payload content) flowing through Elastic Network Interfaces in a VPC — including source/destination IP and port, protocol, byte/packet counts, and whether the Security Group/NACL accepted or rejected the traffic. They can be sent to CloudWatch Logs or S3 and are widely used for network troubleshooting and security investigation.", "w": "(C) Flow logs contain metadata, not payloads. (D) That is CloudTrail. (B) Flow logs only observe; blocking is done by security groups, NACLs or firewalls."}, {"id": 2693939362, "d": "dev", "t": "s3", "q": "What is the difference between S3 Standard, S3 Standard-Infrequent Access (S3 Standard-IA), and S3 Glacier storage classes in terms of typical use case?", "o": ["Standard-IA is cheaper than Glacier and has no retrieval fee, so it suits any long-term archive", "Standard is for frequent access, Standard-IA is for infrequent access with a retrieval fee, Glacier is for archives", "Glacier retrieves data in milliseconds, which makes it the cheapest class for frequently read data", "Standard is for archives, Standard-IA for frequent access, and Glacier for infrequent access with fast retrieval"], "a": 1, "e": "These storage classes represent a spectrum of cost versus access pattern trade-offs: <b>S3 Standard<\/b> for hot/frequently accessed data with millisecond access and no retrieval fee; <b>Standard-IA<\/b> (and One Zone-IA) for infrequently accessed but still millisecond-retrievable data, at lower per-GB storage cost but with a per-GB retrieval fee; <b>Glacier<\/b> classes for archival data rarely accessed, with much lower storage cost but retrieval taking minutes to hours depending on the retrieval tier chosen.", "w": "(D) The access patterns are mixed up. (A) Standard-IA charges for retrieval and Glacier classes are cheaper for archives. (C) Glacier Flexible Retrieval takes minutes to hours; only Glacier Instant Retrieval returns in milliseconds, and it is meant for rare access."}, {"id": 878172482, "d": "dev", "t": "s3", "q": "S3 Versioning is enabled on a bucket, and a user 'deletes' an object through the console. What actually happens to the object?", "o": ["S3 deletes the object and every version, because versioning only protects overwrites", "S3 deletes the current version only, and the previous version becomes the current one", "S3 moves all versions to the Glacier storage class for 30 days before deleting them", "S3 adds a delete marker that hides the object; the older versions remain and can be restored"], "a": 3, "e": "With <b>Versioning<\/b> enabled, a simple DELETE request doesn't erase data — it inserts a <b>delete marker<\/b> as the new 'current' version, making the object appear deleted for normal operations (like GET without a version ID), while all prior versions remain stored and retrievable by version ID, and the object can be 'undeleted' by removing the delete marker.", "w": "(B) A simple delete adds a marker; it does not promote an older version. (C) There is no automatic move to Glacier; lifecycle rules would be needed. (A) Versioning also protects against deletes."}, {"id": 1032339622, "d": "dev", "t": "s3", "q": "What is the primary purpose of S3 Cross-Region Replication (CRR)?", "o": ["It asynchronously copies new objects to a bucket in another region for compliance, latency or recovery", "It moves objects to the second region and deletes them in the source bucket to save cost", "It copies existing and new objects, including those written before replication was enabled", "It synchronously copies every write to the second region before acknowledging it to the client"], "a": 0, "e": "<b>Cross-Region Replication<\/b> asynchronously copies new objects (and optionally deletions, depending on configuration) from a source bucket to a destination bucket in a different AWS region, both of which must have versioning enabled. Common use cases include meeting compliance requirements for geographic data redundancy, reducing latency for users in other regions, and disaster recovery.", "w": "(D) Replication is asynchronous. (C) Only new objects are replicated; Batch Replication copies existing ones. (B) Replication copies; it does not move."}, {"id": 3356387254, "d": "dev", "t": "s3", "q": "An application needs to be automatically notified (e.g. to trigger a Lambda function) whenever a new object is uploaded to a specific S3 bucket prefix. Which S3 feature provides this?", "o": ["S3 Object Lock, which sends a notification whenever a locked object is written", "S3 Event Notifications to Lambda, SQS, SNS or EventBridge, filtered by prefix or suffix", "S3 Storage Lens, which can start a Lambda function when a new prefix receives objects", "S3 Inventory reports, which publish an event for every object created since the last report"], "a": 1, "e": "<b>S3 Event Notifications<\/b> let a bucket publish events (e.g. object created, removed, restored) to Lambda, SNS, or SQS, and can be scoped with a key prefix and/or suffix filter — a common pattern for event-driven processing of uploaded files.", "w": "(D) Inventory produces scheduled listings, not events. (C) Storage Lens reports metrics and does not trigger functions. (A) Object Lock enforces retention; it is not a notification feature."}, {"id": 4022807696, "d": "sec", "t": "s3", "q": "What is the purpose of S3 MFA Delete, and what specific actions does it protect?", "o": ["It requires MFA for deleting the bucket, but not for deleting object versions", "It requires MFA for every upload and download in the bucket, in addition to normal permissions", "It requires MFA to permanently delete object versions or to change the bucket's versioning state", "It requires MFA to change the bucket policy and the public access block settings"], "a": 2, "e": "<b>MFA Delete<\/b>, once enabled on a versioned bucket (only configurable by the bucket owner's root account via CLI/API), requires the requester to provide a valid MFA code for two specific sensitive operations: permanently deleting an object version, and changing the bucket's versioning state (e.g. suspending it) — protecting against catastrophic accidental or malicious data loss.", "w": "(B) It only covers permanent version deletes and versioning changes. (D) Policy changes are not covered by MFA Delete. (A) It protects object versions and the versioning state; an empty bucket can be deleted with normal permissions."}, {"id": 330566745, "d": "dev", "t": "s3", "q": "An application needs to serve different sized/cropped versions of images stored in S3 without pre-generating and storing every variant, processing images on-the-fly as they're requested. Which S3 feature is designed for this pattern?", "o": ["S3 Batch Operations, which resizes every image once and stores each variant as a new object", "S3 Select, which resizes images with SQL expressions while reading the object", "S3 Event Notifications, which resize the image during the GET request before it is returned", "S3 Object Lambda, which runs a function on GET requests to transform the object on the fly"], "a": 3, "e": "<b>S3 Object Lambda<\/b> lets you associate a Lambda function with an S3 access point so that, as objects are retrieved (GET), the Lambda function can transform the data on-the-fly (e.g. resizing images, redacting fields, converting formats) before returning it to the caller — avoiding the need to store multiple pre-generated derivative copies in the bucket.", "w": "(B) S3 Select filters structured data, not images. (A) Batch Operations creates and stores copies, which the question wants to avoid. (C) Event notifications fire after events; they cannot modify a GET response."}, {"id": 3699201234, "d": "dev", "t": "cli-sdk", "q": "An application running on an EC2 instance needs to call S3 using the AWS SDK, and the developer wants credentials to be automatically discovered without hardcoding them. In what order does the default AWS SDK credential provider chain typically look for credentials (a common relevant sequence)?", "o": ["The instance profile, then environment variables, then the shared credentials file, then container credentials", "Container credentials, then the instance profile, then the shared credentials file, then environment variables", "The shared credentials file, then the instance profile, then container credentials, then environment variables", "Environment variables, then the shared credentials file, then container credentials, then the instance profile"], "a": 3, "e": "The AWS SDK's default <b>credential provider chain<\/b> checks a well-defined sequence of sources, roughly: explicit code-provided credentials, environment variables (`AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY`), the shared credentials/config files (`~/.aws/credentials`), container credentials (ECS task role) if running in ECS, and finally the EC2 Instance Metadata Service for an attached IAM instance role — letting the same code work seamlessly across local development and deployed environments.", "w": "(A) Environment variables are checked before the instance profile. (C) Environment variables are checked first. (B) Environment variables are checked first and the instance profile last."}, {"id": 2685961271, "d": "dev", "t": "cli-sdk", "q": "What is the purpose of AWS CLI named profiles (configured via `aws configure --profile myprofile`)?", "o": ["They store several named sets of credentials and settings, selected with `--profile` or `AWS_PROFILE`", "They group CLI commands into reusable scripts that run with a fixed set of permissions", "They store the named IAM policies that the CLI attaches to every command it sends", "They cache the temporary credentials of the last session so the CLI can skip authentication"], "a": 0, "e": "<b>Named profiles<\/b> in the AWS CLI configuration (`~/.aws/credentials` and `~/.aws/config`) let a developer maintain multiple named sets of credentials and settings (e.g. `dev`, `prod`, cross-account roles) on the same machine, selecting which one to use per command via `--profile` or the `AWS_PROFILE` environment variable, instead of overwriting a single default profile repeatedly.", "w": "(C) Policies are stored in IAM, not in profiles. (D) Credentials can be cached for role profiles, but that is not the purpose of named profiles. (B) Profiles do not contain scripts."}, {"id": 4090796106, "d": "dev", "t": "cli-sdk", "q": "An application repeatedly hits `ThrottlingException` when calling an AWS API directly via HTTP (not using an SDK), without any built-in retry logic. What general strategy should be implemented to handle this robustly?", "o": ["Send each retry to a different region, which avoids the throttled endpoint", "Retry with exponential backoff and jitter up to a maximum number of attempts", "Retry immediately up to ten times, which gives the API the best chance to recover", "Retry every second with a fixed delay, which keeps the request rate predictable"], "a": 1, "e": "<b>Exponential backoff with jitter<\/b> — increasing the delay between retries exponentially (with added randomness to avoid synchronized retry storms across many clients) — is the standard resilience pattern for handling throttling and transient errors, and is exactly what AWS SDKs implement internally by default.", "w": "(C) Immediate retries increase the load. (D) Fixed delays make clients retry in sync; jitter spreads them out. (A) Regions have separate resources and data, so this is rarely possible or sensible."}, {"id": 985626902, "d": "dev", "t": "cloudfront", "q": "What is the primary purpose of Amazon CloudFront in a typical web application architecture?", "o": ["A WAN accelerator that speeds up uploads to S3 through the AWS backbone network", "A DNS service that routes users to the nearest region based on latency measurements", "A global load balancer that distributes TCP connections across regional endpoints with static IPs", "A CDN that caches content at edge locations to lower latency and reduce load on the origin"], "a": 3, "e": "<b>CloudFront<\/b> is AWS's CDN: it caches content (static and, with proper cache policies, some dynamic content) at a global network of edge locations, serving user requests from the nearest edge to reduce latency and reduce load on the origin server (S3 bucket, ALB, custom HTTP origin, etc.).", "w": "(C) That describes Global Accelerator. (B) That is Route 53 latency routing. (A) That is S3 Transfer Acceleration."}, {"id": 3207531236, "d": "dev", "t": "cloudfront", "q": "An S3 bucket serving as a CloudFront origin should only be accessible through CloudFront, not directly via its S3 URL. What is the recommended mechanism to enforce this?", "o": ["Add a bucket policy that allows only the CloudFront IP address ranges in an `aws:SourceIp` condition", "Use Origin Access Control and a bucket policy that allows only that CloudFront distribution", "Make the bucket public and rely on an unguessable bucket name to hide it from direct access", "Enable S3 Transfer Acceleration, which routes all bucket access through CloudFront edge locations"], "a": 1, "e": "<b>Origin Access Control<\/b> lets CloudFront sign requests to the S3 origin using a special CloudFront identity, and the bucket policy is configured to allow `s3:GetObject` only when the request comes from that specific distribution (via a condition on the CloudFront service principal and distribution ARN) — blocking direct public access to the bucket's S3 endpoint while still allowing CloudFront to serve the content.", "w": "(A) The IP ranges change and are shared by all CloudFront customers; OAC identifies your distribution. (C) Public buckets are readable by anyone who finds the URL. (D) Transfer Acceleration uses CloudFront edges for transfers but does not restrict access."}, {"id": 1120295689, "d": "dev", "t": "cloudfront", "q": "An application needs to serve private video content through CloudFront to only paying subscribers, restricting access to specific files or entire path patterns for a limited time. What CloudFront feature enables this?", "o": ["S3 pre-signed URLs for each file, which CloudFront caches and serves to subscribers", "Geo restriction that allows only the countries where subscribers live", "A Lambda@Edge function that checks the subscription in a database, with the origin left public", "CloudFront signed URLs or signed cookies with an expiry time, created with a key group"], "a": 3, "e": "<b>Signed URLs<\/b> (for individual files) and <b>Signed Cookies<\/b> (for multiple files or a whole path pattern, e.g. an entire video course) let the application generate a cryptographically signed policy — specifying which resources, an expiration, and optionally IP restrictions — that CloudFront validates before serving the content, without ever exposing a permanent public URL.", "w": "(A) Pre-signed URLs are validated by S3, and cached copies may be served to others by CloudFront. (C) With a public origin, anyone can bypass the check; signed URLs and cookies are the built-in feature. (B) Geo restriction limits countries, not individual subscribers."}, {"id": 2364091543, "d": "dev", "t": "cloudfront", "q": "A CloudFront distribution serves stale content even after the origin has been updated with new content at the same URL. What is the correct way to force CloudFront to fetch the updated version immediately?", "o": ["Create an invalidation for the changed paths, or use versioned file names so no invalidation is needed", "Lower the TTL of the already cached objects from the console, which refreshes them immediately", "Disable and re-enable the distribution, which clears the caches of every edge location", "Update the object in the origin again with a newer modification date so edges revalidate at once"], "a": 0, "e": "A <b>cache invalidation<\/b> explicitly tells CloudFront to treat cached objects at specified paths (or wildcard patterns) as expired, so the next request for them is forwarded to the origin for a fresh copy. An alternative best practice is versioned object keys/URLs (cache-busting) to avoid needing invalidations altogether, since invalidations beyond the free tier have an associated cost.", "w": "(B) A new TTL applies only after cached objects expire. (C) Disabling does not purge caches. (D) Edges revalidate only after the TTL expires; they do not check the origin on every request."}, {"id": 2338128935, "d": "dep", "t": "ecs", "q": "What is the fundamental difference between a Docker image and a Docker container?", "o": ["An image is a read-only template; a container is a running instance created from it", "An image runs only on ECS; a container runs only on Kubernetes", "An image is a running instance; a container is the read-only template it was built from", "An image holds only the application code; a container adds the operating system kernel"], "a": 0, "e": "A Docker <b>image<\/b> is a static, immutable snapshot/template — layers of a filesystem plus metadata — that defines what an application needs to run. A <b>container<\/b> is a running (or exited) instantiation of an image, with its own writable layer and process, analogous to the relationship between a class and an object instance.", "w": "(C) The terms are reversed. (B) Both concepts apply to every container platform. (D) Images include libraries and runtime; containers share the host kernel."}, {"id": 4025092414, "d": "dep", "t": "ecs", "q": "An ECS service is configured with a 'rolling update' deployment and `minimumHealthyPercent: 100`, `maximumPercent: 200`. What does this configuration mean for how the service deploys a new task definition revision?", "o": ["ECS keeps at least 200% healthy tasks and starts at most 100% extra tasks during the deployment", "ECS replaces tasks one at a time and never runs more than the desired count at once", "ECS stops all old tasks first and then starts up to twice the desired number of new tasks", "ECS may start up to twice the desired number of tasks and never drops below the desired healthy count"], "a": 3, "e": "These percentages are relative to the service's desired count: `minimumHealthyPercent` sets the minimum percentage of the desired count that must remain running/healthy during deployment (100% means never go below the full desired count), while `maximumPercent` caps how far above the desired count ECS can temporarily go while launching replacements (200% means it can double capacity temporarily) — together enabling a zero-downtime rolling replacement.", "w": "(C) With 100% minimum healthy, old tasks are not stopped before new ones are healthy. (A) The two values are mixed up. (B) A maximum of 200% allows extra tasks during the deployment."}, {"id": 1140984597, "d": "dep", "t": "ecs", "q": "An ECS cluster runs on the EC2 launch type. Which component is responsible for deciding which EC2 instance a given task gets placed on, and what factors can influence that decision?", "o": ["The ECS agent on each instance, which decides on its own whether it accepts a task", "The Auto Scaling group, which places tasks on instances according to its termination policy", "The Application Load Balancer, which assigns tasks to instances by its routing algorithm", "The ECS scheduler, using placement strategies (binpack, spread, random) and constraints"], "a": 3, "e": "ECS supports configurable <b>task placement strategies<\/b> (`binpack` to minimize the number of instances used, `spread` to distribute evenly across a dimension like AZ or instance ID, `random`) combined with <b>placement constraints<\/b> (like requiring distinct instances per task, or matching specific instance attributes), which the ECS scheduler uses to decide where to place each task among registered container instances with enough free CPU/memory.", "w": "(B) Auto Scaling manages instances, not tasks. (C) The load balancer routes requests to tasks after they are placed. (A) The agent runs the tasks that the scheduler assigns."}, {"id": 1232672467, "d": "dep", "t": "ecs", "q": "What is Amazon ECR primarily used for, and how does it typically fit into an ECS/Fargate deployment pipeline?", "o": ["ECR builds images from source code in a repository and deploys them to ECS automatically", "ECR stores Lambda deployment packages only; ECS pulls container images from Docker Hub", "ECR is a managed registry for container images; pipelines push images and task definitions reference them", "ECR is an orchestrator that schedules containers; pipelines push task definitions to it"], "a": 2, "e": "<b>ECR<\/b> is AWS's managed registry for storing, versioning, and retrieving Docker (OCI) container images, integrated with IAM for access control. A typical pipeline builds an image (e.g. via CodeBuild), pushes it to an ECR repository, and then an ECS task definition revision is updated to reference the new image URI/tag before deploying.", "w": "(D) Scheduling is done by ECS or EKS. (B) ECR stores container images (also for Lambda container images). (A) ECR stores images; building is done by CodeBuild or another tool, and deploying needs a service update."}, {"id": 3344404025, "d": "dep", "t": "ecs", "q": "What is Amazon EKS, and how does it differ from Amazon ECS?", "o": ["EKS manages the worker nodes for you completely; ECS requires you to manage the control plane", "EKS is AWS's own orchestrator with a simple API; ECS runs managed Kubernetes", "EKS runs only on Fargate; ECS runs only on EC2 instances", "EKS runs managed Kubernetes with the standard Kubernetes API; ECS is AWS's own orchestrator"], "a": 3, "e": "<b>EKS<\/b> runs a managed, standards-compliant Kubernetes control plane, letting teams use the Kubernetes API, tooling, and ecosystem they may already know, with workloads portable to other Kubernetes environments. <b>ECS<\/b> is AWS's own simpler, proprietary orchestrator, with different concepts (task definitions, services, clusters) and no Kubernetes API compatibility — often considered easier to get started with for teams fully committed to AWS.", "w": "(B) The services are swapped. (C) Both support Fargate and EC2. (A) AWS manages the control plane for both; worker nodes are yours to manage unless you use Fargate or managed node groups."}, {"id": 1130784911, "d": "dep", "t": "beanstalk", "q": "What is the core value proposition of AWS Elastic Beanstalk for a developer deploying a typical web application?", "o": ["It is a container orchestrator that requires you to define tasks and services yourself", "It converts your application into serverless functions that run without any servers", "It provisions and manages the infrastructure for your code while you keep access to the resources", "It hosts your application on AWS-managed servers that you cannot see or configure"], "a": 2, "e": "<b>Elastic Beanstalk<\/b> lets a developer simply upload application code (or a container), and it automatically provisions and manages the underlying resources (EC2 instances, load balancer, Auto Scaling Group, and optionally an RDS database) for supported platforms — while still exposing the underlying resources in the AWS console for customization, unlike a fully black-box PaaS.", "w": "(B) Beanstalk runs your application on EC2 instances. (A) That describes ECS. (D) Beanstalk resources appear in your account and can be configured."}, {"id": 3932667074, "d": "dep", "t": "beanstalk", "q": "What is the difference between Elastic Beanstalk's 'Single Instance' and 'High Availability with Load Balancer' environment types?", "o": ["Single instance keeps the database outside; the load balanced type always creates RDS", "Single instance uses a load balancer with one target; the load balanced type distributes across several", "Single instance runs one EC2 instance without a load balancer; the load balanced type adds ELB and Auto Scaling", "Single instance uses Fargate; the load balanced type uses EC2 instances"], "a": 2, "e": "The <b>Single Instance<\/b> environment type is a simpler, lower-cost setup running a single EC2 instance with an associated Elastic IP, commonly used for development or testing. The <b>Load Balanced, Auto Scaling<\/b> environment type provisions an ELB in front of an Auto Scaling Group of instances, suited for production workloads needing high availability and elastic scaling.", "w": "(B) A single instance environment has no load balancer; it uses an Elastic IP address. (D) Beanstalk environments run on EC2 instances. (A) A database is optional for either type."}, {"id": 431619634, "d": "dep", "t": "beanstalk", "q": "A developer wants to customize the Elastic Beanstalk environment beyond what the console/CLI options expose — for example, installing an additional OS package or running a custom script during instance provisioning. What Beanstalk feature supports this?", "o": ["A `Dockerrun.aws.json` file in the source bundle, which installs OS packages on the instance", "`.ebextensions` config files in the source bundle that install packages, run commands and add resources", "A custom AMI baked for each deployment, which is the only way to run commands at launch", "The console's software configuration page, which accepts arbitrary shell commands for every instance"], "a": 1, "e": "<b>`.ebextensions`<\/b> is a directory of configuration files bundled with the application source code that Elastic Beanstalk processes during environment creation/updates — supporting package installation, running custom commands, creating configuration files, defining CloudFormation resources, and more, giving significant customization power beyond the basic console settings.", "w": "(C) Custom AMIs are optional; ebextensions can run commands during provisioning. (D) The console sets options and environment properties, not arbitrary commands. (A) Dockerrun describes container settings, not host packages."}, {"id": 1341064183, "d": "dep", "t": "cfn", "q": "What is the purpose of an `AWS::CloudFormation::Interface` metadata section combined with `Parameters` in a CloudFormation template, from a usability perspective?", "o": ["It groups and labels parameters in the console form, without changing what is provisioned", "It defines which IAM principals may supply values for each parameter", "It hides sensitive parameters from the console and stack events, like `NoEcho`", "It validates parameter values against patterns before the stack is created"], "a": 0, "e": "The `AWS::CloudFormation::Interface` metadata key lets template authors organize parameters into labeled groups and give them friendlier display labels in the CloudFormation console's parameter input form — purely a UX/organizational enhancement with no effect on how the stack is actually provisioned.", "w": "(D) Validation uses AllowedPattern and AllowedValues. (B) Permissions are controlled with IAM. (C) NoEcho masks values; the Interface section only affects layout."}, {"id": 2726986713, "d": "dep", "t": "cfn", "q": "A CloudFormation template needs to output a value (like an API endpoint URL) so it can be referenced by other stacks. Which combination of sections accomplishes cross-stack referencing?", "o": ["Declare the value in `Parameters` of both stacks and reference it with `Ref` in each", "Export the value in `Outputs` and read it with `Fn::ImportValue` in the other stack", "Use `Fn::GetAtt` with the other stack's name as the logical ID of the resource", "Export the value in `Mappings` and read it with `Fn::FindInMap` in the other stack"], "a": 1, "e": "To share a value between stacks, the producing stack declares it under `Outputs` with an `Export` name (which must be unique per region/account), and any consuming stack (in the same account/region) can retrieve that value using `Fn::ImportValue` with the matching export name — this is the standard cross-stack reference pattern, though the exporting stack then can't easily change/delete that output while it's actively imported elsewhere.", "w": "(A) Parameters need values supplied from outside; they do not link stacks. (D) Mappings are static tables inside one template. (C) GetAtt reads resources in the same template; cross-stack values need exports."}, {"id": 2991826323, "d": "dep", "t": "cfn", "q": "A CloudFormation stack creation includes an IAM role resource, but the deployment fails with an `InsufficientCapabilitiesException`. What is the cause and fix?", "o": ["The template uses a macro; pass `CAPABILITY_AUTO_EXPAND` and redeploy", "The role lacks a trust policy; add `cloudformation.amazonaws.com` as a trusted service", "The template creates IAM resources; pass `CAPABILITY_IAM`, or `CAPABILITY_NAMED_IAM` for custom names", "The stack hit the 500-resource limit; split the template into nested stacks"], "a": 2, "e": "CloudFormation requires an explicit <b>capabilities<\/b> acknowledgment (`CAPABILITY_IAM`, or `CAPABILITY_NAMED_IAM` if resources have custom, developer-specified names rather than auto-generated ones, or `CAPABILITY_AUTO_EXPAND` for macros/nested transforms) when a template creates IAM resources, as a safeguard against unexpectedly granting/escalating permissions — omitting this flag when required causes the deployment to fail with this specific exception.", "w": "(D) The resource limit gives a different error. (A) AUTO_EXPAND is for macros and nested transforms, not for IAM resources. (B) The error is about acknowledging IAM changes, not the trust policy."}, {"id": 1204805222, "d": "dev", "t": "messaging", "q": "An SQS FIFO queue processes orders, and each order must be tied to a specific customer so that a slow order for one customer doesn't block orders for other customers, while orders from the same customer still process strictly in order. How should `MessageGroupId` be used to achieve this?", "o": ["Use the order ID as `MessageGroupId`, which keeps all orders of one customer in strict order", "Leave out `MessageGroupId` and set `MessageDeduplicationId` to the customer ID to order each customer's messages", "Use a fixed `MessageGroupId` for every order, which keeps order per customer and still runs customers in parallel", "Use the customer ID as `MessageGroupId`, so each customer's messages stay ordered and customers run in parallel"], "a": 3, "e": "In an SQS FIFO queue, ordering is guaranteed <b>within<\/b> a given `MessageGroupId`, and messages with different group IDs can be consumed and processed independently/in parallel. Using the customer ID as the group ID ensures per-customer order preservation while allowing overall throughput to scale across many customers/groups.", "w": "(C) One group serializes all messages. (A) Each order would be its own group, so orders of one customer could be processed in parallel and out of order. (B) FIFO queues require a MessageGroupId; the deduplication ID only prevents duplicates."}, {"id": 674382062, "d": "dev", "t": "messaging", "q": "What is the SQS 'Dead Letter Queue' (DLQ) redrive policy, and what problem does it solve?", "o": ["After a message has been received a set number of times without being deleted, SQS moves it to the DLQ", "After a consumer deletes a message, SQS copies it to the DLQ for later auditing", "After a message has been in the queue for the retention period, SQS moves it to the DLQ", "After a message's visibility timeout expires once, SQS moves it to the DLQ"], "a": 0, "e": "A <b>redrive policy<\/b> sets a `maxReceiveCount` on the source queue; once a message has been received (polled) that many times without being deleted (implying repeated processing failure), SQS automatically moves it to the configured <b>Dead Letter Queue<\/b>. This isolates problematic 'poison pill' messages so they don't get endlessly retried and block or slow down processing of the rest of the queue, while preserving them for investigation.", "w": "(C) Retention expiry deletes the message; it is not moved. (D) Several receives (maxReceiveCount) are allowed before the move. (B) Deleted messages are gone; only repeatedly failed ones go to the DLQ."}, {"id": 428327186, "d": "dev", "t": "messaging", "q": "What is the primary difference between Amazon Kinesis Data Streams and Amazon Data Firehose in terms of how consumers receive data?", "o": ["With Data Streams you write or attach consumers; Firehose delivers to S3, Redshift or OpenSearch with no consumer code", "With Firehose you write consumers that read from shards; Data Streams delivers to S3 with no consumer code", "Neither needs consumers, because both push data to subscribers like SNS does", "Both require consumers, but Firehose consumers can only be Lambda functions"], "a": 0, "e": "<b>Kinesis Data Streams<\/b> is a low-latency streaming service where you write custom consumer logic (or attach Lambda) to actively process records from shards, giving flexibility but requiring you to build the consumption logic. <b>Data Firehose<\/b> is a fully managed, near-real-time delivery pipeline: you configure a destination and Firehose handles batching, optional transformation (via Lambda), and delivery, with no consumer application to write or manage.", "w": "(B) The services are swapped. (D) Firehose has no consumers; it delivers to configured destinations. (C) Data Streams consumers pull records (or Lambda polls); records are not pushed."}, {"id": 432067383, "d": "ts", "t": "monitoring", "q": "A CloudWatch composite alarm combines the states of two underlying alarms using an AND rule. Under what condition does the composite alarm enter the ALARM state?", "o": ["It enters ALARM when both underlying alarms are in the INSUFFICIENT_DATA state", "It enters ALARM only when both underlying alarms are in the ALARM state", "It enters ALARM when at least one of the underlying alarms is in the ALARM state", "It enters ALARM when the underlying alarms change state within the same evaluation period"], "a": 1, "e": "A <b>composite alarm<\/b> combines the state of multiple existing alarms using an alarm rule expression (with AND/OR/NOT logic). With an AND rule between two alarms, the composite only transitions to ALARM when both underlying alarms are simultaneously in ALARM — a useful pattern for reducing alert fatigue by requiring corroborating signals (e.g. high latency AND high error rate) before paging someone.", "w": "(C) That describes an OR rule. (A) Composite rules check ALARM, OK and INSUFFICIENT_DATA states explicitly. (D) The rule evaluates current states, not timing."}, {"id": 3707802989, "d": "dev", "t": "monitoring", "q": "An application publishes a custom CloudWatch metric for 'checkout errors' using `PutMetricData`, without specifying a timestamp. What timestamp does CloudWatch use, and what is a key constraint on how far in the past/future a custom metric's timestamp can be?", "o": ["CloudWatch uses the time of the previous data point of the same metric", "CloudWatch rejects the call because a timestamp is required for custom metrics", "CloudWatch accepts any timestamp, including dates years in the past or future", "CloudWatch uses the time of the call; timestamps far in the past or future can be rejected"], "a": 3, "e": "If no timestamp is supplied, CloudWatch defaults to the time the `PutMetricData` call is received. CloudWatch does enforce limits on how far outside the current time a supplied timestamp can be (varying somewhat by retention/API details) — publishing data far outside that acceptable window can result in rejection, which matters for batch-processed or delayed metric ingestion pipelines.", "w": "(B) The timestamp is optional. (A) The default is the time CloudWatch receives the call. (C) Timestamps outside the accepted range are rejected."}, {"id": 442100168, "d": "dev", "t": "monitoring", "q": "What is the purpose of CloudWatch Synthetics (canaries)?", "o": ["Canaries are agents on instances that collect memory and disk metrics for dashboards", "Canaries are log subscriptions that stream error lines to a Lambda function for alerting", "Canaries are scheduled scripts that test endpoints and workflows from outside, before users are affected", "Canaries are traces that follow a request through every service and show where latency occurs"], "a": 2, "e": "<b>CloudWatch Synthetics<\/b> lets you author 'canary' scripts that run on a fixed schedule, simulating real user interactions (loading a page, following a link, calling an API) from outside your infrastructure, and reporting on availability, latency, and broken workflows/links — a proactive outside-in monitoring approach that can catch issues before customers report them.", "w": "(A) That is the CloudWatch agent. (B) That is a subscription filter. (D) That is X-Ray."}, {"id": 2183494958, "d": "dev", "t": "lambda", "q": "An application needs a Lambda function to persist a shared, mountable file system across invocations and even across different Lambda functions, larger than what /tmp storage allows. What Lambda feature supports this?", "o": ["Add a Lambda layer, which every invocation can write to and all functions share", "Raise the /tmp size to 100 GB and share it between functions through an alias", "Mount an Amazon EFS file system in the function, which shares persistent storage beyond /tmp", "Attach an EBS volume to the function so that all functions see the same disk"], "a": 2, "e": "Lambda supports mounting an <b>Amazon EFS<\/b> file system directly, giving functions access to a shared, persistent, elastic file system beyond the ephemeral and size-limited /tmp (512 MB–10 GB), usable concurrently across many function invocations and even different functions — this requires the function to run inside a VPC with connectivity to the EFS mount targets.", "w": "(D) Lambda cannot attach EBS volumes. (A) Layers are read-only. (B) /tmp is limited to 10 GB and is private to each execution environment."}, {"id": 4180511028, "d": "dev", "t": "lambda", "q": "What does 'Lambda Function URL' provide, and how is it different from fronting a function with API Gateway?", "o": ["A Function URL can route to several functions by path, like an API Gateway resource tree", "A Function URL is a simple HTTPS endpoint for one function, with fewer features than API Gateway", "A Function URL offers usage plans and caching, which API Gateway lacks", "A Function URL is a dedicated API Gateway REST API that Lambda creates for you"], "a": 1, "e": "A <b>Function URL<\/b> gives a Lambda function its own dedicated HTTP(S) endpoint with minimal setup — ideal for simple, single-function HTTP use cases like webhooks — without provisioning a separate API Gateway resource, but it lacks many of API Gateway's more advanced capabilities such as usage plans/API keys, request/response transformation, or a full REST/WebSocket feature set.", "w": "(C) Usage plans and caching are API Gateway features. (D) It is not an API Gateway API. (A) A Function URL belongs to a single function."}, {"id": 4148890066, "d": "dev", "t": "lambda", "q": "A Lambda function packaged as a container image (instead of a traditional zip deployment package) is being used. What is a key requirement for this container image?", "o": ["The image must be smaller than 250 MB, like the unzipped limit of zip packages", "The image must be stored in Docker Hub, because Lambda cannot pull from ECR", "The image must use the Node.js runtime, because other runtimes need zip packages", "The image must implement the Lambda runtime API, for example by using an AWS base image"], "a": 3, "e": "Lambda container images must implement the <b>Lambda Runtime API<\/b> to properly receive invocation events and return responses — AWS provides base images for common runtimes with this built in, or a custom base image can add the <b>Runtime Interface Client<\/b> to become Lambda-compatible; a generic, unmodified Docker image built for a different execution context won't work correctly as-is.", "w": "(A) Images can be up to 10 GB. (B) Lambda pulls images from ECR. (C) Container images support many runtimes."}, {"id": 4249136165, "d": "dev", "t": "dynamodb", "q": "What is the difference between a DynamoDB Global Secondary Index (GSI) and a Local Secondary Index (LSI)?", "o": ["An LSI can use different keys and be added later; a GSI shares the partition key and exists from creation", "Both share the table's partition key, but only a GSI supports strongly consistent reads", "Both can be added later, but an LSI has its own throughput and a GSI shares the table's", "A GSI can use different keys and be added later; an LSI shares the partition key and exists from creation"], "a": 3, "e": "A <b>GSI<\/b> offers full flexibility: a different partition key and sort key from the base table, its own throughput settings, and can be created or deleted at any time after the table exists. An <b>LSI<\/b> is more constrained: it must use the same partition key as the base table (only the sort key can differ), must be defined at table creation time, and shares the base table's provisioned throughput — but it does support strongly consistent reads, unlike a GSI.", "w": "(A) The properties are swapped. (C) A GSI has its own throughput; an LSI shares the table's and must be created with the table. (B) Only an LSI supports strongly consistent reads."}, {"id": 3051286308, "d": "dev", "t": "dynamodb", "q": "An application wants DynamoDB to automatically delete items (e.g. expired session records) after a certain time, without consuming write capacity for a manual delete operation. Which DynamoDB feature provides this?", "o": ["A conditional write that deletes the item the next time it is read after it expires", "A scheduled Scan that deletes expired items in batches, which consumes read and write capacity", "TTL, which deletes items after the epoch timestamp stored in an attribute, without write capacity", "DynamoDB Streams with a Lambda function that deletes expired items, which consumes write capacity"], "a": 2, "e": "<b>TTL<\/b> lets you designate an attribute holding a Unix epoch timestamp; DynamoDB's background process periodically scans for and deletes expired items (usually within 48 hours of expiration) without consuming provisioned write capacity for the deletion — commonly used for session data, temporary caches, or other data with a natural expiration.", "w": "(D) Streams report changes; deleting with Lambda costs write capacity. (B) Scans and deletes consume capacity. (A) Items are not checked on reads; TTL deletes in the background."}, {"id": 4154947762, "d": "dev", "t": "dynamodb", "q": "What is the purpose of DynamoDB PartiQL support?", "o": ["PartiQL lets you query DynamoDB with SQL-like statements, using the same data model and billing", "PartiQL is a separate query engine on a replica of the table that does not use read capacity", "PartiQL adds joins and foreign keys across tables, turning DynamoDB into a relational database", "PartiQL replaces the DynamoDB API, which is deprecated for new tables"], "a": 0, "e": "<b>PartiQL<\/b> for DynamoDB provides a SQL-compatible syntax for reading and writing data (as an alternative interface to the API-style Query/Scan/PutItem/UpdateItem/DeleteItem calls), which some developers find more familiar — but it doesn't change DynamoDB's core NoSQL data model, key-based access patterns, or how throughput/billing work.", "w": "(C) DynamoDB stays a NoSQL database without joins. (B) PartiQL statements consume capacity like other reads. (D) The native API remains fully supported."}, {"id": 407998981, "d": "dev", "t": "apigw", "q": "What is the primary architectural and cost difference between API Gateway REST APIs and HTTP APIs?", "o": ["REST APIs are regional only; HTTP APIs can also be edge-optimized", "REST APIs are cheaper and faster with fewer features; HTTP APIs have caching, usage plans and validation", "HTTP APIs support only Lambda integrations; REST APIs support HTTP and AWS service integrations", "HTTP APIs are cheaper and faster with fewer features; REST APIs have caching, usage plans and validation"], "a": 3, "e": "<b>HTTP APIs<\/b> were introduced as a leaner, cheaper, lower-latency alternative to REST APIs, particularly optimized for simple proxy integrations (Lambda, HTTP backends) with built-in support for JWT authorizers and CORS, but a reduced feature set overall. <b>REST APIs<\/b> remain the full-featured option, supporting request/response transformation and validation, API keys and usage plans, per-method caching, and more extensive customization, generally at a higher price point.", "w": "(B) The features are swapped. (C) HTTP APIs support HTTP and Lambda and other integrations. (A) REST APIs can be edge-optimized, regional or private."}, {"id": 3961306238, "d": "dev", "t": "apigw", "q": "An API Gateway REST API needs to support real-time, bidirectional communication with clients (e.g. a chat application), rather than typical request/response HTTP calls. Which API Gateway API type is designed for this?", "o": ["An HTTP API with server-sent events, which is the only API type that keeps connections open", "A WebSocket API, which keeps connections open so the server can push messages to clients", "A REST API with a stage cache, which pushes changed responses to subscribed clients", "A REST API with long polling enabled, which lets the server push messages to clients"], "a": 1, "e": "API Gateway's <b>WebSocket API<\/b> type maintains a persistent, full-duplex connection between client and backend, routing incoming messages to different backend integrations (Lambda, HTTP, etc.) based on a configurable route selection expression (e.g. inspecting a field in the message payload) — well suited for chat apps, real-time dashboards, and other bidirectional use cases.", "w": "(D) REST APIs are request/response only. (A) HTTP APIs do not offer persistent bidirectional connections. (C) Caches do not push anything to clients."}, {"id": 3015914772, "d": "dep", "t": "cicd", "q": "What is the primary purpose of AWS CodeCommit, and how does it fit into a typical AWS CI/CD pipeline?", "o": ["CodeCommit stores container images and scans them for vulnerabilities", "CodeCommit builds and tests the code and produces the artifacts for later stages", "CodeCommit deploys the code to instances and rolls back on failed health checks", "CodeCommit hosts private Git repositories and is often the Source stage of a pipeline"], "a": 3, "e": "<b>CodeCommit<\/b> is a fully managed private Git repository hosting service, functionally similar to GitHub/GitLab but integrated with IAM for access control. It commonly serves as the Source stage of a CodePipeline, so that new commits to a branch automatically trigger the pipeline's subsequent Build and Deploy stages.", "w": "(B) That is CodeBuild. (A) That is ECR. (C) That is CodeDeploy."}, {"id": 3039053024, "d": "dep", "t": "cicd", "q": "In a `buildspec.yml` for CodeBuild, what is the correct order of build phases, and what is each phase generally used for?", "o": ["`install`, `build`, `pre_build`, `post_build`", "`install`, `pre_build`, `build`, `post_build`", "`pre_build`, `install`, `build`, `post_build`", "`install`, `pre_build`, `post_build`, `build`"], "a": 1, "e": "CodeBuild's buildspec defines phases in the standard order <b>install → pre_build → build → post_build<\/b>: `install` typically sets up runtime versions/dependencies, `pre_build` runs setup steps like registry logins or fetching additional dependencies, `build` executes the primary build commands (e.g. `docker build`), and `post_build` handles finalization tasks like pushing an image or packaging artifacts.", "w": "(C) Dependencies are installed before the pre-build commands run. (A) pre_build runs before build. (D) post_build runs after build."}, {"id": 4204390682, "d": "dep", "t": "cicd", "q": "A CodeDeploy deployment to a fleet of EC2 instances behind an Auto Scaling Group needs new instances launched by the ASG (due to scale-out) to automatically receive the latest deployed application revision, without a separate manual deployment. What CodeDeploy/ASG integration supports this?", "o": ["Add a user data script that calls `aws deploy create-deployment` on every new instance", "Use CodePipeline to re-run the deployment whenever the group's desired capacity changes", "Associate the deployment group with the Auto Scaling group so new instances receive the last revision", "Enable a lifecycle hook on the deployment group that clones running instances"], "a": 2, "e": "When a CodeDeploy deployment group is <b>associated with an Auto Scaling Group<\/b>, CodeDeploy hooks into the ASG's lifecycle events so that whenever a new instance is launched (e.g. during scale-out), CodeDeploy automatically installs the most recent successfully deployed application revision onto it — keeping the fleet consistent without manual intervention for every new instance.", "w": "(A) That is manual scripting, while the association handles it natively. (D) Deployment groups do not clone instances. (B) Pipelines are not triggered by capacity changes."}, {"id": 1325475470, "d": "dev", "t": "sam", "q": "What is the relationship between AWS SAM (Serverless Application Model) and AWS CloudFormation?", "o": ["SAM replaces CloudFormation for serverless resources, so SAM stacks do not appear in CloudFormation", "SAM is an extension of CloudFormation: its templates are transformed into CloudFormation templates", "SAM is a separate deployment engine that provisions resources without using CloudFormation", "SAM is a macro that supports only Lambda functions, not API Gateway or DynamoDB tables"], "a": 1, "e": "SAM introduces a shorthand syntax for common serverless resources (Lambda functions, APIs, DynamoDB tables, state machines) via the `AWS::Serverless-2016-10-31` transform declared in the template. When deployed, this transform expands the SAM syntax into the equivalent full CloudFormation resources, and the deployment itself is ultimately executed by CloudFormation.", "w": "(C) SAM deployments run through CloudFormation. (A) SAM stacks are CloudFormation stacks. (D) SAM supports functions, APIs, tables and more."}, {"id": 626849913, "d": "dev", "t": "sam", "q": "What do SAM Policy Templates (e.g. `DynamoDBCrudPolicy`, `S3ReadPolicy`) provide when attached to a `AWS::Serverless::Function`'s `Policies` property?", "o": ["Templates for resource-based policies that allow other services to invoke the function", "Managed policies that AWS attaches automatically when the function accesses a new service", "Predefined roles that the function assumes at deployment time instead of its execution role", "Ready-made, parameterized least-privilege policies for common cases such as CRUD on one DynamoDB table"], "a": 3, "e": "<b>SAM Policy Templates<\/b> are a curated library of common, parameterized IAM permission sets (referencing the specific resource, like a table name or bucket name, via SAM parameters) that can be referenced by name in the `Policies` list — simplifying the process of following least privilege without manually authoring detailed IAM policy documents for routine access patterns.", "w": "(C) Policy templates expand to policies on the function's execution role. (A) Invocation permissions are set by events or resource-based policies. (B) Nothing is attached automatically; you list the templates."}, {"id": 1241800754, "d": "dev", "t": "sam", "q": "What does the `sam deploy --guided` command do differently from a plain `sam deploy`?", "o": ["It deploys the application to every region listed in `samconfig.toml` at once", "It uploads the code to S3 without creating or updating the CloudFormation stack", "It rolls back the last deployment and then prompts for new parameter values", "It asks for stack name, region and options, then saves them to `samconfig.toml`"], "a": 3, "e": "`sam deploy --guided` walks the developer through an interactive configuration wizard the first time (or whenever settings need to change) — capturing stack name, region, parameter overrides, and confirmations like allowing IAM role creation — then persists these choices into a `samconfig.toml` file so subsequent deployments can simply run `sam deploy` without needing all the flags again.", "w": "(A) Guided mode deploys to the region you choose. (B) It also creates or updates the stack. (C) It deploys; it does not roll anything back."}, {"id": 420922792, "d": "dev", "t": "cdk", "q": "What is the AWS Cloud Development Kit (CDK), and how does it differ from writing raw CloudFormation YAML/JSON templates?", "o": ["CDK defines infrastructure in programming languages and synthesizes CloudFormation templates", "CDK is a YAML dialect that adds loops and conditions to CloudFormation templates", "CDK deploys resources directly through the service APIs without CloudFormation", "CDK works only for serverless resources, like SAM, and cannot define VPCs or databases"], "a": 0, "e": "<b>CDK<\/b> lets developers author infrastructure as code in a general-purpose programming language, gaining the benefits of that language (loops, conditionals, classes, package management, testing frameworks) plus higher-level abstractions ('constructs') that encapsulate common patterns. Running `cdk synth` compiles this code down into a standard CloudFormation template, which is what actually gets deployed (via CloudFormation, typically triggered by `cdk deploy`).", "w": "(C) CDK deploys through CloudFormation. (B) CDK uses general-purpose languages. (D) CDK supports essentially all CloudFormation resource types."}, {"id": 3694725476, "d": "dev", "t": "cdk", "q": "In AWS CDK terminology, what is a 'Construct', and how do L1, L2, and L3 constructs differ?", "o": ["L1 is for networking, L2 is for compute, and L3 is for databases and storage", "L1 maps one-to-one to CloudFormation resources, L2 adds defaults and helpers, L3 combines resources into patterns", "L1, L2 and L3 are CDK versions, and each new level replaces the previous one", "L1 combines resources into patterns, L2 adds defaults and helpers, L3 maps one-to-one to CloudFormation"], "a": 1, "e": "A <b>Construct<\/b> is the basic building block of a CDK app, representing one or more AWS resources. <b>L1 (Cfn) constructs<\/b> are auto-generated, low-level wrappers that map directly to CloudFormation resource types. <b>L2 constructs<\/b> wrap L1s with a more ergonomic, higher-level API and secure defaults (e.g. an S3 `Bucket` construct that simplifies common configuration). <b>L3 constructs (patterns)<\/b> combine multiple resources to implement an entire common architecture (e.g. a load-balanced Fargate service) in just a few lines of code.", "w": "(D) The order is reversed. (A) Levels describe abstraction, not service categories. (C) Levels are abstraction layers that exist side by side."}, {"id": 903473042, "d": "sec", "t": "cognito", "q": "An application uses Cognito User Pools for sign-up/sign-in and needs users to be able to log in using an existing Google account instead of creating a new password. What Cognito feature supports this?", "o": ["Add a Lambda trigger that verifies Google passwords against the Google API", "Enable Cognito Sync, which copies Google accounts into the user pool", "Create an identity pool with Google as a provider, which replaces the user pool for sign-in", "Federate Google as an identity provider in the user pool, so sign-ins create user pool profiles"], "a": 3, "e": "Cognito User Pools support <b>federation<\/b> with external identity providers — social providers like Google/Facebook/Amazon/Apple, or enterprise SAML/OIDC providers — via the Hosted UI or custom UI integration. After a successful external sign-in, Cognito issues the same standard ID/Access/Refresh JWT tokens as it would for a native user, unifying the authentication experience.", "w": "(C) Identity pools exchange tokens for AWS credentials; user pools handle sign-in and profiles. (B) Cognito Sync synchronizes app data. (A) Passwords are never handled by your app; federation uses redirects."}, {"id": 1369342781, "d": "sec", "t": "cognito", "q": "What is the purpose of Cognito User Pool Groups, and how can they influence AWS access when combined with an Identity Pool?", "o": ["Groups can carry an IAM role, which an identity pool can map to users in that group", "Groups receive their own temporary credentials directly, without an identity pool", "Groups define which app clients users may sign in to, replacing app client settings", "Groups limit how many sign-in attempts users may make before an account is locked"], "a": 0, "e": "<b>User Pool Groups<\/b> can be assigned an IAM role and a precedence value. When the User Pool is used as an authentication provider for an <b>Identity Pool<\/b>, group membership (reflected in a claim in the user's token) can determine which IAM role the user assumes via the Identity Pool, enabling role-based access control for different classes of users (e.g. `Admins` vs `Standard Users`) accessing AWS resources directly.", "w": "(D) Lockout is part of advanced security features. (C) App clients are configured separately. (B) Credentials for AWS access come from an identity pool."}, {"id": 2080217198, "d": "sec", "t": "cognito", "q": "An Application Load Balancer needs to require users to authenticate via a Cognito User Pool before reaching the backend application, without the application implementing its own login page. What ALB feature supports this?", "o": ["Attach a Lambda authorizer to the ALB, which validates Cognito tokens in every request", "Enable an API key on the target group, which the user pool issues after sign-in", "Add an `authenticate-cognito` action to the listener rule, which redirects users to the hosted UI", "Terminate TLS on the ALB with a Cognito-issued certificate that identifies signed-in users"], "a": 2, "e": "An ALB listener rule can include an <b>authenticate-cognito<\/b> action, which transparently redirects unauthenticated users to the Cognito Hosted UI, handles the OAuth2/OIDC login flow, and then forwards the original request to the target group with user identity information included in request headers — offloading authentication from the application itself.", "w": "(A) Lambda authorizers are an API Gateway feature. (B) ALBs have no API keys. (D) Certificates identify servers, not signed-in users."}, {"id": 3069820994, "d": "sec", "t": "cognito", "q": "What is the key difference between Cognito Identity Pools' 'authenticated' and 'unauthenticated' identities?", "o": ["Guest identities are available only when the pool uses social identity providers", "Signed-in users get a role for authenticated users; guests get a separate, usually narrower role", "Signed-in users get a temporary token, while guests receive long-term AWS access keys", "Both identity types share one role, and guests are limited by session policies"], "a": 1, "e": "Identity Pools can be configured to support both roles: an <b>authenticated role<\/b> for users who signed in via a configured identity provider, and an <b>unauthenticated (guest) role<\/b> for users who haven't logged in but still need limited AWS access (e.g. to browse public content). Each maps to a separate IAM role, letting you apply appropriately different (typically far more restrictive for guests) permission sets.", "w": "(C) Both receive temporary credentials. (D) Each type has its own role. (A) Guest access is an identity pool setting, independent of providers."}, {"id": 1420120284, "d": "dev", "t": "stepfunctions", "q": "In a Step Functions state machine, what is the purpose of the 'Wait for a Task Token' service integration pattern?", "o": ["The task waits for a CloudWatch alarm to change state and then continues", "The task polls an SQS queue until a message with the token arrives", "The task waits for a fixed number of seconds that is stored in the token", "The task pauses until an external system calls `SendTaskSuccess` or `SendTaskFailure` with the token"], "a": 3, "e": "The <b>Wait for a Task Token<\/b> pattern generates a unique task token when the Task state is entered, and the state machine pauses (without polling or consuming resources) until some external system explicitly calls the Step Functions API with `SendTaskSuccess` or `SendTaskFailure` using that token — ideal for integrating human approval workflows or long-running third-party processes that don't fit a simple synchronous call.", "w": "(C) A fixed wait uses a Wait state. (A) Alarm-based waits are not part of this pattern. (B) The callback is an API call; there is no polling."}, {"id": 3033700097, "d": "dev", "t": "stepfunctions", "q": "What is AWS AppSync primarily used for?", "o": ["A managed workflow service that coordinates Lambda functions in a state machine", "A managed message broker that pushes events to mobile devices over MQTT", "A managed REST gateway that routes requests to Lambda and HTTP backends with usage plans", "A managed GraphQL service that resolves queries against DynamoDB, Lambda, RDS and HTTP data sources"], "a": 3, "e": "<b>AppSync<\/b> is a managed GraphQL service: clients define queries/mutations/subscriptions against a GraphQL schema, and resolvers connect fields in that schema to backend data sources (DynamoDB tables, Lambda functions, RDS via Data API, HTTP endpoints, etc.). It also supports real-time updates via GraphQL subscriptions and offline data sync for mobile clients.", "w": "(C) That is API Gateway. (B) That is IoT Core. (A) That is Step Functions."}, {"id": 3635647080, "d": "dev", "t": "stepfunctions", "q": "What is the primary tradeoff to consider when choosing between AWS Step Functions Standard and Express workflows for a given use case?", "o": ["Standard supports Lambda tasks only; Express supports all service integrations", "Standard is at-least-once and runs up to five minutes; Express is exactly-once and runs up to a year", "Standard is billed per execution duration and Express is billed per state transition", "Standard is exactly-once and runs up to a year; Express is cheaper at volume and runs up to five minutes"], "a": 3, "e": "The choice largely comes down to volume, duration, and execution guarantee needs: <b>Standard<\/b> workflows suit lower-volume, potentially long-running, auditable workflows needing exactly-once semantics and a persisted execution history; <b>Express<\/b> workflows suit high-volume, short-duration (up to 5 minutes) event-processing workloads where the different pricing model (and at-least-once/at-most-once semantics) is more cost-effective at scale.", "w": "(B) The properties are swapped. (C) Standard is billed per state transition and Express per requests and duration. (A) Both support service integrations."}, {"id": 1788018860, "d": "sec", "t": "iam-adv", "q": "What is the difference between `sts:AssumeRole` and `sts:AssumeRoleWithWebIdentity`?", "o": ["AssumeRole exchanges a token from an external provider; WithWebIdentity is called by an AWS identity", "AssumeRole is called by an AWS identity; WithWebIdentity exchanges an external identity provider token", "AssumeRole returns long-term keys; WithWebIdentity returns temporary credentials", "AssumeRole works only inside one account; WithWebIdentity works across accounts"], "a": 1, "e": "<b>AssumeRole<\/b> is called by an existing AWS IAM principal (a user or another role) to obtain temporary credentials for a different role, typically for cross-account access or privilege scoping. <b>AssumeRoleWithWebIdentity<\/b> is designed for identity federation: an application authenticates a user against an external web identity provider (getting back an OIDC/web identity token) and exchanges that token directly for temporary AWS credentials mapped to a specific IAM role, with no pre-existing AWS IAM identity required for that user.", "w": "(A) The descriptions are swapped. (C) Both return temporary credentials. (D) AssumeRole supports cross-account roles."}, {"id": 1668886704, "d": "sec", "t": "iam-adv", "q": "An organization wants to prevent any IAM user or role across an entire AWS account (even those with an `AdministratorAccess` policy) from ever disabling CloudTrail logging, regardless of what IAM policies are later attached to them. What AWS Organizations feature achieves this account-wide, tamper-resistant guardrail?", "o": ["A service control policy that denies the CloudTrail actions, which even administrators cannot override", "An IAM permissions boundary on the administrator role that excludes the CloudTrail actions", "A CloudTrail trail with log file validation, which prevents the trail from being stopped", "An IAM policy attached to the root user that denies the CloudTrail actions for the account"], "a": 0, "e": "<b>Service Control Policies (SCPs)<\/b> in AWS Organizations act as guardrails at the account/OU level, defining the maximum permissions available to any principal in that account — an explicit Deny in an SCP cannot be overridden by any IAM policy inside the account, including one attached to an administrator, making it the correct tool for enforcing organization-wide, tamper-resistant restrictions.", "w": "(B) A boundary applies only to the principals it is attached to, and an administrator can change it. (D) IAM policies do not restrict an account this way, and the root user can change them. (C) Log file validation detects tampering with logs; it does not stop a trail from being stopped."}, {"id": 3124309924, "d": "sec", "t": "iam-adv", "q": "An engineer with an IAM policy that includes `iam:PassRole` for a specific role ARN launches an EC2 instance and attaches that role to it. Why is the `iam:PassRole` permission specifically required for this action?", "o": ["The permission is needed because EC2 can only use roles that exist in the same region", "Passing a role to a service is privileged, and `iam:PassRole` prevents attaching more powerful roles", "The permission lets the engineer view and edit the policies of the role", "The permission lets the instance assume the role through the metadata service"], "a": 1, "e": "<b>`iam:PassRole`<\/b> exists specifically to control who can associate ('pass') an IAM role to an AWS resource (EC2 instance, Lambda function, etc.). Without requiring this permission, a lower-privileged user could attach a highly privileged role to a resource they control and effectively gain that role's permissions — so AWS requires this explicit, separate permission (ideally scoped to specific role ARNs) as a safeguard against this privilege escalation path.", "w": "(D) The instance uses its instance profile; PassRole controls who may attach the role. (A) IAM roles are global. (C) Viewing and editing policies need other iam permissions."}, {"id": 2609888353, "d": "sec", "t": "iam-adv", "q": "What is AWS Directory Service primarily used for?", "o": ["A single sign-on service that signs users in to AWS accounts without any directory", "A DNS service that resolves names between VPCs and on-premises networks", "Managed Microsoft AD (or an AD connector) for workloads that need Active Directory in AWS", "A managed LDAP directory that replaces IAM users and policies for AWS API access"], "a": 2, "e": "<b>AWS Directory Service<\/b> offers several options for integrating Microsoft Active Directory-based (or LDAP-compatible) authentication and directory services with AWS — including a fully managed AWS Managed Microsoft AD, an AD Connector that proxies authentication requests to an existing on-premises AD without replicating data, and a lightweight Simple AD — useful for workloads (like Windows-based applications, RDS SQL Server with Windows Authentication) that need real AD compatibility.", "w": "(D) IAM remains the access control for AWS APIs. (B) That is Route 53 Resolver. (A) That is IAM Identity Center."}, {"id": 1870598235, "d": "sec", "t": "security", "q": "What is the purpose of AWS CloudHSM, and how does it differ from AWS KMS?", "o": ["CloudHSM is a managed multi-tenant service that AWS controls; KMS gives you a dedicated HSM", "CloudHSM gives you a dedicated single-tenant HSM you control; KMS is a managed multi-tenant service", "CloudHSM stores keys in S3 with client-side encryption; KMS stores them in dedicated hardware", "CloudHSM is an older name for KMS that supports only symmetric keys"], "a": 1, "e": "<b>CloudHSM<\/b> gives customers dedicated, single-tenant hardware security module devices, meeting higher compliance bars (like FIPS 140-2 Level 3) and giving the customer exclusive administrative control over the HSM and its keys (AWS itself cannot access the key material). <b>KMS<\/b> is a fully managed, multi-tenant service built on HSMs that AWS operates and manages on the customer's behalf, trading some of that low-level control for operational simplicity and deep AWS service integration.", "w": "(A) The descriptions are swapped. (C) CloudHSM keys stay in hardware modules. (D) They are separate services; CloudHSM supports symmetric and asymmetric keys."}, {"id": 546374210, "d": "sec", "t": "security", "q": "What is the purpose of an AWS Nitro Enclave?", "o": ["An isolated VM carved out of an EC2 instance with no network or persistent storage, for sensitive processing", "A managed service that stores encryption keys in hardware and rotates them automatically", "A VPC subnet type that blocks all traffic except connections from your corporate network", "A dedicated physical host that runs only your instances and satisfies per-socket licensing"], "a": 0, "e": "<b>Nitro Enclaves<\/b> let you partition off an isolated compute environment from an EC2 instance to process highly sensitive data (e.g. PII, cryptographic key material) with strong isolation guarantees — no persistent storage, no interactive shell access, and no external networking (communication only via a secure local channel to the parent instance) — reducing the attack surface even from the parent instance's own administrators.", "w": "(D) That is a Dedicated Host. (C) Subnets are not enclaves. (B) That is CloudHSM or KMS."}, {"id": 2717908571, "d": "sec", "t": "security", "q": "When using envelope encryption with the AWS Encryption SDK (as opposed to calling KMS `Encrypt` directly), why is this pattern preferred for encrypting large payloads?", "o": ["It encrypts data locally with a data key, which avoids the 4 KB limit of KMS Encrypt", "It encrypts data inside KMS, which supports payloads up to 4 GB per call", "It encrypts data with the public key of an asymmetric KMS key, which is faster for large data", "It avoids KMS calls altogether by storing the master key in the application"], "a": 0, "e": "The KMS `Encrypt` API has a payload size limit (4 KB for symmetric keys), making it unsuitable for directly encrypting larger data. The <b>AWS Encryption SDK<\/b> implements the envelope encryption pattern automatically: generate a local plaintext data key via KMS, encrypt the actual (potentially large) data with it locally, then store the KMS-encrypted version of that data key alongside the ciphertext — solving both the size limitation and providing efficient local encryption.", "w": "(B) KMS Encrypt handles at most 4 KB. (C) Asymmetric encryption is slower and limited in size. (D) The data key is protected by KMS and the master key never leaves KMS."}, {"id": 4045019860, "d": "sec", "t": "security", "q": "An application needs to retrieve a Parameter Store `SecureString` parameter and have it automatically decrypted, assuming the caller has the necessary KMS permissions. Which API call and parameter is required?", "o": ["Call `DescribeParameters` with the parameter name, which returns the decrypted value", "Call `GetParameter` with `Decrypt: true`; the caller needs only `ssm:GetParameter`", "Call `GetParametersByPath` with `WithDecryption`, which works only for String parameters", "Call `GetParameter` with `WithDecryption` set to true; the caller also needs `kms:Decrypt`"], "a": 3, "e": "When retrieving a `SecureString` parameter via the Systems Manager API, setting <b>`WithDecryption: true`<\/b> on `GetParameter`/`GetParameters` instructs SSM to decrypt the value (using the associated KMS key) before returning it — provided the caller has the necessary `kms:Decrypt` permission on that key, in addition to `ssm:GetParameter` permission on the parameter itself.", "w": "(B) The flag is called WithDecryption, and KMS permission is also needed. (A) DescribeParameters returns metadata only. (C) GetParametersByPath decrypts SecureString parameters too."}, {"id": 492012116, "d": "dev", "t": "other", "q": "What is Amazon Athena, and what is its primary use case?", "o": ["Athena is a managed data warehouse that loads data from S3 into provisioned nodes first", "Athena runs SQL queries directly on data in S3, with no servers to manage", "Athena is a managed Hadoop cluster service for running MapReduce jobs on S3 data", "Athena is a managed relational database that replicates S3 buckets into tables"], "a": 1, "e": "<b>Athena<\/b> is a serverless query service built on Presto that lets you run SQL queries directly against data sitting in S3, using a schema defined via a Glue Data Catalog (or Athena's own catalog) — there's no infrastructure to provision or manage, and pricing is based on the amount of data scanned per query, making it well suited for ad hoc analytics on data lakes.", "w": "(A) That is Redshift. (C) That is EMR. (D) Athena does not copy data; it queries it in place."}, {"id": 931881986, "d": "dev", "t": "other", "q": "What is the primary purpose of Amazon OpenSearch Service (formerly Amazon Elasticsearch Service)?", "o": ["A managed search and log analytics service based on OpenSearch, with dashboards", "A managed index of all S3 objects in an account that you can search by metadata", "A managed relational database for transactional workloads with full-text indexes", "A managed graph database for storing and querying highly connected data"], "a": 0, "e": "<b>OpenSearch Service<\/b> provides managed clusters running the OpenSearch (or legacy Elasticsearch) engine, commonly used for full-text search functionality within applications, centralized log analytics (often paired with CloudWatch Logs subscriptions or Kinesis Data Firehose for ingestion), and building near-real-time operational dashboards.", "w": "(C) That is RDS or Aurora. (B) S3 has no such account-wide search service; Inventory with Athena can list objects. (D) That is Neptune."}, {"id": 107457093, "d": "dev", "t": "other", "q": "What is Amazon MSK (Managed Streaming for Apache Kafka) designed for?", "o": ["A managed message queue with Kafka compatibility for FIFO ordering only", "A managed AWS-native streaming service that replaces the Kafka API with its own", "A managed ETL service that reads from Kafka topics and loads them into S3 only", "A managed Apache Kafka service that runs brokers for you and keeps the Kafka API"], "a": 3, "e": "<b>MSK<\/b> provides a managed Apache Kafka experience — provisioning and operating brokers, handling patching/replication/scaling operational overhead — for teams who specifically want Kafka's ecosystem, client libraries, and semantics (rather than switching to a different, AWS-native streaming service like Kinesis), often because of existing Kafka-based tooling or expertise.", "w": "(B) The AWS-native streaming service is Kinesis. (A) MSK provides full Kafka, not only FIFO queues. (C) MSK is a Kafka cluster, not an ETL service."}, {"id": 3573445591, "d": "sec", "t": "other", "q": "What is the purpose of AWS Certificate Manager (ACM), and where can its issued public certificates typically be used?", "o": ["ACM issues certificates only for domains registered in Route 53", "ACM issues certificates that you must renew manually every 13 months", "ACM issues certificates whose private keys you can download and install on EC2 web servers", "ACM issues free public certificates and renews them for ELB, CloudFront and API Gateway"], "a": 3, "e": "<b>ACM<\/b> issues and automatically renews public TLS/SSL certificates (or manages imported ones) for use directly with supported AWS services — most commonly CloudFront, Application/Network Load Balancers, and API Gateway — simplifying HTTPS setup. A key limitation is that the private keys of ACM-issued public certificates cannot be extracted/exported, so they can't be installed directly onto an EC2 instance's own web server software (unless using ACM Private CA for a different certificate type/workflow).", "w": "(C) Private keys of ACM public certificates cannot be exported. (A) Domains can be validated by DNS or email at any registrar. (B) ACM renews automatically."}, {"id": 2080089435, "d": "sec", "t": "other", "q": "What is the purpose of Amazon Macie?", "o": ["Macie records configuration changes and evaluates them against compliance rules", "Macie uses machine learning to find and classify sensitive data such as personal information in S3", "Macie detects compromised credentials by analyzing CloudTrail and DNS logs", "Macie scans EC2 instances for vulnerabilities and unintended network exposure"], "a": 1, "e": "<b>Macie<\/b> continuously scans S3 buckets (or scans on-demand) using machine learning and pattern-matching to identify sensitive data such as personally identifiable information (PII), credentials, or financial data, and generates findings to alert security teams to unexpected or risky exposure of that data — helping with data security and compliance posture.", "w": "(D) That is Amazon Inspector. (A) That is AWS Config. (C) That is GuardDuty."}, {"id": 2341064872, "d": "dev", "t": "other", "q": "What is the purpose of AWS AppConfig's validation feature when rolling out a new configuration or feature flag?", "o": ["You attach a deployment strategy that releases the configuration to a percentage of clients", "You attach a CloudWatch alarm th
