: "Parameter Store"}, {"id": 1036669885, "t": "exam", "f": "Keyword to service: feature flags, gradual config rollout", "b": "AppConfig"}, {"id": 1184224621, "t": "exam", "f": "Keyword to service: temporary credentials for app users", "b": "Cognito Identity Pool, STS"}, {"id": 152625487, "t": "exam", "f": "Keyword to service: who called which API", "b": "CloudTrail"}, {"id": 3133689510, "t": "exam", "f": "Keyword to service: trace a request across services", "b": "X-Ray"}, {"id": 1218451354, "t": "exam", "f": "Keyword to service: encrypt large data", "b": "envelope encryption (GenerateDataKey)"}, {"id": 1430824302, "t": "exam", "f": "Keyword to service: zero-downtime deployment", "b": "Immutable / blue-green / CodeDeploy canary"}, {"id": 1603881529, "t": "lambda", "f": "Lambda: max timeout (default 3 s)", "b": "15 min"}, {"id": 642483756, "t": "lambda", "f": "Lambda: memory (CPU scales)", "b": "128 MB - 10 GB"}, {"id": 4021109111, "t": "lambda", "f": "Lambda: /tmp max", "b": "10 GB"}, {"id": 1725656847, "t": "lambda", "f": "Lambda: environment variables", "b": "4 KB"}, {"id": 2621203000, "t": "lambda", "f": "Lambda: zip upload / unzipped incl. layers", "b": "50 MB / 250 MB"}, {"id": 3616506743, "t": "lambda", "f": "Lambda: container image", "b": "10 GB"}, {"id": 3082968538, "t": "lambda", "f": "Lambda: layers per function", "b": "5"}, {"id": 1428061233, "t": "lambda", "f": "Lambda: default concurrency per region", "b": "1,000"}, {"id": 2457946407, "t": "lambda", "f": "Lambda: sync / async payload", "b": "6 MB / 256 KB"}, {"id": 3585295935, "t": "apigw", "f": "API Gateway: integration timeout", "b": "29 s"}, {"id": 1972275007, "t": "apigw", "f": "API Gateway: payload", "b": "10 MB"}, {"id": 4216195796, "t": "apigw", "f": "API Gateway: cache TTL default (max 3,600)", "b": "300 s"}, {"id": 940329628, "t": "apigw", "f": "API Gateway: account rate / burst per second", "b": "10,000 / 5,000"}, {"id": 2949730598, "t": "messaging", "f": "SQS and SNS: message size", "b": "256 KB"}, {"id": 2607189051, "t": "messaging", "f": "SQS and SNS: retention default (1 min - 14 days)", "b": "4 days"}, {"id": 3773792157, "t": "messaging", "f": "SQS and SNS: visibility timeout default (0 - 12 h)", "b": "30 s"}, {"id": 2478836968, "t": "messaging", "f": "SQS and SNS: delay", "b": "0 - 15 min"}, {"id": 160938904, "t": "messaging", "f": "SQS and SNS: long polling max", "b": "20 s"}, {"id": 4146236485, "t": "messaging", "f": "SQS and SNS: FIFO (3,000 with batching)", "b": "300 /s"}, {"id": 795045322, "t": "messaging", "f": "SQS and SNS: messages per batch", "b": "10"}, {"id": 3913714688, "t": "messaging", "f": "Kinesis Data Streams: write per shard", "b": "1 MB/s or 1,000/s"}, {"id": 152486989, "t": "messaging", "f": "Kinesis Data Streams: read per shard (shared)", "b": "2 MB/s"}, {"id": 3994344562, "t": "messaging", "f": "Kinesis Data Streams: per consumer with Enhanced Fan-Out", "b": "2 MB/s"}, {"id": 3275860807, "t": "messaging", "f": "Kinesis Data Streams: retention", "b": "24 h - 365 d"}, {"id": 3751529923, "t": "messaging", "f": "Kinesis Data Streams: record size", "b": "1 MB"}, {"id": 4279767535, "t": "dynamodb", "f": "DynamoDB: item size", "b": "400 KB"}, {"id": 3127139022, "t": "dynamodb", "f": "DynamoDB: RCU / WCU unit size", "b": "4 KB / 1 KB"}, {"id": 2068576450, "t": "dynamodb", "f": "DynamoDB: Query/Scan page", "b": "1 MB"}, {"id": 469707116, "t": "dynamodb", "f": "DynamoDB: BatchGetItem", "b": "100 / 16 MB"}, {"id": 3751715376, "t": "dynamodb", "f": "DynamoDB: BatchWriteItem", "b": "25 / 16 MB"}, {"id": 4007030569, "t": "dynamodb", "f": "DynamoDB: transaction", "b": "100 / 4 MB"}, {"id": 3856732832, "t": "dynamodb", "f": "DynamoDB: LSI / GSI per table", "b": "5 / 20"}, {"id": 656843985, "t": "dynamodb", "f": "DynamoDB: stream retention", "b": "24 h"}, {"id": 2510030315, "t": "dynamodb", "f": "DynamoDB: PITR", "b": "35 days"}, {"id": 3983152425, "t": "s3", "f": "S3: object max", "b": "5 TB"}, {"id": 4082875298, "t": "s3", "f": "S3: single PUT max", "b": "5 GB"}, {"id": 1969328292, "t": "s3", "f": "S3: write / read requests per second per prefix", "b": "3,500 / 5,500"}, {"id": 3397916438, "t": "s3", "f": "S3: Glacier Flexible / Deep Archive minimum", "b": "90 / 180 days"}, {"id": 1898568388, "t": "s3", "f": "S3: multipart parts max", "b": "10,000"}, {"id": 882255039, "t": "limits", "f": "Other: CloudFormation resources per stack", "b": "500"}, {"id": 1335931797, "t": "limits", "f": "Other: Parameter Store standard / advanced", "b": "4 KB / 8 KB"}, {"id": 1958738872, "t": "limits", "f": "Other: Secrets Manager secret", "b": "64 KB"}, {"id": 3650806013, "t": "limits", "f": "Other: KMS Encrypt data", "b": "4 KB"}, {"id": 970836336, "t": "limits", "f": "Other: CodeBuild timeout", "b": "5 min - 36 h"}, {"id": 2507160955, "t": "limits", "f": "Other: Beanstalk application versions", "b": "1,000"}, {"id": 2079777994, "t": "limits", "f": "Other: X-Ray default sampling", "b": "1 /s + 5%"}, {"id": 3384550335, "t": "limits", "f": "Other: ELB deregistration delay, ASG cooldown and grace period", "b": "300 s"}, {"id": 1285521286, "t": "limits", "f": "Other: reserved IPs per subnet", "b": "5"}, {"id": 3804315665, "t": "limits", "f": "Other: RDS backup retention max", "b": "35 days"}, {"id": 2266464023, "t": "iam", "f": "Policy types: Identity-based", "b": "Attached to: user, group, role; Effect: grants permissions"}, {"id": 3968745079, "t": "iam", "f": "Policy types: Resource-based", "b": "Attached to: S3, SQS, SNS, Lambda, KMS (has Principal); Effect: grants access to the resource, also cross-account"}, {"id": 3834120056, "t": "iam", "f": "Policy types: Permissions boundary", "b": "Attached to: one user or role; Effect: maximum permissions (never grants)"}, {"id": 4065169435, "t": "iam", "f": "Policy types: SCP", "b": "Attached to: account or OU in Organizations; Effect: maximum permissions for the whole account"}, {"id": 2815893143, "t": "iam", "f": "Policy types: Session policy", "b": "Attached to: an assumed-role x: fix health checks, security groups"}, {"id": 1470103251, "t": "troubleshoot", "f": "Symptom finder: ASG launch/terminate loop", "b": "Likely cause: health check grace period too short; Fix: increase grace period, fix app boot"}, {"id": 1174672266, "t": "troubleshoot", "f": "Symptom finder: EC2 SSH timeout", "b": "Likely cause: security group / NACL / route; Fix: open port 22 from your IP, check route"}, {"id": 2092422739, "t": "troubleshoot", "f": "Symptom finder: CodeBuild: Cannot connect to Docker daemon", "b": "Likely cause: privileged mode off; Fix: enable privileged mode"}, {"id": 3164595491, "t": "troubleshoot", "f": "Symptom finder: CodeDeploy hook failed", "b": "Likely cause: script error, agent, permissions; Fix: agent and scripts.log, instance profile"}, {"id": 3415854436, "t": "troubleshoot", "f": "Symptom finder: AccessDenied though policy allows", "b": "Likely cause: explicit deny, SCP, boundary, resource/KMS policy; Fix: policy simulator, CloudTrail, decode-authorization-message"}, {"id": 619388978, "t": "troubleshoot", "f": "Symptom finder: KMS ThrottlingException", "b": "Likely cause: too many KMS calls; Fix: S3 Bucket Keys, data key caching, backoff, quota increase"}, {"id": 3791978701, "t": "troubleshoot", "f": "Symptom finder: Too many DB connections from Lambda", "b": "Likely cause: one connection per environment; Fix: RDS Proxy, limit concurrency"}, {"id": 3762808173, "t": "troubleshoot", "f": "Symptom finder: No internet from private subnet", "b": "Likely cause: missing route to NAT gateway; Fix: route 0.0.0.0/0 to NAT in a public subnet"}, {"id": 1149152063, "t": "troubleshoot", "f": "Symptom finder: Stale CloudFront content", "b": "Likely cause: cached until TTL; Fix: invalidation or versioned file names"}, {"id": 2049729963, "t": "troubleshoot", "f": "Symptom finder: X-Ray traces missing", "b": "Likely cause: no instrumentation / permissions / sampling; Fix: SDK, xray:PutTraceSegments, daemon, sampling rules"}, {"id": 105251905, "t": "other", "f": "Quick reference: Athena", "b": "serverless SQL on S3, pay per data scanned (use Parquet, partition)"}, {"id": 3408661900, "t": "other", "f": "Quick reference: OpenSearch", "b": "managed search and log analytics"}, {"id": 509973358, "t": "other", "f": "Quick reference: MSK", "b": "managed Apache Kafka"}, {"id": 1899065745, "t": "other", "f": "Quick reference: ACM", "b": "free public TLS certs, auto-renew, not exportable"}, {"id": 2133384705, "t": "other", "f": "Quick reference: Macie", "b": "finds sensitive data (PII) in S3"}, {"id": 1269375339, "t": "other", "f": "Quick reference: AppConfig", "b": "feature flags and config with validators and gradual rollout"}, {"id": 1554360659, "t": "other", "f": "Quick reference: GuardDuty", "b": "threat detection from CloudTrail, VPC Flow, DNS logs"}, {"id": 122836410, "t": "other", "f": "Quick reference: Inspector", "b": "vulnerability scanning (EC2, ECR, Lambda)"}, {"id": 3899613763, "t": "other", "f": "Quick reference: WAF", "b": "layer 7 firewall for ALB, CloudFront, API Gateway"}, {"id": 2050836045, "t": "other", "f": "Quick reference: Shield", "b": "DDoS protection"}, {"id": 3848331118, "t": "other", "f": "Quick reference: SES", "b": "send email"}, {"id": 235527840, "t": "other", "f": "Quick reference: Systems Manager", "b": "Parameter Store, Session Manager, Run Command, Patch Manager"}], "O": [{"id": "o-codedeploy", "t": "cicd", "title": "CodeDeploy in-place hooks", "prompt": "Put the lifecycle events of an in-place EC2 deployment in order.", "steps": ["ApplicationStop", "DownloadBundle", "BeforeInstall", "Install", "AfterInstall", "ApplicationStart", "ValidateService"], "note": "With a load balancer there are extra hooks around traffic (BeforeBlockTraffic ... AfterAllowTraffic)."}, {"id": "o-iam-eval", "t": "iam", "title": "How IAM decides", "prompt": "Order the steps of policy evaluation.", "steps": ["Start from an implicit deny", "Any explicit Deny in any policy? Then the request is denied", "The Organizations SCP must allow the action", "The permissions boundary must allow the action", "An identity or resource policy must contain an Allow"], "note": "An explicit Deny always wins; without any Allow the default deny stays."}, {"id": "o-envelope", "t": "security", "title": "Envelope encryption", "prompt": "Order the steps to encrypt and later read a large file with KMS.", "steps": ["Call GenerateDataKey", "Encrypt the file locally with the plaintext data key", "Discard the plaintext data key", "Store the ciphertext together with the encrypted data key", "To read, send the encrypted data key to KMS Decrypt", "Decrypt the file locally with the returned key"], "note": "KMS Encrypt handles only 4 KB, which is why data keys exist."}, {"id": "o-buildspec", "t": "cicd", "title": "buildspec phases", "prompt": "Order the CodeBuild phases.", "steps": ["install: runtimes and dependencies", "pre_build: logins and setup", "build: compile, test, docker build", "post_build: push images, notifications"], "note": "Artifacts and cache are declared after the phases."}, {"id": "o-cognito", "t": "cognito", "title": "Cognito end to end", "prompt": "Order the steps from sign-in to an S3 call.", "steps": ["The user signs in to the User Pool", "The User Pool returns ID, access and refresh tokens", "The app sends the ID token to the Identity Pool", "The Identity Pool gets credentials for the mapped IAM role from STS", "The app calls S3 with the temporary credentials"], "note": "User Pool = who you are (JWTs); Identity Pool = AWS credentials."}, {"id": "o-presigned", "t": "s3", "title": "Pre-signed upload", "prompt": "Order the steps of a direct browser upload to S3.", "steps": ["The browser asks the backend for an upload URL", "The backend signs a PutObject URL with its own role credentials", "The backend returns the URL with an expiry time", "The browser uploads the file straight to S3 with that URL", "S3 validates the signature and stores the object"], "note": "The file bytes never pass through your backend."}, {"id": "o-ddb-page", "t": "dynamodb", "title": "DynamoDB pagination", "prompt": "Order the steps to read all pages of a Query.", "steps": ["Send the first Query request", "Process the returned items", "Check the response for LastEvaluatedKey", "Send the next Query with ExclusiveStartKey set to that key", "Stop when no LastEvaluatedKey is returned"], "note": "A page is at most 1 MB, so large results span several calls."}, {"id": "o-fanout", "t": "messaging", "title": "SNS to SQS fan-out", "prompt": "Order what happens after an S3 upload.", "steps": ["S3 publishes the event to an SNS topic", "SNS delivers a copy to each subscribed SQS queue", "Each consumer polls its own queue", "A consumer processes the message", "The consumer deletes the message from its queue"], "note": "Deleting the message is what prevents it from reappearing after the visibility timeout."}, {"id": "o-pipeline", "t": "cicd", "title": "Release pipeline", "prompt": "Order the stages of a pipeline with an approval.", "steps": ["A developer pushes to the repository", "An EventBridge rule starts the pipeline", "CodeBuild builds and tests the code", "The artifact is stored in S3", "A reviewer approves the release", "CodeDeploy deploys to production"], "note": "Manual approval is a CodePipeline action placed before the deploy stage."}, {"id": "o-bg", "t": "beanstalk", "title": "Beanstalk blue/green", "prompt": "Order the steps of a blue/green release.", "steps": ["Clone the current environment", "Deploy the new version to the clone", "Test the clone", "Swap the environment URLs (CNAME swap)", "Terminate the old environment after verification"], "note": "Keep the database outside the environment, otherwise it goes away with it."}, {"id": "o-changeset", "t": "cfn", "title": "CloudFormation change set", "prompt": "Order the update flow with a change set.", "steps": ["Create a change set from the new template", "Review the proposed changes", "Execute the change set", "CloudFormation updates resources in dependency order", "On failure it rolls back to the previous state"], "note": "Replacements create the new resource first and delete the old one afterwards."}, {"id": "o-sam", "t": "sam", "title": "SAM workflow", "prompt": "Order the commands of a first SAM deployment.", "steps": ["sam init creates the project", "sam build prepares the artifacts", "sam local invoke tests the function with Docker", "sam deploy --guided packages and deploys", "CloudFormation creates the stack"], "note": "--guided saves your answers to samconfig.toml."}, {"id": "o-async", "t": "lambda", "title": "Async invocation", "prompt": "Order what happens when a function fails after an asynchronous call.", "steps": ["The event source invokes the function asynchronously", "Lambda queues the event and answers 202", "The function runs and fails", "Lambda retries (two more attempts)", "After the last failure the event goes to the DLQ or on-failure destination"], "note": "Synchronous callers get the error directly and decide on retries themselves."}, {"id": "o-sqs", "t": "messaging", "title": "SQS message life", "prompt": "Order the life of one message in a standard queue.", "steps": ["A producer sends the message", "A consumer receives it", "The message is hidden for the visibility timeout", "The consumer finishes and deletes it", "Otherwise the message reappears for another consumer"], "note": "Set the timeout to at least 6x the Lambda timeout when Lambda consumes the queue."}], "M": [{"id": "m-messaging", "t": "messaging", "title": "Messaging services", "prompt": "Match each service with what it is best at.", "pairs": [["SQS Standard", "Queue with at-least-once delivery"], ["SQS FIFO", "Strict order per message group"], ["SNS", "Push fan-out to many subscribers"], ["Kinesis Data Streams", "Ordered shards with replay"], ["Data Firehose", "Managed delivery into S3 or Redshift"], ["EventBridge", "Event routing by rules and schedules"]], "note": "Decouple = SQS, fan-out = SNS, replay and many consumers = Kinesis."}, {"id": "m-security", "t": "other", "title": "Security services", "prompt": "Match each service with its job.", "pairs": [["GuardDuty", "Threat detection from logs"], ["Inspector", "Vulnerability scanning of instances and images"], ["Macie", "Finds sensitive data in S3"], ["WAF", "Filters HTTP requests (SQLi, XSS)"], ["Shield", "DDoS protection"], ["Config", "Configuration history and compliance"]], "note": "Different tools answer different questions: threats, vulnerabilities, data, requests, DDoS, drift."}, {"id": "m-s3class", "t": "s3", "title": "S3 storage classes", "prompt": "Match each class with its trait.", "pairs": [["Standard", "Frequent access, no minimum duration"], ["Standard-IA", "30-day minimum, retrieval fee"], ["One Zone-IA", "Infrequent access in a single AZ"], ["Intelligent-Tiering", "Automatic tiering, no retrieval fee"], ["Glacier Flexible", "Minutes to hours to retrieve"], ["Glacier Deep Archive", "180-day minimum, 12 hours or more"]], "note": "Archive classes trade retrieval time for price."}, {"id": "m-r53", "t": "r53", "title": "Route 53 routing policies", "prompt": "Match each policy with its use.", "pairs": [["Weighted", "Split traffic by percentage"], ["Latency", "Send users to the fastest region"], ["Failover", "Primary with health-checked secondary"], ["Geolocation", "Route by the user's country"], ["Geoproximity", "Distance with a bias"], ["Multi-value", "Return several healthy records"]], "note": "Failover needs a health check on the primary."}, {"id": "m-beanstalk", "t": "beanstalk", "title": "Beanstalk deployment policies", "prompt": "Match each policy with its trait.", "pairs": [["All at once", "Fastest, causes downtime"], ["Rolling", "Batches, reduced capacity"], ["Rolling with additional batch", "Full capacity, small extra cost"], ["Immutable", "New ASG, fastest rollback"], ["Traffic splitting", "Canary percentage of traffic"], ["Blue/Green", "Swap environment URLs"]], "note": "Blue/green is not a built-in policy; it is a manual CNAME swap."}, {"id": "m-kms", "t": "security", "title": "KMS and friends", "prompt": "Match each concept with its description.", "pairs": [["AWS owned key", "Invisible and free, no control"], ["AWS managed key", "aws/s3 style, rotated yearly, policy not editable"], ["Customer managed key", "You control policy and rotation"], ["Asymmetric key", "Public key can be downloaded"], ["CloudHSM", "Dedicated single-tenant HSM"], ["Multi-Region key", "Same key ID in several regions"]], "note": "KMS keys are regional unless they are multi-Region keys."}, {"id": "m-codedeploy", "t": "cicd", "title": "CodeDeploy strategies", "prompt": "Match each strategy with where it applies.", "pairs": [["In-place EC2", "Appspec hooks on existing instances"], ["Blue/green EC2", "New ASG behind a load balancer"], ["Lambda Canary", "A small share first, then the rest"], ["Lambda Linear", "Equal increments at intervals"], ["ECS blue/green", "ALB test listener and task sets"], ["HalfAtATime", "EC2 configuration updating half the fleet"]], "note": "Lambda deployments shift alias traffic between versions."}, {"id": "m-elb", "t": "elb-asg", "title": "Load balancer types", "prompt": "Match each load balancer with its trait.", "pairs": [["ALB", "Layer 7 path and host routing"], ["NLB", "Layer 4 with static IPs"], ["GWLB", "Virtual appliances over GENEVE"], ["CLB", "Legacy, one certificate"]], "note": "Need a fixed IP? NLB. Need content routing? ALB."}, {"id": "m-monitor", "t": "monitoring", "title": "Which tool answers it", "prompt": "Match each question with the right tool.", "pairs": [["Which API call deleted it, and who made it?", "CloudTrail"], ["Which service in the chain is slow?", "X-Ray"], ["What do the application logs say?", "CloudWatch Logs Insights"], ["Was traffic accepted or rejected in the VPC?", "VPC Flow Logs"], ["Did a resource drift from its template?", "CloudFormation drift detection"], ["React to an AWS event or a schedule?", "EventBridge"]], "note": "CloudWatch = metrics and logs, X-Ray = tracing, CloudTrail = audit."}, {"id": "m-apigw-codes", "t": "apigw", "title": "API Gateway status codes", "prompt": "Match each code with its usual meaning.", "pairs": [["400", "Validation failed"], ["403", "Auth denied or no such route"], ["429", "Throttled"], ["502", "Invalid backend response"], ["503", "Backend unavailable"], ["504", "Integration timeout (29 s)"]], "note": "A malformed Lambda proxy response gives 502."}, {"id": "m-ddb", "t": "dynamodb", "title": "DynamoDB features", "prompt": "Match each feature with its purpose.", "pairs": [["TTL", "Free automatic expiry of items"], ["Streams", "Ordered 24-hour change log"], ["DAX", "Microsecond in-memory cache"], ["Global Tables", "Multi-region active-active"], ["PITR", "Restore to any second in 35 days"], ["GSI", "Query by other keys"]], "note": "A throttled GSI throttles writes to the base table."}, {"id": "m-lambda", "t": "lambda", "title": "Lambda features", "prompt": "Match each feature with what it does.", "pairs": [["Reserved concurrency", "Guarantees and caps capacity"], ["Provisioned concurrency", "Pre-warmed environments, no cold starts"], ["SnapStart", "Restores from an initialized snapshot"], ["Layers", "Shared libraries, up to five"], ["Destinations", "Route async results to SQS, SNS, Lambda, EventBridge"], ["Function URL", "Built-in HTTPS endpoint"]], "note": "Reserved does not pre-warm; provisioned does."}, {"id": "m-cognito", "t": "cognito", "title": "Cognito pieces", "prompt": "Match each piece with its role.", "pairs": [["User Pool", "Authentication and JWTs"], ["Identity Pool", "Temporary AWS credentials"], ["Hosted UI", "Ready-made sign-in pages"], ["Pre token generation", "Lambda trigger that adds claims"], ["Cognito authorizer", "API Gateway validates the token"], ["authenticate-cognito", "ALB action that logs the user in first"]], "note": "The refresh token is never sent to your API."}, {"id": "m-iam", "t": "iam", "title": "Types of IAM policy", "prompt": "Match each policy type with its place.", "pairs": [["Identity-based policy", "Attached to a user, group or role"], ["Resource-based policy", "Attached to S3, SQS, KMS with a Principal"], ["Permissions boundary", "Maximum permissions of one identity"], ["SCP", "Guardrail for whole accounts"], ["Session policy", "Limits an assumed-role session"], ["Trust policy", "Says who may assume a role"]], "note": "Boundaries and SCPs never grant permissions by themselves."}], "S": [{"id": "s-apigw502", "topic": "apigw", "title": "API Gateway returns 502", "intro": "A REST API with a Lambda proxy integration returns 502 Bad Gateway. The function works when tested in the Lambda console.", "start": "n1", "lesson": "502 from a proxy integration usually means the Lambda response is not shaped like {statusCode, headers, body}.", "nodes": {"n1": {"q": "What do you check first?", "opts": [["The function's logs and the shape of the response it returns", "n2", "Right: 502 points at an invalid backend response."], ["Increase the API Gateway cache TTL", "x", "Caching does not cause a 502."], ["Add provisioned concurrency", "x", "Cold starts cause latency, not a 502."]]}, "n2": {"q": "The function returns a plain string. What is the fix?", "opts": [["Return an object with statusCode, headers and a string body", null, "Correct."], ["Raise the integration timeout", "x", "The call did not time out; the response is invalid."], ["Enable CORS on the method", "x", "CORS is about browsers, not about the response format."]]}}, "t": "apigw"}, {"id": "s-lambda-vpc", "topic": "lambda", "title": "Lambda in a VPC cannot reach the internet", "intro": "A function attached to private subnets times out when it calls a public payment API.", "start": "n1", "lesson": "A Lambda in a VPC needs a NAT gateway (or VPC endpoints for AWS services) to reach anything outside.", "nodes": {"n1": {"q": "What do you inspect first?", "opts": [["The route table of the function's subnets", "n2", "Right: connectivity comes down to routing."], ["The function's memory setting", "x", "Memory does not add a route."], ["The function timeout", "x", "A longer timeout only waits longer for a connection that cannot succeed."]]}, "n2": {"q": "There is only the local route. What do you add?", "opts": [["A NAT gateway in a public subnet and a 0.0.0.0/0 route to it", null, "Correct."], ["An internet gateway attached to the private subnet", "x", "Instances with private addresses cannot use an internet gateway directly."], ["The API's IP address to the function's security group inbound rules", "x", "Outbound traffic is not controlled by inbound rules."]]}}, "t": "lambda"}, {"id": "s-ddb-throttle", "topic": "dynamodb", "title": "DynamoDB writes are throttled", "intro": "Writes are throttled although the table's total consumed capacity looks low.", "start": "n1", "lesson": "Throttling can come from a hot partition key or from a GSI that cannot keep up.", "nodes": {"n1": {"q": "What do you look at first?", "opts": [["Key distribution and the capacity of every GSI", "n2", "Right: capacity is divided by partition and each GSI has its own."], ["Enable DynamoDB Streams", "x", "Streams do not change throttling."], ["Delete and recreate the table", "x", "That does not address the cause."]]}, "n2": {"q": "One GSI has little write capacity. What is the fix?", "opts": [["Raise the GSI write capacity (or use on-demand mode)", null, "Correct: a throttled GSI throttles the base table."], ["Raise only the table's read capacity", "x", "Reads and writes use separate capacity."], ["Convert the GSI into an LSI", "x", "An LSI cannot be added to an existing table."]]}}, "t": "dynamodb"}, {"id": "s-s3-kms", "topic": "s3", "title": "Uploads fail with AccessDenied", "intro": "A role has s3:PutObject on the bucket, but uploads fail. The bucket uses default encryption with a customer managed KMS key.", "start": "n1", "lesson": "With SSE-KMS the caller also needs permission to use the key, in the IAM policy and the key policy.", "nodes": {"n1": {"q": "What do you suspect?", "opts": [["Missing permission to use the KMS key", "n2", "Right: S3 calls KMS on behalf of the caller."], ["Versioning is enabled on the bucket", "x", "Versioning does not block uploads."], ["The wrong region endpoint", "x", "That gives a different error."]]}, "n2": {"q": "Which permissions do you grant?", "opts": [["kms:GenerateDataKey and kms:Decrypt on that key (and allow the role in the key policy)", null, "Correct."], ["iam:PassRole on the key", "x", "PassRole applies to roles, not to keys."], ["s3:PutBucketPolicy on the bucket", "x", "The problem is the key, not the bucket policy."]]}}, "t": "s3"}, {"id": "s-ecs-pull", "topic": "ecs", "title": "Fargate task cannot pull its image", "intro": "A Fargate task in a private subnet stops with CannotPullContainerError.", "start": "n1", "lesson": "Pulling needs a network path to ECR (NAT or endpoints) and an execution role with ECR permissions.", "nodes": {"n1": {"q": "What do you check first?", "opts": [["The network path to ECR and the task execution role", "n2", "Right: both are needed to pull."], ["Increase the task CPU and memory", "x", "Size does not affect pulling."], ["Change the container port", "x", "Ports matter after the container starts."]]}, "n2": {"q": "The subnet has no NAT gateway and no endpoints. What do you add?", "opts": [["A NAT gateway, or VPC endpoints for ECR (api, dkr) and S3", null, "Correct."], ["AdministratorAccess on the task role", "x", "The task role is not used for pulling images."], ["Make the repository public", "x", "That removes access control and does not fix the network path."]]}}, "t": "ecs"}, {"id": "s-codedeploy", "topic": "cicd", "title": "CodeDeploy fails at AfterInstall", "intro": "A deployment to EC2 fails on one instance in the AfterInstall hook.", "start": "n1", "lesson": "Hook failures are diagnosed on the instance, in the CodeDeploy agent and script logs.", "nodes": {"n1": {"q": "Where do you look first?", "opts": [["The agent log and the hook script log on that instance", "n2", "Right: that is where script output ends up."], ["Route 53 records", "x", "DNS is not involved in a hook."], ["CloudFront access logs", "x", "CloudFront is not part of the deployment."]]}, "n2": {"q": "The log says the script is not executable. What do you do?", "opts": [["Fix the file mode (for example in the appspec permissions section) and redeploy", null, "Correct."], ["Increase the deployment timeout", "x", "More time does not make the script executable."], ["Switch to blue/green", "x", "The same script would fail on the new instances."]]}}, "t": "cicd"}, {"id": "s-cfn-rollback", "topic": "cfn", "title": "Stack creation failed", "intro": "A new stack ends in ROLLBACK_COMPLETE.", "start": "n1", "lesson": "A stack in ROLLBACK_COMPLETE cannot be updated; you delete it and create it again after fixing the cause.", "nodes": {"n1": {"q": "What do you do first?", "opts": [["Read the stack events for the first failed resource", "n2", "Right: the first failure is the cause."], ["Run ContinueUpdateRollback", "x", "That is for UPDATE_ROLLBACK_FAILED."], ["Update the stack with a fix", "x", "A stack in ROLLBACK_COMPLETE cannot be updated."]]}, "n2": {"q": "The bucket name already exists. How do you proceed?", "opts": [["Delete the stack, change or generate the name, and create it again", null, "Correct."], ["Update the stack with a new bucket name", "x", "Updates are not possible in this state."], ["Enable termination protection", "x", "That blocks deletion and fixes nothing."]]}}, "t": "cfn"}, {"id": "s-sqs-dup", "topic": "messaging", "title": "Messages are processed twice", "intro": "A Lambda function consumes an SQS queue and some messages are processed twice.", "start": "n1", "lesson": "Set the queue visibility timeout to at least six times the function timeout, and make handlers idempotent.", "nodes": {"n1": {"q": "What do you compare first?", "opts": [["The queue's visibility timeout and the function's run time", "n2", "Right: messages reappear when processing outlasts the timeout."], ["The queue's retention period", "x", "Retention controls how long messages are kept."], ["The queue's delay setting", "x", "Delay hides new messages only."]]}, "n2": {"q": "Visibility is 30 s and the function can run 60 s. What is the fix?", "opts": [["Raise the visibility timeout (at least 6x the function timeout) and make the handler idempotent", null, "Correct."], ["Reduce the function's memory", "x", "That makes the function slower."], ["Remove the dead-letter queue", "x", "The DLQ is not the cause."]]}}, "t": "messaging"}, {"id": "s-asg-loop", "topic": "elb-asg", "title": "Instances keep being replaced", "intro": "An Auto Scaling group terminates and relaunches instances in a loop. The application needs four minutes to start.", "start": "n1", "lesson": "With ELB health checks, a grace period shorter than the start-up time causes replacement loops.", "nodes": {"n1": {"q": "What do you inspect?", "opts": [["The health check type and the health check grace period", "n2", "Right: the checks start before the app is ready."], ["The instance type", "x", "Size does not explain a loop."], ["The AMI's region", "x", "The instances do launch."]]}, "n2": {"q": "ELB health checks are on and the grace period is 60 s. What is the fix?", "opts": [["Raise the grace period above the start-up time (for example 300 s)", null, "Correct."], ["Turn off health checks so no instance is ever replaced", "x", "That hides real failures."], ["Reduce the desired capacity to one", "x", "The loop would continue."]]}}, "t": "elb-asg"}, {"id": "s-accessdenied", "topic": "iam-adv", "title": "AccessDenied although the policy allows", "intro": "A role has an Allow for s3:GetObject but requests still fail with AccessDenied.", "start": "n1", "lesson": "An explicit Deny, an SCP, a boundary, or a resource or KMS policy can block a request that an identity policy allows.", "nodes": {"n1": {"q": "What is your first step?", "opts": [["Find the denying policy with CloudTrail, the policy simulator or the decoded error message", "n2", "Right: look for what denies instead of adding more Allows."], ["Attach AdministratorAccess to the role", "x", "That is not least privilege and may still be denied by an SCP."], ["Make the bucket public", "x", "That removes protection for everyone."]]}, "n2": {"q": "An SCP denies S3 actions outside eu-west-1, and the bucket is in us-east-1. What is the fix?", "opts": [["Change the SCP, or use a bucket in the allowed region", null, "Correct: SCPs cap what accounts can do."], ["Add another Allow to the role", "x", "Allows cannot override an SCP."], ["Add a bucket ACL for the role", "x", "ACLs cannot override an SCP either."]]}}, "t": "iam-adv"}, {"id": "s-kinesis-lag", "topic": "messaging", "title": "Kinesis consumer falls behind", "intro": "IteratorAge of a Lambda function reading a Kinesis stream keeps growing.", "start": "n1", "lesson": "A failing batch blocks its shard; use bisect on error, limited retries and an on-failure destination.", "nodes": {"n1": {"q": "What do you check first?", "opts": [["Function errors and retries in the logs", "n2", "Right: repeated failures block the shard."], ["Increase the stream retention", "x", "Retention does not speed up processing."], ["Switch to SNS", "x", "That changes the architecture without finding the cause."]]}, "n2": {"q": "One bad record fails the batch again and again. What do you configure?", "opts": [["Bisect batch on error, maximum retry attempts and an on-failure destination", null, "Correct."], ["A larger batch size", "x", "A larger batch is even more likely to include the bad record."], ["A DLQ on the function", "x", "Stream sources use an on-failure destination on the mapping."]]}}, "t": "messaging"}, {"id": "s-cors", "topic": "apigw", "title": "Browser blocks the API call", "intro": "A web app gets a CORS error from an API Gateway REST API. The same call works with curl.", "start": "n1", "lesson": "Wi     h+='</div><div class="chips">'+order.map(function(i){ return '<button class="pick'+(picked.indexOf(i)>-1?" used":"")+'" data-i="'+i+'">'+esc(o.steps[i])+'</button>'; }).join("")+'</div>';
    if(!checked) h+='<div class="row"><button class="btn" id="undo"'+(picked.length?"":" disabled")+'>Undo</button><button class="btn primary grow" id="check"'+(picked.length===n?"":" disabled")+'>Check</button></div>';
    else { var ok=picked.every(function(v,i){ return v===i; }); h+='<div class="fb"><b>'+(ok?"Correct.":"Not quite.")+'</b>'+(ok?"":'<div class="why">Correct order:<br>'+o.steps.map(function(s,i){ return (i+1)+". "+esc(s); }).join("<br>")+'</div>')+'<div class="why">'+esc(o.note)+'</div></div><button class="btn primary block" id="next" style="margin-top:12px">Next</button>'; }
    h+='</div>'; main.innerHTML=h; bindStop();
    main.querySelectorAll(".pick").forEach(function(b){ b.onclick=function(){ if(checked) return; var i=+b.dataset.i; if(picked.indexOf(i)>-1||picked.length>=n) return; picked.push(i); draw(); }; });
    var u=$("#undo"); if(u) u.onclick=function(){ picked.pop(); draw(); };

function viewMatch(it){

  function draw(){

    h+='</div><div>';

    h+='</div></div>';

    else { var ok=m.pairs.every(function(_,i){ return map[i]===i; }); h+='<div class="fb"><b>'+(ok?"All correct.":"Some pairs are wrong.")+'</b>'+(ok?"":'<div class="why">Correct pairs:<br>'+m.pairs.map(function(p){ return fmt(p[0])+" &rarr; "+fmt(p[1]); }).join("<br>")+'</div>')+'<div class="why">'+esc(m.note)+'</div></div><button class="btn primary block" id="next" style="margin-top:12px">Next</button>'; }

    var r=$("#reset"); if(r) r.onclick=function(){ map={}; sel=null; draw(); };

  }

}

// ---------- exam
function buildExam(){
  var order=Object.keys(D.DOMAINS), cnt=D.EXAM.counts, pick=[];
  order.forEach(function(d){ var pool=shuffle(QB.filter(function(q){ return q.d===d; })); pool.sort(function(a,b){ return (S.q[a.id]?1:0)-(S.q[b.id]?1:0); }); pick=pick.concat(pool.slice(0,cnt[d])); });
  return shuffle(pick);
}
function startExam(){
  var qs=buildExam(); E={qs:qs,ans:qs.map(function(){ return -1; }),cur:0,end:Date.now()+D.EXAM.minutes*60000,view:"q"}; E.timer=setInterval(tick,1000);
  run=null; setBack(function(){ if(leave()) go("practice"); }); title("Exam"); renderExam();

function tick(){ if(!E) return; var left=E.end-Date.now(); var t=$("#timer"); if(t){ var m=Math.floor(left/60000), s=Math.floor(left/1000)%60; t.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s; t.classList.toggle("low",left<300000); } if(left<=0) finishExam(); }

function confirmFinish(){ var un=E.ans.filter(function(a){ return a<0; }).length; if(un&&!confirm(un+" question(s) unanswered. Finish the exam now?")) return; finishExam(); }
function finishExam(){

  E.qs.forEach(function(q,i){ per[q.d][1]++; var a=E.ans[i]; var good=a===q.a; if(a>=0) recQ(q.id,good,1); if(good){ ok++; per[q.d][0]++; } else wrong.push(i); });

}
