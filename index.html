<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWS Developer Prep</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface2:#efece4;--border:#ded8c9;--text:#1b2028;--muted:#66707c;--accent:#b3620a;--accent-ink:#fff;--teal:#0d7d72;--ok:#1c7c4c;--ok-bg:#e3f3e9;--bad:#b3261e;--bad-bg:#fbe6e4;--warn-bg:#fdf1dc;--code:#f0ece2;--shadow:0 1px 2px rgba(20,20,10,.06),0 8px 24px -14px rgba(20,20,10,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--surface:#161b22;--surface2:#1c222b;--border:#2b3340;--text:#e8ecf1;--muted:#8b95a3;--accent:#e2a33d;--accent-ink:#1b1300;--teal:#3fc7b8;--ok:#4fce88;--ok-bg:#123322;--bad:#ff7a70;--bad-bg:#3a1512;--warn-bg:#2a2112;--code:#222a35;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0e1116;--surface:#161b22;--surface2:#1c222b;--border:#2b3340;--text:#e8ecf1;--muted:#8b95a3;--accent:#e2a33d;--accent-ink:#1b1300;--teal:#3fc7b8;--ok:#4fce88;--ok-bg:#123322;--bad:#ff7a70;--bad-bg:#3a1512;--warn-bg:#2a2112;--code:#222a35;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.6)}
a{color:var(--accent)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:15px/1.55 'Inter',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--teal));display:grid;place-items:center;color:#12100a;font:800 15px 'JetBrains Mono'}
#title{font:700 15px 'JetBrains Mono';flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font:600 11px 'JetBrains Mono';padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip b{color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:16px 16px 24px}
.mascot{display:flex;gap:14px;align-items:center}.mascot img{width:104px;height:auto;border-radius:14px;flex:none;border:1px solid var(--border)}.mascot .say{font-size:15px;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 6px}.card h3{font-size:14px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}.eyebrow{font:600 11px 'JetBrains Mono';text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--border);background:var(--surface2);border-radius:11px;padding:11px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.block{width:100%;display:block}.btn.small{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:transparent}a.btn{color:inherit;text-decoration:none;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font:700 22px 'JetBrains Mono';color:var(--accent)}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .2s}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}.item small{color:var(--muted);display:block}
.tag{font:600 10px 'JetBrains Mono';text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.q{font-size:16px;font-weight:500;line-height:1.55;margin:10px 0 14px}
pre.codeblk{background:var(--code);border:1px solid var(--line,#2a2f3a);border-radius:10px;padding:10px 12px;margin:10px 0;overflow-x:auto;font:12px/1.5 'JetBrains Mono',monospace;white-space:pre}pre.codeblk code{background:none;padding:0;word-break:normal}
code{background:var(--code);padding:1px 6px;border-radius:5px;font:12.5px 'JetBrains Mono',monospace;word-break:break-word}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface2);border-radius:11px;padding:12px 14px;margin-bottom:8px;line-height:1.4}
.opt .k{font:700 13px 'JetBrains Mono';color:var(--muted);flex:none}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}.opt.bad{background:var(--bad-bg);border-color:var(--bad)}.opt.dim{opacity:.55}.opt.sel{border-color:var(--accent);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--surface2);padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.fb{margin-top:12px;padding:12px 14px;border-radius:11px;background:var(--surface2);font-size:14px}.fb b{color:var(--accent)}.fb .why{color:var(--muted);margin-top:8px}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:600;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer}
.flash.back{background:var(--surface2);font-weight:500;font-size:15px;text-align:left;justify-content:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pick{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px;text-align:left}.pick.used{opacity:.35}
.slot{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px dashed var(--border);border-radius:10px;margin-bottom:6px;min-height:42px;background:var(--surface)}.slot .n{font:700 12px 'JetBrains Mono';color:var(--accent);width:18px}.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mbtn{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:10px;font-size:13px;text-align:left;margin-bottom:6px;width:100%;border-left-width:6px}
.mbtn.sel{outline:2px solid var(--accent)}.mbtn.ok{background:var(--ok-bg)}.mbtn.bad{background:var(--bad-bg)}
.p0{border-left-color:#e2a33d}.p1{border-left-color:#3fc7b8}.p2{border-left-color:#7aa2f7}.p3{border-left-color:#e07a9a}.p4{border-left-color:#9ece6a}.p5{border-left-color:#bb9af7}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{border:0;background:none;padding:7px 1px;font:600 10px 'JetBrains Mono';color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
#nav button.on{color:var(--accent);background:var(--surface2)}#nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.domrow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hist{display:flex;align-items:flex-end;gap:4px;height:48px}.hist i{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.timer{font:700 16px 'JetBrains Mono'}.timer.low{color:var(--bad)}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.grid8 button{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:8px 0;font-size:12px}.grid8 button.done{background:var(--ok-bg);border-color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.domrow{grid-template-columns:90px 1fr 56px}}
</style></head><body>
<header id="top"><div class="mark">&lambda;</div><div id="title">Today</div><div class="chip" id="streak"></div></header>
<main id="main"></main>
<nav id="nav" aria-label="Sections">
<button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
<button data-tab="learn" id="learnTab" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>Learn</button>
<button data-tab="practice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>Practice</button>
<button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>Cards</button>
<button data-tab="drills"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h12"/><circle cx="18" cy="6" r="2"/></svg>Drills</button>
<button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Progress</button>
</nav>
<script>
(function(){
"use strict";
var D = {"Q": [{"id": 2439292788, "d": "dev", "t": null, "q": "A Lambda function written in Node.js processes events from DynamoDB Streams and occasionally receives duplicate copies of the same record. What is the most likely cause, and what should the developer do?", "o": ["Duplicates mean the batch size is too large, so reduce BatchSize to 1 to guarantee exactly-once processing", "Streams deliver at-least-once, so make the handler idempotent (for example, check a unique record key first)", "Records are redelivered only when a shard is split, so pin the function to a single shard to stop duplicates", "Duplicates come from the NEW_IMAGE view type, so switch the stream to KEYS_ONLY to avoid them"], "a": 1, "e": "Lambda's stream integrations with DynamoDB/Kinesis follow an <b>at-least-once<\/b> delivery model: on retries (for example after a partial batch failure) records can be redelivered. The handler should be designed to be idempotent — for instance by tracking processed record IDs in a separate table or using conditional writes.", "w": "(C) Any retry can redeliver records, not only a shard split. (D) The view type controls what a record contains, not how often it is delivered. (A) A smaller batch limits the impact of a retry, but the same record can still arrive twice."}, {"id": 589726621, "d": "dev", "t": null, "q": "Which AWS SDK configuration best handles an API that occasionally returns throttling errors (HTTP 429 / ProvisionedThroughputExceededException)?", "o": ["Retry at a fixed one-second interval in a loop so every client sends requests at a predictable rate", "Raise the SDK request timeout to the maximum so throttled calls simply wait longer to finish", "Disable SDK retries and re-send the request immediately in application code until it succeeds", "Use the SDK's built-in retries with exponential backoff and jitter (adaptive or standard retry mode)"], "a": 3, "e": "The AWS SDK supports retry modes, including <b>adaptive retry mode<\/b>, which combines exponential backoff with jitter and adapts to the client-observed throttling rate — this is the recommended approach for services like DynamoDB or Kinesis.", "w": "(C) Immediate re-sends add load and keep the API throttled. (B) A throttled call fails fast; a longer timeout does not give it more capacity. (A) Fixed intervals make many clients retry at the same moment; backoff with jitter spreads the load."}, {"id": 1355323029, "d": "dev", "t": null, "q": "A developer wants API Gateway to cache a GET method's responses for 5 minutes, while returning different cached responses depending on the `category` query parameter. What needs to be configured?", "o": ["Enable the stage cache; API Gateway automatically includes every query string parameter in the cache key", "Return a `Cache-Control: max-age=300` header from the Lambda function; API Gateway honors it for caching", "Set the cache TTL to 300 seconds on the method; different `category` values then get separate entries", "Enable the stage cache and add the `category` query parameter to the method's cache key"], "a": 3, "e": "Caching in API Gateway is enabled at the stage level, and for the method you must explicitly mark which request parameters (query string, path, header) are part of the <b>cache key<\/b> — otherwise the cache ignores different `category` values and returns the same cached response.", "w": "(A) Parameters must be added to the cache key explicitly. (B) The Cache-Control header affects clients, not the API Gateway cache. (C) The TTL controls how long entries live, not which requests share an entry."}, {"id": 1015009665, "d": "dev", "t": null, "q": "Which `template.yaml` structure for AWS SAM correctly defines a Lambda function triggered by an HTTP GET request through API Gateway on the path `/orders`?", "o": ["An `AWS::Serverless::Function` with a `Triggers` list containing `Type: HttpGet` and `Path: /orders`", "An `AWS::Lambda::Function` with an `HttpRoute: GET /orders` property that the SAM transform converts", "An `AWS::Serverless::Api` resource with `Path: /orders` and `Method: get`; SAM then creates the function", "An `AWS::Serverless::Function` with an `Api` event that sets `Path: /orders` and `Method: get`"], "a": 3, "e": "In SAM, the simplest approach is to declare an `AWS::Serverless::Function` and add an event of type `Api` in the `Events` block, specifying `Path` and `Method`. SAM automatically creates an implicit API Gateway (`AWS::Serverless::Api`) with the necessary integration route.", "w": "(C) The API resource defines the gateway, but the function and its event are still required. (A) SAM has no Triggers or HttpGet property. (B) HttpRoute is not a Lambda property; SAM uses Events on AWS::Serverless::Function."}, {"id": 439025771, "d": "dev", "t": null, "q": "An application writes CloudWatch metrics via `PutMetricData` for every HTTP request, which causes high API call costs under heavy load. Which practice reduces the number of calls without losing metric accuracy?", "o": ["Switch the metrics to one-hour resolution so CloudWatch only receives 24 data points per day", "Embedded Metric Format: write metrics inside structured log events and let CloudWatch extract them", "Call PutMetricData from a background thread so the application is not blocked by the API calls", "Stop publishing metrics and run CloudWatch Logs Insights queries on the request logs instead"], "a": 1, "e": "<b>Embedded Metric Format<\/b> lets you write metrics as part of structured log entries (a single logging call instead of a separate API call), and CloudWatch automatically extracts metrics from them — eliminating the overhead of separate `PutMetricData` calls.", "w": "(C) A background thread still makes the same number of API calls. (A) Lower resolution loses the detail you wanted to keep. (D) Logs Insights queries are not metrics and cannot be used for alarms in the same way."}, {"id": 4134398207, "d": "dev", "t": null, "q": "In what format does DynamoDB store numbers, and why does this matter when working with the SDK?", "o": ["Type N is limited to 32-bit integers, so larger values must be stored as strings (type S)", "Type N stores 64-bit floating point values, so any number with more than 15 digits loses precision in DynamoDB", "Numbers are stored as binary (type B), so SDKs must base64-encode them before they are sent", "Type N holds numbers as strings of up to 38 digits; the SDK maps them to native types, which can lose precision"], "a": 3, "e": "DynamoDB stores numbers with attribute type <b>N<\/b>, which is physically a string representation of the number (up to 38 digits of precision). The SDK converts this to native types (e.g. JS number), but for very large or high-precision numbers you should use special types (e.g. BigInt or fixed-precision libraries) to avoid precision loss.", "w": "(B) DynamoDB numbers keep up to 38 digits of precision; precision loss happens in client types. (C) Binary is a separate type for raw bytes. (A) Type N supports much larger values and decimals."}, {"id": 3528866675, "d": "dev", "t": null, "q": "What is the difference between `Query` and `Scan` operations in DynamoDB in terms of performance and cost?", "o": ["Query reads only items for one partition key; Scan reads every item, so it costs more as the table grows", "Query always uses eventually consistent reads, while Scan always uses strongly consistent reads", "Scan reads only the first 1 MB of the table, which is why it is cheaper than Query on large tables", "Query works only on a secondary index, while Scan works only on the base table"], "a": 0, "e": "<b>Query<\/b> efficiently retrieves items by partition key (optionally filtered by a sort key condition), consuming read capacity proportional to the items actually returned. <b>Scan<\/b> walks through every item in the table, consuming far more read capacity units and time — so Scan should be avoided for large tables or used carefully with filters.", "w": "(C) Scan pages through the whole table; 1 MB is the page size, not the total. (B) Both operations support either consistency mode (strong reads are not available on GSIs). (D) Query works on the base table and on indexes."}, {"id": 351067187, "d": "dev", "t": null, "q": "A developer wants to implement optimistic locking when updating a DynamoDB item via the AWS SDK. What mechanism is used for this?", "o": ["Read the item with ConsistentRead before each write, which locks the item for the next update", "Keep a version attribute and update with a ConditionExpression that checks the expected version", "Enable DynamoDB Streams and let a Lambda function reject writes that arrive out of order", "Wrap every update in a TransactWriteItems call; transactions block other writers until they commit"], "a": 1, "e": "Optimistic locking is implemented via a version attribute: before updating, the client checks that the current version stored matches the expected version using a <b>ConditionExpression<\/b> (e.g. `version = :expectedVersion`) and atomically increments it. DynamoDBMapper (Java) has built-in support for this via a version annotation.", "w": "(D) Transactions are atomic but do not lock items for other writers; a condition is still needed. (A) A strongly consistent read does not lock anything. (C) Streams report changes after they happen; they cannot reject writes."}, {"id": 2820678468, "d": "dev", "t": null, "q": "Which of the following correctly implements pagination when scanning a large DynamoDB table via the SDK?", "o": ["Pass the `LastEvaluatedKey` from each response as `ExclusiveStartKey` until no key is returned", "Use `Segment` and `TotalSegments` on a single Scan call to receive all pages at once", "Increase `Limit` until a single response contains the whole table, so no further calls are needed", "Pass the `NextToken` returned by each response in the next Scan request until it is empty"], "a": 0, "e": "DynamoDB does not support offset-based pagination. Instead, each Query/Scan response may include a `LastEvaluatedKey`, which must be passed as `ExclusiveStartKey` in the next call. If `LastEvaluatedKey` is absent from the response, all data has been processed.", "w": "(C) A response is capped at 1 MB regardless of Limit. (D) Query and Scan use LastEvaluatedKey, not NextToken. (B) Parallel scan segments split the work across workers; each segment still needs pagination."}, {"id": 650372063, "d": "dev", "t": null, "q": "A Lambda function processes files uploaded to S3, but large files (>200 MB) cause timeouts. Which solution best fits a serverless architecture?", "o": ["Let Lambda start a Step Functions workflow or a Fargate task that does the heavy processing", "Stream each file into /tmp (up to 10 GB) and process it there so the function never needs more time", "Split each file with S3 Select first and send the parts to the same Lambda function in parallel", "Raise the Lambda timeout to 15 minutes and the memory to 10,240 MB, then process each file in place"], "a": 0, "e": "Lambda has hard limits (15-minute execution, limited /tmp, limited memory), so for potentially long or resource-intensive processing of large files the correct pattern is to delegate the heavy work to a long-running service (Fargate, EC2, Batch) or orchestrate the process with Step Functions, using Lambda only as a trigger/orchestrator.", "w": "(D) The maximum timeout is still a hard limit that a very large file can exceed. (B) /tmp limits storage, not execution time. (C) S3 Select filters rows from supported formats; it does not split arbitrary files into parts."}, {"id": 1945359815, "d": "dev", "t": null, "q": "Which statement about Lambda layers is correct?", "o": ["Layers are shared by all functions in the account, so updating a layer changes every function at once", "A function can use up to 5 layers, and the size of layers does not count against the 250 MB limit", "A function can use up to 5 layers, and the unzipped function plus layers must stay below 250 MB", "A function can use up to 15 layers, and each layer may be up to 250 MB unzipped"], "a": 2, "e": "Lambda layers are a way to attach shared code/libraries to multiple functions. Limits: up to <b>5 layers<\/b> per function, and the total unzipped size of all layers plus the function code cannot exceed <b>250 MB<\/b>.", "w": "(D) The limit is 5 layers and 250 MB in total. (B) Layers count toward the unzipped package size. (A) Functions pin a specific layer version and must be updated to use a new one."}, {"id": 2220481732, "d": "dev", "t": null, "q": "What is the purpose of using the AWS X-Ray SDK in a Lambda function that calls DynamoDB and an external HTTP API?", "o": ["Collect CPU and memory metrics of the function and raise alarms when they exceed a threshold", "Record which IAM principal made each API call so security teams can audit changes", "Capture every log line of the function and store it for search, replacing CloudWatch Logs", "Trace each request across Lambda, DynamoDB and the HTTP call to see where the latency is spent"], "a": 3, "e": "AWS X-Ray provides distributed tracing: it builds a service map and shows segments/subsegments with the execution time of each call (DynamoDB, HTTP request, etc.), allowing you to quickly locate the source of latency or errors in a call chain.", "w": "(C) X-Ray stores traces, not logs. (B) That is the job of CloudTrail. (A) CloudWatch metrics and alarms cover resource utilization."}, {"id": 2001656897, "d": "dev", "t": null, "q": "A developer wants an SQS queue to guarantee messages are processed strictly in the order they arrive, with no duplicates, within a given group. Which configuration should be chosen?", "o": ["A standard queue with a visibility timeout of zero, so consumers always see the oldest message first", "A standard queue with `DelaySeconds` set, so messages are delivered one at a time in order", "A FIFO queue without a `MessageGroupId`, because ordering is guaranteed per queue automatically", "A FIFO queue with content-based deduplication and a `MessageGroupId` set on each message"], "a": 3, "e": "Only <b>FIFO queues<\/b> guarantee processing order and support deduplication (exactly-once processing within a 5-minute window). Messages sharing the same `MessageGroupId` are processed strictly in sequence; `ContentBasedDeduplication` automatically computes a content hash to avoid duplicates.", "w": "(B) Delay postpones delivery but does not order or deduplicate messages. (A) The visibility timeout does not control order. (C) FIFO messages require a MessageGroupId; ordering is guaranteed per message group."}, {"id": 1400531252, "d": "dev", "t": null, "q": "What is the difference between an SQS Standard Queue and SNS when delivering messages to multiple consumers?", "o": ["SNS stores messages for up to 14 days for replay, while SQS deletes a message once it is delivered", "SQS pushes each message to all consumers (fan-out); SNS holds messages until a subscriber pulls them", "Both deliver every message to all consumers; SQS only adds a longer retention period than SNS", "SNS pushes each published message to all subscribers (fan-out); SQS holds messages until a consumer pulls them"], "a": 3, "e": "<b>SNS<\/b> implements the publish/subscribe pattern: one published message is broadcast to all subscribed endpoints (SQS queues, Lambda, email, HTTP, etc.) — this is fan-out. <b>SQS<\/b> is a point-to-point queue: a message is picked up by one consumer and removed after processing. They are often combined: SNS → multiple SQS queues for parallel, independent processing.", "w": "(B) The roles are reversed: SNS is the push and fan-out service. (C) An SQS message goes to one consumer in a pool unless several queues subscribe to a topic. (A) SQS retains messages for up to 14 days; SNS keeps none."}, {"id": 2997354190, "d": "dev", "t": null, "q": "What is the purpose of AWS AppConfig in an application that needs feature flags and gradual rollout of configuration changes?", "o": ["AppConfig deploys new application code to Lambda in steps and rolls back on failed health checks", "AppConfig replaces environment variables by injecting values into the function at build time", "AppConfig validates configuration and rolls it out gradually with automatic rollback, without a code deployment", "AppConfig stores secrets and rotates them on a schedule, so applications need no redeploy after rotation"], "a": 2, "e": "AWS AppConfig is purpose-built for managing configuration and feature flags separately from code: it supports validation (JSON Schema/Lambda validators) and gradual rollout strategies (canary) with CloudWatch alarm monitoring and automatic rollback if problems are detected.", "w": "(D) Secret storage and rotation is Secrets Manager. (A) Code deployment is CodeDeploy. (B) AppConfig delivers configuration at runtime; nothing is baked in at build time."}, {"id": 2339114051, "d": "dev", "t": null, "q": "When would you choose Amazon Kinesis Data Streams over SQS?", "o": ["Messages must be hidden from consumers for up to 15 minutes after they are sent", "One pool of workers must process each job once and delete it from the queue after success", "Each message needs its own visibility timeout and a dead-letter queue after repeated failures", "Several consumers must read the same ordered stream independently and replay it for days"], "a": 3, "e": "Kinesis Data Streams fits streaming-analytics scenarios where several consumers (e.g. Lambda, Kinesis Data Analytics, custom applications) each need to independently read the same stream, with the ability to replay events within the retention period (24 hours by default, up to 365 days with extended retention). SQS is a 'grab and delete' queue with no replay capability.", "w": "(B) Competing consumers that delete messages is the SQS pattern. (A) Delay queues are an SQS feature. (C) Visibility timeouts and dead-letter queues are SQS features; Kinesis consumers track their own position instead."}, {"id": 3700043053, "d": "dev", "t": null, "q": "Which CloudFormation property lets you explicitly control resource creation order when automatic dependency detection (via `Ref`/`Fn::GetAtt`) is not sufficient?", "o": ["`DependsOn`", "`UpdateReplacePolicy`", "`CreationPolicy`", "`DeletionPolicy`"], "a": 0, "e": "CloudFormation automatically infers dependencies through references (`Ref`, `Fn::GetAtt`), but if there is no explicit reference between resources while creation order is still critical (for example, an IAM policy must exist before a role that references it in another stack), you use the <b>DependsOn<\/b> attribute to force the dependency.", "w": "`DeletionPolicy` controls what happens to a resource when it is removed from the stack. `UpdateReplacePolicy` controls what happens to the old resource when it is replaced. `CreationPolicy` waits for a success signal (e.g. from EC2 cfn-signal), but does not define ordering between different resources."}, {"id": 2665335635, "d": "dev", "t": null, "q": "What is the purpose of `AWS::CloudFormation::Init` and `cfn-init` when configuring EC2 instances through CloudFormation?", "o": ["They describe packages, files and services in resource metadata, which cfn-init applies at launch", "They define scaling rules for the Auto Scaling group that launches the instance", "They choose the instance type and subnet, which cfn-init reads before the instance is created", "They signal CloudFormation when the instance is ready, so the stack waits before continuing"], "a": 0, "e": "`AWS::CloudFormation::Init` is metadata that declaratively describes an instance's desired state (install packages, create files, start services). The `cfn-init` script, invoked from `UserData`, reads this metadata at boot time and applies the configuration — this is more maintainable than a long bash script in UserData.", "w": "(C) Those are properties of the instance resource itself. (D) Signalling is done by cfn-signal with a CreationPolicy or WaitCondition. (B) Scaling is configured on the Auto Scaling group and its policies."}, {"id": 158974201, "d": "dev", "t": null, "q": "Which property should be used in CloudFormation to ensure a new resource is created BEFORE the old one is deleted during a stack update, avoiding downtime?", "o": ["Add `UpdatePolicy: CreateFirst` to the resource so replacement starts with the new resource", "Set `DeletionPolicy: Snapshot` so CloudFormation keeps the old resource until the new one is ready", "Nothing: for most resource types CloudFormation already creates the replacement before deleting the old one", "Set `UpdateReplacePolicy: Retain` so the new resource is created before the old one is removed"], "a": 2, "e": "By default, for most resource types that require replacement, CloudFormation creates the new resource first and only then deletes the old one — minimizing downtime. Explicit control over readiness signaling is provided via `CreationPolicy` (waiting for a `cfn-signal`) or a `WaitCondition`.", "w": "(D) That policy decides what happens to the old resource after replacement (keep or delete), not the order. (B) DeletionPolicy applies when the resource or stack is deleted. (A) There is no CreateFirst update policy."}, {"id": 3457593164, "d": "dev", "t": null, "q": "What is the difference between an `AWS::Serverless::Function` `Policies` entry that references a managed policy ARN (`arn:aws:iam::aws:policy/...`) and an inline policy document in a SAM template?", "o": ["A managed policy ARN is evaluated before inline statements, so inline statements can never add permissions", "A managed policy ARN applies to every function in the stack; an inline statement applies to a single function", "An inline statement can only reference AWS managed policies; a managed policy ARN can contain custom actions", "A managed policy ARN reuses an existing policy; an inline statement describes custom permissions in the template"], "a": 3, "e": "SAM's `Policies` property supports several formats: a managed policy ARN string, the name of a <b>SAM policy template<\/b> (e.g. `DynamoDBCrudPolicy`), or a full inline policy document (`Statement: [...]`). Using an inline document with precise permissions implements the principle of least privilege, avoiding overly broad managed policies.", "w": "(B) Both apply only to the function whose Policies property lists them. (C) Inline statements contain custom actions and resources; a managed ARN only points to an existing policy. (A) IAM combines all attached policies; there is no such ordering."}, {"id": 4017752244, "d": "dev", "t": null, "q": "An application uses Amazon Cognito User Pools for authentication. Which token should be sent in the `Authorization` header when calling a protected API Gateway endpoint secured by a Cognito User Pool authorizer?", "o": ["Send the ID token or the access token, as the authorizer is configured, but never the refresh token", "Send the identity pool's temporary AWS credentials as a bearer token in the Authorization header", "Send the client secret of the app client together with the user's access token", "Send the refresh token, because it is the only token that stays valid for the whole session"], "a": 0, "e": "Cognito issues three tokens: an ID token (user information), an Access token (resource access rights), and a Refresh token (used to obtain new tokens). API Gateway's Cognito Authorizer typically validates either the ID or Access token (depending on the authorizer's configuration), but the <b>Refresh Token is never sent<\/b> as the authorization token for API requests — it is used only to obtain a new token pair through Cognito.", "w": "(D) The refresh token is only used against Cognito to obtain new tokens. (C) The client secret belongs to the app client and is not a user credential. (B) Identity pool credentials are for SigV4-signed AWS calls, not for the User Pool authorizer."}, {"id": 2153539229, "d": "dev", "t": null, "q": "Which statement best describes choosing between Redis and Memcached in ElastiCache for caching application sessions that require replication and automatic failover?", "o": ["Either engine, because ElastiCache replicates both automatically across Availability Zones", "Redis: replication, Multi-AZ failover and persistence, so session data survives a node failure", "Memcached: native replication and automatic failover, so session data survives a node failure", "Memcached: snapshot persistence and rich data types, which Redis lacks, so it suits sessions better"], "a": 1, "e": "<b>Redis<\/b> in ElastiCache supports Multi-AZ replication with automatic failover, persistence (snapshot/AOF), and advanced data structures (lists, sets, sorted sets) — all important for storing sessions where data loss is undesirable. <b>Memcached<\/b> is simpler, supports multi-threading and horizontal partitioning, but lacks replication and persistence.", "w": "(C) Memcached has no replication or failover. (D) Snapshots and rich data types are Redis features. (A) Only Redis supports replication groups and Multi-AZ failover."}, {"id": 1797369572, "d": "sec", "t": null, "q": "A developer needs to give a Lambda function read-only access to a specific S3 bucket named `reports-bucket`, without the ability to delete or overwrite objects. Which approach follows the principle of least privilege?", "o": ["The AWS managed policy `AmazonS3ReadOnlyAccess`, which limits the role to read operations", "A bucket policy on `reports-bucket` that allows `s3:GetObject` to every principal in the account", "A custom policy allowing `s3:Get*` and `s3:List*` on all buckets, with the bucket name in a tag condition", "A custom policy allowing `s3:GetObject` (and `s3:ListBucket`) only on `reports-bucket` and its objects"], "a": 3, "e": "The principle of least privilege requires granting only the necessary actions (`s3:GetObject`, and `s3:ListBucket` if listing objects is needed) scoped to only the specific resource (the ARN of the bucket/objects), rather than the broad `AmazonS3FullAccess`, which grants full control over every bucket in the account.", "w": "(A) Read-only access still covers every bucket in the account, which is broader than needed. (C) Wildcard actions on all buckets exceed the requirement even with a condition. (B) That grants access to all principals in the account, not just this function's role."}, {"id": 4226550863, "d": "sec", "t": null, "q": "What is the difference between an IAM Role and an IAM User when used by an EC2 instance to access other AWS services?", "o": ["A role must be recreated for every instance, while one user can be shared by all instances", "A role gives the instance temporary, automatically rotated credentials through the metadata service", "A user can be attached to the instance as an instance profile, just like a role", "A user gives the instance temporary credentials, while a role gives it long-term access keys"], "a": 1, "e": "The best practice is to use an <b>IAM Role<\/b> attached to the EC2 instance via an instance profile: credentials are issued temporarily through the Instance Metadata Service (IMDS) and automatically rotated by AWS. Storing long-lived IAM User access key/secret key pairs directly on the instance creates a risk of credential leakage.", "w": "(D) Users have long-term access keys; roles issue temporary credentials. (A) One role can be attached to many instances through an instance profile. (C) Only roles can be placed in an instance profile."}, {"id": 778490755, "d": "sec", "t": null, "q": "What is the correct way to store and retrieve a database password in a Lambda function, avoiding hardcoding it in the code?", "o": ["Store it in a Lambda environment variable encrypted with the default key, and read it from the environment", "Keep it in Secrets Manager or a SecureString parameter and read it at runtime with a scoped IAM permission", "Bake it into the deployment package as a config file and restrict who can download the package", "Store it in a private S3 object and read it on every invocation using the function's execution role"], "a": 1, "e": "AWS Secrets Manager (with automatic rotation for supported databases like RDS) or Parameter Store with type `SecureString` (KMS-encrypted) is the standard way to store secrets. The function retrieves the secret via an SDK call with the appropriate IAM permission (`secretsmanager:GetSecretValue`), and the value can be cached in memory within the execution context between warm invocations to reduce cost/latency.", "w": "(A) Environment variables are visible to anyone who can read the function configuration and offer no rotation. (C) Anyone with access to the package or repository can read it. (D) A plain S3 object has no rotation or audit of secret access; Secrets Manager provides both."}, {"id": 414160477, "d": "sec", "t": null, "q": "An S3 bucket must be readable only from a specific VPC via a VPC Endpoint, with no access from the public internet. Which combination of settings achieves this?", "o": ["Block Public Access turned on for the bucket, which limits access to requests from inside the VPC", "A bucket policy that allows only the VPC's CIDR range in an `aws:SourceIp` condition", "A bucket policy that allows access only when `aws:SourceVpce` matches the endpoint, plus a gateway endpoint for S3", "A security group on the bucket that allows traffic only from the VPC's subnets"], "a": 2, "e": "To restrict access exclusively through a specific VPC endpoint you need to: 1) enable Block Public Access to prevent public access entirely; 2) create a Gateway VPC Endpoint for S3 in the target VPC; 3) add a bucket policy with an `aws:SourceVpce` (or `aws:SourceVpc`) condition that only allows requests routed through that endpoint.", "w": "(B) Requests through a gateway endpoint use private addresses that aws:SourceIp does not match. (D) S3 buckets have no security groups. (A) Block Public Access only blocks public policies; authorized principals can still reach the bucket from anywhere."}, {"id": 2743809683, "d": "sec", "t": null, "q": "What is the difference between a symmetric and an asymmetric KMS key when encrypting data in an application?", "o": ["Asymmetric keys are the better choice for large payloads because they are faster than symmetric keys", "Symmetric keys never leave KMS in plaintext; an asymmetric key has a public key that can be downloaded", "Both key types keep their key material inside KMS, and neither provides a downloadable key", "Symmetric keys can be exported in plaintext, while asymmetric keys never leave KMS"], "a": 1, "e": "KMS symmetric keys (typically AES-256-GCM) are never exported from the service — all encryption/decryption operations happen inside KMS. Asymmetric KMS keys have a public and private component: the public key can be downloaded and used for encryption or signature verification outside of AWS, while the private key never leaves KMS.", "w": "(D) It is the reverse: the public half of an asymmetric key can be exported. (A) Asymmetric operations are slower and limited in size, so large data uses symmetric keys. (C) The public key of an asymmetric key pair can be downloaded."}, {"id": 1179403929, "d": "sec", "t": null, "q": "What is envelope encryption, and why do AWS SDKs (e.g. the DynamoDB Encryption Client or S3 Client-Side Encryption) use this approach with KMS?", "o": ["Encrypt the data twice, first with a customer managed key and then with an AWS managed key", "Encrypt the data locally with a data key from `GenerateDataKey` and store the encrypted data key beside it", "Send the data to KMS in chunks of 4 KB so that each chunk is encrypted directly under the KMS key", "Download the KMS key material once and encrypt all data with it locally, then discard the key"], "a": 1, "e": "<b>Envelope encryption<\/b>: the client requests a one-time plaintext data key plus its encrypted version from KMS (`GenerateDataKey`), encrypts the data with that data key locally (fast, unconstrained by KMS API size limits), and stores the encrypted data key alongside the data. To decrypt, the encrypted data key must be sent back to KMS — decryption only succeeds if the caller has the appropriate IAM/key policy permissions.", "w": "(C) That works for small data but is slow and expensive; envelope encryption avoids it. (A) Envelope encryption wraps a data key with a master key; it does not apply two keys to the data. (D) KMS key material cannot be exported for local use."}, {"id": 3175691848, "d": "sec", "t": null, "q": "An IAM policy contains `\"Effect\": \"Deny\"` for the action `s3:DeleteObject`, and another policy attached to the same role contains `\"Effect\": \"Allow\"` for `s3:*`. What is the result when attempting to delete an object?", "o": ["Allowed, because identity-based Allow statements take precedence over Deny statements in other policies", "Allowed, because `s3:*` is evaluated last and overrides the earlier Deny statement", "Denied, because an explicit Deny in any applicable policy overrides every Allow", "Denied only if the Deny and the Allow are in the same policy document"], "a": 2, "e": "In the IAM evaluation model, an explicit <b>Deny<\/b> is checked first — if even one applicable policy (identity-based, resource-based, permissions boundary, SCP) contains an explicit Deny for the action, the request is rejected regardless of any Allow statements in other policies.", "w": "(B) Evaluation does not depend on the order of statements. (D) Policies are evaluated together; documents do not matter. (A) No Allow can override an explicit Deny."}, {"id": 2988831786, "d": "sec", "t": null, "q": "What is the purpose of an IAM Permissions Boundary when allowing developers to create their own IAM roles for their Lambda functions?", "o": ["It removes the permissions of a role that have not been used for 90 days, keeping roles minimal", "It caps the permissions a role can ever have, so developers can create roles without escalating privileges", "It grants developers the permissions they need to create roles, without needing separate identity policies", "It applies to every account in an organization and blocks actions even for the management account"], "a": 1, "e": "A permissions boundary is a managed policy attached to an IAM User/Role that defines the <b>maximum possible<\/b> effective permissions (the intersection of the permissions boundary AND the identity-based policies). This allows, for example, letting developers create new roles for Lambda while guaranteeing that none of the roles they create can exceed the allowed boundary (preventing privilege escalation).", "w": "(C) A boundary never grants permissions; it only limits them. (A) Removing unused permissions is not a boundary feature; Access Analyzer can generate policies from activity. (D) That describes service control policies; boundaries apply to individual users and roles."}, {"id": 2649199492, "d": "sec", "t": null, "q": "An application running on EC2 needs to access S3 within the same account. Which practice is considered most secure for granting access?", "o": ["Create an IAM user for the application and keep its access keys in a protected file on the instance", "Store the access keys of a dedicated IAM user in Secrets Manager and fetch them when the application starts", "Attach an IAM role through an instance profile, with a policy limited to the bucket the application needs", "Add a bucket policy that allows the instance's public IP address, so no credentials are needed at all"], "a": 2, "e": "The best practice for AWS services (EC2, ECS, Lambda) is to use an IAM Role attached via an Instance Profile, following the principle of least-privilege permissions. This removes the need to store long-lived credentials on the instance; AWS automatically issues and rotates temporary credentials.", "w": "(A) Long-lived keys on an instance can leak and must be rotated by hand. (B) Better than a file, but still long-term keys that need rotation; a role avoids keys entirely. (D) IP addresses are not an identity, and instance addresses can change."}, {"id": 3161083552, "d": "sec", "t": null, "q": "How does a Cognito Identity Pool (federated identities) differ from a Cognito User Pool in purpose?", "o": ["A User Pool authenticates users and issues JWTs; an Identity Pool exchanges a token for temporary AWS credentials", "A User Pool issues temporary AWS credentials for S3 and DynamoDB; an Identity Pool authenticates users and issues JWTs", "A User Pool is for customers and an Identity Pool is for employees; both return JWTs signed by the same key", "An Identity Pool stores the user directory and passwords; a User Pool only forwards sign-ins to social providers"], "a": 0, "e": "A <b>User Pool<\/b> is a user directory with authentication (issues ID/Access/Refresh JWT tokens). An <b>Identity Pool<\/b> exchanges a token from a User Pool (or another IdP) for temporary AWS credentials via STS `AssumeRoleWithWebIdentity`, letting a client application securely call AWS services directly with the permissions of a specific, restricted IAM role.", "w": "(B) The roles are reversed. (C) Both can serve any users; the difference is JWTs versus AWS credentials. (D) The directory and the passwords live in the User Pool."}, {"id": 34621923, "d": "sec", "t": null, "q": "CloudTrail shows that someone deleted a CloudTrail trail and disabled logging. Which preventive measure would help detect or prevent such an action?", "o": ["Send the trail's logs to CloudWatch Logs with a metric filter, which prevents the trail from being modified", "Use an organization trail, deny `cloudtrail:StopLogging` and `DeleteTrail` with an SCP, and deliver logs to a separate protected account", "Enable log file validation on the trail, which blocks anyone from stopping or deleting it", "Turn on MFA delete for the trail's S3 bucket, which also prevents the trail itself from being deleted"], "a": 1, "e": "A layered defense: an organization trail managed from the management account is harder to disable from member accounts; SCPs can deny `cloudtrail:StopLogging`/`cloudtrail:DeleteTrail` even for administrators of member accounts; log file validation detects log tampering; delivering logs to a separate, guarded log-archive account prevents their deletion even if the primary account is compromised.", "w": "(C) Log file validation detects tampering with delivered logs; it does not stop deletion of the trail. (A) A metric filter can alert but cannot prevent changes. (D) MFA delete protects objects in the bucket, not the trail configuration."}, {"id": 1066850490, "d": "sec", "t": null, "q": "What is the difference between S3 encryption options SSE-S3, SSE-KMS, and SSE-C?", "o": ["SSE-S3 uses keys managed by S3, SSE-KMS adds key policies and CloudTrail audit, SSE-C uses a key you send with each request", "SSE-KMS gives S3 the key material to store, while SSE-C keeps the key in KMS and audits every use", "SSE-C encrypts on the client before upload, while SSE-S3 and SSE-KMS encrypt only during transfer", "SSE-S3 uses keys you upload, SSE-KMS uses keys managed by S3, SSE-C uses keys generated by KMS"], "a": 0, "e": "<b>SSE-S3<\/b>: AWS manages the keys entirely transparently, without detailed key-usage auditing. <b>SSE-KMS<\/b>: uses a KMS CMK, providing detailed CloudTrail auditing of every key usage and fine-grained access control via key policy/IAM (including the ability to revoke access). <b>SSE-C<\/b>: the client supplies the encryption key on every request (via a header); AWS performs encryption/decryption but does not store the key — key management responsibility rests entirely with the client.", "w": "(D) The key owners are mixed up: SSE-S3 keys are managed by S3, SSE-C keys are supplied by you per request. (B) SSE-KMS keys stay in KMS; with SSE-C, S3 never stores the key. (C) All three encrypt at rest on the server side; client-side encryption is a separate option."}, {"id": 1061095739, "d": "sec", "t": null, "q": "An EC2 instance's Security Group has an inbound rule allowing traffic on port 443 from `0.0.0.0/0`, and the default outbound rule allows all traffic. Are Security Groups stateful or stateless, and what does this mean in practice?", "o": ["Security groups are stateless: the reply to an allowed request needs its own matching outbound rule", "Security groups are stateful: a reply to an allowed request is allowed without a matching outbound rule", "Network ACLs are stateful and security groups are stateless, so reply traffic is controlled by the NACL", "Security groups are stateful only for TCP; replies to UDP traffic always need an explicit outbound rule"], "a": 1, "e": "Security Groups are <b>stateful<\/b>: if an inbound rule allows a connection, the response is automatically allowed in the reverse direction regardless of the outbound rules. This is what distinguishes them from Network ACLs, which are <b>stateless<\/b> and require explicit rules in both directions.", "w": "(A) That describes network ACLs. (D) Connection tracking covers UDP and other protocols as well. (C) It is the other way around: security groups are stateful and NACLs are stateless."}, {"id": 3466516282, "d": "sec", "t": null, "q": "A developer wants to restrict access to a Lambda function URL to authorized AWS IAM principals only (no public access). Which authType setting is needed?", "o": ["Set `AuthType` to `NONE` and add a resource policy that allows only your account's principals", "Set `AuthType` to `COGNITO` and attach a user pool authorizer to the function URL configuration", "Set `AuthType` to `AWS_IAM`; callers send an API key in the `x-api-key` header instead of signing requests", "Set `AuthType` to `AWS_IAM`; callers sign requests with SigV4 and need `lambda:InvokeFunctionUrl`"], "a": 3, "e": "A Lambda Function URL supports two modes: `AuthType: NONE` (public access) and `AuthType: AWS_IAM` (the request must be signed with SigV4, and the caller must have the `lambda:InvokeFunctionUrl` permission in an IAM policy) — the latter is what restricts access to authorized AWS principals.", "w": "(A) With NONE the URL is public; a resource policy does not add authentication. (C) API keys are an API Gateway feature; IAM auth needs SigV4. (B) Function URLs only support NONE and AWS_IAM."}, {"id": 1418390933, "d": "dep", "t": null, "q": "Which CodeDeploy deployment strategy for Lambda gradually shifts traffic to a new version (e.g. 10% every 10 minutes) with automatic rollback if a CloudWatch Alarm triggers?", "o": ["A Canary or Linear configuration such as `Canary10Percent10Minutes`, with CloudWatch alarms attached for rollback", "`AllAtOnce` with a `BeforeAllowTraffic` hook that checks alarms and shifts traffic gradually", "`HalfAtATime`, which shifts half of the traffic first and the rest after the alarms stay green", "`OneAtATime`, which shifts traffic to the new version in equal steps until all traffic has moved"], "a": 0, "e": "CodeDeploy for Lambda supports predefined configurations: <b>Canary<\/b> (a portion of traffic shifts immediately, the rest shifts later in one jump) and <b>Linear<\/b> (traffic increases evenly in increments at set intervals). Combined with CloudWatch Alarms attached to the deployment group, if an alarm triggers, CodeDeploy automatically rolls traffic back to the previous version.", "w": "(C) HalfAtATime is an EC2/on-premises configuration. (B) AllAtOnce moves all traffic in one step; hooks can only validate. (D) OneAtATime is an EC2/on-premises configuration."}, {"id": 1041831628, "d": "dep", "t": null, "q": "In CodeDeploy for EC2/on-premises deployments, what is the purpose of the `appspec.yml` file and its `hooks` section?", "o": ["It maps files to destinations and attaches scripts to lifecycle hooks such as BeforeInstall and ValidateService", "It defines the instances to deploy to by tag, plus the traffic shifting configuration", "It declares the Auto Scaling settings and the load balancer that CodeDeploy creates for the application", "It lists the build commands and artifacts that CodeBuild runs before deployment starts"], "a": 0, "e": "`appspec.yml` for EC2/on-premises deployments defines a `files` section (where to copy artifacts from/to) and a `hooks` section — a sequence of lifecycle events (`ApplicationStop`, `BeforeInstall`, `AfterInstall`, `ApplicationStart`, `ValidateService`, etc.), each of which can be bound to a custom script for a specific action (e.g. stopping a service, installing dependencies, running a health check).", "w": "(D) Build commands belong in buildspec.yml. (B) Targets and strategy are set in the deployment group and deployment configuration. (C) CodeDeploy does not create these resources; it uses existing ones."}, {"id": 2857422725, "d": "dep", "t": null, "q": "What is the difference between Blue/Green and In-place (rolling) deployment strategies in Elastic Beanstalk?", "o": ["Blue/green runs the new version in a separate environment and swaps CNAMEs; in-place updates the existing instances", "Blue/green updates instances in batches inside one environment; in-place swaps CNAMEs between two environments", "Blue/green is a built-in deployment policy that Beanstalk performs automatically, with no second environment", "In-place deployments always create a second Auto Scaling group; blue/green reuses the current one"], "a": 0, "e": "<b>Blue/Green<\/b> in Elastic Beanstalk is implemented by creating a new environment with the new version, testing it, and then performing a <b>CNAME swap<\/b> — this gives zero downtime and fast rollback (simply swap the CNAME back). <b>In-place (rolling / rolling with additional batch)<\/b> updates instances of the existing environment in batches, which can result in different versions running simultaneously for a period.", "w": "(B) The descriptions are reversed. (C) Blue/green needs a second environment and a manual CNAME swap. (D) Creating a second Auto Scaling group describes immutable deployments."}, {"id": 1831708478, "d": "dep", "t": null, "q": "A developer wants to automate a CI/CD pipeline: on every push to the `main` branch of a CodeCommit repository, build the application, run tests, and deploy to ECS. Which combination of AWS services is typical for this?", "o": ["CodePipeline builds and tests the code itself, and Elastic Beanstalk deploys the containers to ECS", "CodePipeline orchestrates, CodeBuild builds and tests, and CodeDeploy or an ECS action deploys, triggered via EventBridge", "CodeBuild orchestrates the stages, CodePipeline runs the tests, and CodeDeploy pulls the source from CodeCommit", "CodeCommit builds the image, CodeBuild orchestrates the stages, and CodeDeploy runs the unit tests"], "a": 1, "e": "A typical pipeline: <b>CodePipeline<\/b> orchestrates the stages (Source → Build → Deploy); the source is CodeCommit (typically triggered via an EventBridge rule on a push event); the Build stage runs in <b>CodeBuild<\/b> (compilation, tests, building a Docker image); the Deploy stage uses <b>CodeDeploy<\/b> (Blue/Green for ECS) or a native ECS deploy action within CodePipeline.", "w": "(C) Each service is given the wrong role: CodePipeline orchestrates, CodeBuild builds. (D) CodeCommit only stores source; it does not build. (A) CodePipeline does not build; Elastic Beanstalk is a different deployment service."}, {"id": 4068152772, "d": "dep", "t": null, "q": "What is the difference between `aws cloudformation deploy` and `aws cloudformation create-stack`/`update-stack` when using the CloudFormation CLI?", "o": ["`create-stack` and `update-stack` use change sets automatically, while `deploy` applies changes directly", "`deploy` creates a change set and creates or updates the stack as needed; `create-stack` and `update-stack` do one job each", "`deploy` works only for stacks created by SAM; `create-stack` works for all other templates", "`deploy` only previews changes without applying them; `update-stack` applies them immediately"], "a": 1, "e": "`aws cloudformation deploy` is a convenient high-level command: it checks whether the stack exists, creates a change set, displays/applies it, and waits for completion — all in one call, which is well suited to CI/CD scripts. `create-stack` and `update-stack` are separate, lower-level API calls that require you to explicitly pick the right command depending on whether the stack already exists.", "w": "(D) deploy applies the change set it creates. (C) deploy works with any CloudFormation template. (A) It is the other way around: deploy uses change sets."}, {"id": 109996665, "d": "dep", "t": null, "q": "A Docker image for an application needs to be built automatically on every push and stored in a private AWS registry. Which service stores the images, and what is the typical CodeBuild integration?", "o": ["Push the image to Amazon S3 as a tarball; buildspec uploads it with `aws s3 cp` and ECS pulls it from the bucket", "Push the image to AWS CodeArtifact; buildspec authenticates with `aws codeartifact login` before `docker push`", "Push the image to Amazon ECR; buildspec logs in with `aws ecr get-login-password`, then runs `docker build` and `docker push`", "Push the image to Amazon EFS and mount the file system on every container host that needs it"], "a": 2, "e": "<b>Amazon ECR<\/b> is a managed Docker image registry integrated with IAM for access control. A typical CodeBuild `buildspec.yml`: `pre_build` — authenticate via `aws ecr get-login-password | docker login`, `build` — `docker build` and tag the image, `post_build` — `docker push` to the ECR repository. The CodeBuild project must support privileged mode (`privilegedMode: true`) to work with the Docker daemon.", "w": "(A) ECS pulls images from container registries, not from S3 tarballs. (B) CodeArtifact stores packages such as npm, pip and Maven, not Docker images. (D) EFS is a file system, not a container registry."}, {"id": 3119590445, "d": "dep", "t": null, "q": "What is the purpose of a CodeDeploy deployment group's `EC2TagFilters` or Auto Scaling Group setting when deploying to EC2?", "o": ["It lists the CloudFormation stacks that CodeDeploy updates, one stack per target group", "It selects the target instances (by tags or an Auto Scaling group) and holds the deployment settings and rollback triggers", "It stores the application revision and the appspec file that CodeDeploy runs on the instances", "It defines the IAM role that the instances use and the S3 bucket where artifacts are cached"], "a": 1, "e": "A <b>deployment group<\/b> in CodeDeploy defines the target infrastructure for a deployment: specific EC2 instances by tag (`EC2TagFilters`), instances in an Auto Scaling Group, or on-premises instances. It also configures the deployment configuration (rollout strategy), CloudWatch alarms for rollback, and notification triggers.", "w": "(C) Revisions live in S3 or GitHub and are referenced at deployment time. (D) Roles are configured separately; the group references a service role. (A) CodeDeploy deploys applications to instances, functions or services, not CloudFormation stacks."}, {"id": 3470550906, "d": "dep", "t": null, "q": "What is the difference between `Ref` and `Fn::GetAtt` for an `AWS::S3::Bucket` resource in a CloudFormation template?", "o": ["`Ref` returns the bucket ARN; `Fn::GetAtt` returns the bucket name and region", "`Ref` and `Fn::GetAtt` both return the ARN; `GetAtt` is only needed for resources in other stacks", "`Ref` returns the bucket's domain name; `Fn::GetAtt` can only read stack parameters", "`Ref` returns the bucket name; `Fn::GetAtt` returns other attributes such as `Arn` or `DomainName`"], "a": 3, "e": "The behavior of `Ref` depends on the resource type: for `AWS::S3::Bucket`, `Ref` returns the bucket name. To get other attributes (such as `Arn`, `DomainName`, `WebsiteURL`), you must use `Fn::GetAtt` with the name of the attribute specific to that resource type (a full list is documented for each resource type in the CloudFormation docs).", "w": "(A) Ref on a bucket returns the name, and GetAtt returns attributes such as Arn. (C) GetAtt reads resource attributes, not parameters. (B) Ref returns the name; cross-stack values use ImportValue."}, {"id": 2175576108, "d": "dep", "t": null, "q": "In Amazon ECS, what is the difference between the EC2 launch type and Fargate in terms of developer responsibility?", "o": ["With the EC2 launch type you manage the instances; with Fargate AWS runs the infrastructure for your tasks", "With both launch types you patch the host operating system; Fargate only removes the need to size the cluster", "With the EC2 launch type tasks run without task definitions; Fargate requires a task definition per container", "With Fargate you manage the instances and their AMIs; with the EC2 launch type AWS runs them for you"], "a": 0, "e": "<b>EC2 launch type<\/b>: the developer is responsible for the cluster of EC2 instances, including scaling capacity, OS patching, and instance type selection. <b>Fargate<\/b>: a serverless model — you just define a task definition (vCPU, memory, container image), and AWS provisions and manages the underlying compute resources, with no access to or need to manage hosts.", "w": "(D) The responsibilities are reversed. (B) Fargate has no hosts for you to patch. (C) Both launch types need task definitions."}, {"id": 630506413, "d": "dep", "t": null, "q": "A CodePipeline's Deploy stage fails due to insufficient IAM Role permissions for the pipeline. What is the developer's best course of action?", "o": ["Create a new pipeline under the root user, which is not subject to IAM permission checks", "Read the failed action's error, then add the specific missing permission to the pipeline's service role", "Add the missing permission to the deployment target's role instead, because the pipeline assumes that role", "Attach AdministratorAccess to the pipeline role so that no permission problem can occur again"], "a": 1, "e": "The correct approach is to diagnose the specific error (through the stage execution details in CodePipeline or related CloudTrail events) and add exactly the permissions needed to the pipeline's IAM Role for the relevant deploy action (CloudFormation, ECS, S3, CodeDeploy, etc.), following the principle of least privilege rather than granting excessive access.", "w": "(D) That violates least privilege. (A) Pipelines run with a service role; creating one as root does not change that. (C) The pipeline's actions run with the pipeline role (or an action role), so that is where the permission must be added."}, {"id": 4265463770, "d": "dep", "t": null, "q": "What is the purpose of `TerminationProtection` and `DeletionPolicy: Retain` in CloudFormation when working with critical resources (e.g. a production RDS instance)?", "o": ["Termination protection keeps a resource when the stack is deleted; `DeletionPolicy: Retain` blocks deleting the stack", "Termination protection stops resource replacement during updates; `Retain` stops changes to resource properties", "Both settings block stack deletion; `Retain` additionally takes a snapshot of every resource before deletion", "Termination protection blocks deleting the stack; `DeletionPolicy: Retain` keeps a resource when the stack is deleted"], "a": 3, "e": "<b>TerminationProtection<\/b> is a stack-level property that blocks the stack deletion command itself until explicitly disabled. <b>DeletionPolicy: Retain<\/b> is a per-resource property that tells CloudFormation to leave that specific resource 'orphaned' (not delete it) even if the rest of the stack is deleted. For some resources (RDS, EBS) there is also `DeletionPolicy: Snapshot`, which explicitly creates a snapshot before deletion.", "w": "(A) The two settings are swapped. (C) Retain does not create snapshots; Snapshot is a separate DeletionPolicy value for supported resources. (B) Replacement and property changes are controlled by stack policies and update behaviors, not by these settings."}, {"id": 3594622950, "d": "ts", "t": null, "q": "A Lambda function connected to a VPC for RDS access has started timing out when calling an external public API (e.g. a third-party payment gateway). What is the most likely cause?", "o": ["RDS and external HTTPS calls cannot be made from the same function, so the API call times out", "The function needs a larger memory setting, because network throughput grows with memory in a VPC", "The function is in private subnets with no route to a NAT gateway, so it cannot reach the public internet", "The function's execution role lacks `ec2:CreateNetworkInterface`, so outbound HTTPS calls are blocked"], "a": 2, "e": "When a Lambda function is attached to private VPC subnets, it loses the default internet access that Lambdas outside a VPC have. To reach external (non-AWS) HTTP endpoints, the private subnet must have a route via a <b>NAT Gateway<\/b> (in a public subnet with an Internet Gateway), or alternatively the function could be placed in a subnet with direct access if needed (less secure). VPC endpoints only solve access to specific AWS services, not arbitrary external APIs.", "w": "(D) A missing permission would break the function's start-up, not only outbound calls. (A) A function can call both a database and public endpoints. (B) Memory affects CPU and throughput but cannot add a route to the internet."}, {"id": 2399898323, "d": "ts", "t": null, "q": "CloudWatch Logs for a Lambda function show the error `Task timed out after 3.00 seconds`, even though the function calls an external API that sometimes takes longer to respond. What is the correct action?", "o": ["Increase the function timeout to match the slow dependency and set a shorter client timeout in the HTTP library", "Enable provisioned concurrency, which also raises the maximum duration of each invocation", "Reduce the memory so the function waits longer for the external API before it times out", "Increase the reserved concurrency so more instances share the waiting time for slow responses"], "a": 0, "e": "The default timeout for a newly created Lambda function is 3 seconds, which is often too short for calls to external APIs. The fix is to increase the function's `Timeout` setting (up to the 900-second / 15-minute maximum) to match the realistic response time of the dependency, and additionally set the HTTP client's own timeout slightly shorter to handle slow responses in a controlled way rather than relying solely on Lambda's hard cutoff.", "w": "(C) Memory does not change how long a call waits, and less memory slows the code. (D) Concurrency limits how many run at once, not how long each can run. (B) Provisioned concurrency removes cold starts but does not change the timeout."}, {"id": 3932428702, "d": "ts", "t": null, "q": "A DynamoDB table with provisioned throughput periodically returns `ProvisionedThroughputExceededException`, even though the average load is below the configured WCU/RCU limit. What is the most likely cause?", "o": ["A Local Secondary Index shares the table's capacity and causes throttling whenever it is queried", "A hot partition: the table capacity is split across partitions, and one partition key receives most of the traffic", "Burst capacity is exhausted once per day, so the table is throttled until midnight UTC", "Auto scaling is disabled, so the capacity never grows even though the average utilization is below the limit"], "a": 1, "e": "DynamoDB distributes provisioned capacity evenly across the table's physical partitions. If the partition key is poorly designed (for example, low cardinality of values or uneven access patterns — a 'hot key'/'hot partition'), one partition can receive disproportionately many requests and hit its share of capacity, even when the total table load is within the overall limit. Solution: improve the partition key design (higher cardinality, write sharding) or switch to On-Demand capacity mode.", "w": "(D) Auto scaling reacts to sustained load; hot-key throttling happens even with idle total capacity. (C) There is no daily reset of burst capacity. (A) Queries on an LSI use the table's capacity but do not throttle on their own."}, {"id": 1292936983, "d": "ts", "t": null, "q": "An API Gateway REST API returns `403 Forbidden` with the message `Missing Authentication Token`, even though the Lambda integration and path appear correctly configured. What is the most likely cause?", "o": ["The Lambda function returned an invalid response, which API Gateway reports as an authentication error", "The caller's access key has expired, so the SigV4 signature on the request is rejected", "The request used a path or method that does not exist in the API, so API Gateway found no route", "The Cognito token in the Authorization header has expired, so the authorizer returns 403"], "a": 2, "e": "Despite its name, the `Missing Authentication Token` error in API Gateway most commonly signals that the request targets a path/method for which no resource or method is defined in the API (i.e. the client is calling a nonexistent route), rather than a problem with an authorization token. Check the exact path, method, and stage in the request URL (`https://{id}.execute-api.{region}.amazonaws.com/{stage}/{resource}`).", "w": "(B) That gives a different error (for example an expired token or a signature mismatch). (D) An expired authorizer token returns 401 Unauthorized. (A) An invalid Lambda response produces 502."}, {"id": 2487927300, "d": "ts", "t": null, "q": "An application on EC2 in a private subnet cannot download update packages from the internet, even though the Security Group and NACL allow outbound traffic on port 443. What is a possible cause specific to a private subnet?", "o": ["The instance needs an Elastic IP, since NAT gateways only translate traffic from public addresses", "The security group needs an inbound rule for port 443 so that update servers can answer the requests", "The private subnet's route table has no `0.0.0.0/0` route to a NAT gateway in a public subnet", "The internet gateway must be attached to the private subnet itself instead of to the VPC"], "a": 2, "e": "Even if the Security Group and NACL allow the traffic, without a corresponding entry in the <b>route table<\/b> (a `0.0.0.0/0` route pointing to a NAT Gateway for a private subnet, or to an Internet Gateway for a public subnet), packets simply have no physical path to the internet. Security Groups and NACLs control what is permitted, while the route table determines where traffic actually goes.", "w": "(B) Security groups are stateful; replies to allowed outbound requests need no inbound rule. (A) NAT gateways translate private addresses; the instance needs no Elastic IP. (D) An internet gateway is attached to the VPC; subnets use routes."}, {"id": 756332857, "d": "ts", "t": null, "q": "A CloudWatch Alarm on a Lambda function's `Errors` metric is stuck in the `INSUFFICIENT_DATA` state, even though the function is actively being invoked and occasionally fails. What is the most likely cause of this state?", "o": ["Lambda publishes the Errors metric every 15 minutes, which is longer than any alarm period allows", "The metric is published only after a failed invocation completes, so successful runs never produce data", "Too few data points arrive in the evaluation window, for example a short period with infrequent invocations", "The alarm's SNS topic has no subscribers, so CloudWatch cannot evaluate the metric"], "a": 2, "e": "The `INSUFFICIENT_DATA` state means CloudWatch has not yet received enough data points for the metric within the configured evaluation window to determine ALARM or OK — this often happens right after an alarm is created, with infrequent function invocations (Lambda metrics are only published when there are invocations), or when the `Period` is too short relative to the invocation frequency.", "w": "(B) Lambda publishes Errors with a zero value when invocations succeed. (A) Metrics are published per minute. (D) Actions on the alarm do not affect its evaluation."}, {"id": 2729738927, "d": "ts", "t": null, "q": "An X-Ray trace shows a large gap in time between the Lambda function's segment and the DynamoDB call subsegment, with no explicit error. What typically causes such a gap, and how should it be investigated?", "o": ["The X-Ray daemon was unreachable, so X-Ray fills the missing time with an estimated gap", "The function exceeded its memory limit, so Lambda paused it until memory was available", "A cold start: initialization outside the handler shows as a gap, visible as `InitDuration` and an Initialization segment", "DynamoDB throttled the call, which X-Ray shows as an empty gap until the retry succeeds"], "a": 2, "e": "In an X-Ray trace, Lambda separately shows an initialization segment (cold start: runtime loading, code execution outside the handler function, e.g. creating SDK clients at the top level of a file). This initialization time can sometimes appear as a 'gap' between the overall invocation and the start of traced subsegments. Checking `InitDuration` in CloudWatch Logs and the Initialization segment in X-Ray helps confirm this cause.", "w": "(D) Throttling shows up as errors or retries in the subsegment. (A) A missing daemon results in missing segments, not estimated gaps. (B) Exceeding memory terminates the invocation instead of pausing it."}, {"id": 2388945533, "d": "ts", "t": null, "q": "A CodeDeploy deployment to EC2 fails at the `ValidateService` hook with a timeout. What diagnostic approach is most effective?", "o": ["Replace the CodeDeploy agent on the instance with the latest version and redeploy the revision", "Switch the deployment configuration to AllAtOnce so the hook runs on every instance simultaneously", "Read the CodeDeploy agent log and the hook script output on the instance to see why validation fails", "Increase the deployment group's timeout and run the deployment again to give the hook more time"], "a": 2, "e": "When a deployment fails at a specific lifecycle hook (here `ValidateService`), you should investigate the CodeDeploy agent's logs on the instance itself, which contain the output of the script bound to that hook in `appspec.yml`. This reveals the exact cause: the application didn't start in time, the health-check endpoint is unreachable, the wrong port, etc., allowing you to fix the actual root cause.", "w": "(D) A longer timeout hides the problem if the application never starts. (A) Reinstalling is guesswork without evidence from the logs. (B) AllAtOnce changes the rollout pace but does not explain the failing check."}, {"id": 2061726848, "d": "ts", "t": null, "q": "An application writes heavily to S3 via `PutObject` and occasionally receives `SlowDown` (503) errors under a very high request rate to a single prefix. Which practice reduces the likelihood of this error?", "o": ["Increase the bucket's request rate limit in the S3 console, which is configurable per bucket", "Spread keys over several prefixes and retry with exponential backoff when S3 answers with SlowDown", "Enable Transfer Acceleration, which raises the request rate limit for each prefix", "Switch the bucket to S3 Intelligent-Tiering, which provisions extra request capacity automatically"], "a": 1, "e": "While modern S3 automatically scales performance and supports thousands of requests per second per prefix, under a very high and sudden burst of load concentrated on a narrow range of keys (especially sequential names) occasional `503 SlowDown` responses are possible. The best practice is to distribute keys across multiple logical prefixes (this allows S3 to better parallelize internal partitioning) and implement retries with exponential backoff and jitter on the client to handle occasional SlowDown responses.", "w": "(A) There is no per-bucket request-rate setting; scaling happens per prefix. (C) Transfer Acceleration improves long-distance transfer speed, not request-rate limits. (D) Storage classes do not change request-rate limits."}, {"id": 2738489168, "d": "dev", "t": null, "q": "An API Gateway REST API should reject malformed requests (missing required f
