at rolls the configuration back after it is deployed", "You attach a JSON Schema or Lambda validator, and invalid configuration cannot be deployed", "You attach an IAM policy that restricts which principals can read the configuration"], "a": 2, "e": "AppConfig <b>validators<\/b> let you define constraints — either a JSON Schema for structural/type validation, or a Lambda function for custom business-logic validation — that a new configuration version must pass before it can be deployed, preventing a malformed or logically incorrect configuration change from ever reaching running applications.", "w": "(B) Alarms monitor deployments and roll back; validators block bad configuration before deployment. (A) Deployment strategies control the rollout speed. (D) IAM policies control access, not validity."}, {"id": 2958229158, "d": "ts", "t": "apigw", "q": "An API Gateway REST API with a Lambda proxy integration returns `502 Bad Gateway`, although the function runs successfully when tested in the Lambda console. What is the most likely cause?", "o": ["The API stage has caching enabled with a TTL that is shorter than the function duration", "The function returns a response without the `statusCode`, `headers` and string `body` fields", "The method request requires an API key, and the caller did not send one", "The execution role of the function lacks `lambda:InvokeFunction` for API Gateway"], "a": 1, "e": "With <b>Lambda proxy integration<\/b> API Gateway expects an object like <code>{statusCode, headers, body}<\/code> where <code>body<\/code> is a string. A malformed response (or an unhandled exception) produces <b>502 Bad Gateway<\/b>.", "w": "(A) Caching does not cause a 502. (D) Invocation permissions are granted by a resource-based policy on the function, and a missing one gives a different error. (C) A missing API key gives 403."}, {"id": 1012103022, "d": "ts", "t": "apigw", "q": "A request to an API Gateway endpoint fails with `504 Gateway Timeout` after about 29 seconds, while the Lambda function behind it needs about 40 seconds to finish. What should the developer do?", "o": ["Make the flow asynchronous, because the integration timeout is 29 seconds", "Enable stage caching so the response is returned from the cache after the first timeout", "Switch the endpoint type to edge-optimized, which has a longer integration timeout", "Add automatic retries to the method so the call is repeated until the function finishes"], "a": 0, "e": "The standard API Gateway integration timeout is <b>29 seconds<\/b> (the value the exam expects). Long work should be decoupled: return 202 quickly and use SQS, Step Functions or a callback/polling pattern.", "w": "(D) API Gateway does not retry a timed-out integration. (B) The cache is filled only by successful responses. (C) The timeout does not depend on the endpoint type."}, {"id": 3795107813, "d": "ts", "t": "apigw", "q": "A JavaScript web app on `https://app.example.com` calls an API Gateway REST API and the browser console shows a CORS error, but the same request works with curl. What fixes this?", "o": ["Change the endpoint type to private so that browsers can call it from your domain", "Enable CORS on the API and, with Lambda proxy integration, return the CORS headers from the function", "Attach a WAF web ACL that allows the web app's origin to call the API", "Add an IAM policy for the browser user that allows `execute-api:Invoke` on the API"], "a": 1, "e": "CORS is enforced by browsers. API Gateway must answer the preflight <code>OPTIONS<\/code> request and responses need <code>Access-Control-Allow-Origin<\/code>. For <b>Lambda proxy<\/b> integrations the Lambda response must include these headers itself.", "w": "(D) curl works without IAM, so permissions are not the problem. (C) WAF filters requests; it does not add CORS headers. (A) Private endpoints are reachable only from a VPC."}, {"id": 1440079696, "d": "ts", "t": "apigw", "q": "Clients of an API Gateway API start receiving `429 Too Many Requests`. Which actions reduce the problem? (choose the best single answer)", "o": ["Disable the API's CloudWatch logging, which counts toward the account's request limit", "Retry with exponential backoff, use usage plans and caching, and request higher limits if needed", "Increase the Lambda function's reserved concurrency to raise the API Gateway request limit", "Switch to an edge-optimized endpoint, which removes the throttling limits of regional APIs"], "a": 1, "e": "429 means a <b>throttle limit<\/b> (account, stage/method or usage plan) was hit. Combine backoff on clients, caching to cut backend calls, per-client usage plans and a quota/limit increase if needed.", "w": "(C) Lambda concurrency does not change API Gateway throttle limits. (D) Edge-optimized APIs have the same limits. (A) Logging does not count toward the request limit."}, {"id": 334244673, "d": "ts", "t": "lambda", "q": "A Lambda function that resizes images is slow and CPU-bound. What is the simplest way to make it faster without changing code?", "o": ["Increase the memory setting, because CPU is allocated in proportion to memory", "Enable provisioned concurrency, which allocates dedicated vCPUs to the function", "Increase the timeout, because a longer timeout makes Lambda allocate more CPU", "Increase the ephemeral storage size, which raises the CPU quota of the function"], "a": 0, "e": "Lambda has no separate CPU setting: <b>CPU scales with memory<\/b> (about 1 vCPU at 1,769 MB). More memory often reduces duration (and can even lower cost).", "w": "(C) The timeout only limits the run time. (B) Provisioned concurrency pre-warms environments without adding CPU. (D) Storage size does not change CPU."}, {"id": 2279780230, "d": "ts", "t": "lambda", "q": "A Lambda function is triggered by SQS. Messages are processed multiple times and reappear in the queue while the function is still running. What is the likely misconfiguration?", "o": ["The queue's receive wait time is longer than the function's run time", "The queue's retention period is shorter than the function's run time", "The queue's delay setting is longer than the function's run time", "The queue's visibility timeout is shorter than the function's run time"], "a": 3, "e": "If the <b>visibility timeout<\/b> expires before the function finishes, the message becomes visible again and is processed twice. Set it to at least <b>6x the function timeout<\/b> (plus batch window).", "w": "(B) Retention controls how long messages are kept. (A) Receive wait time controls long polling. (C) Delay hides new messages."}, {"id": 3331238405, "d": "ts", "t": "lambda", "q": "The `IteratorAge` metric of a Lambda function consuming a Kinesis stream keeps increasing. What does it indicate and how can it be fixed?", "o": ["The function falls behind the stream; add shards or parallelization, speed it up, and check retries", "The function reads from an expired shard iterator, which restarts at the oldest record", "The producers send records too slowly, so the function waits for new data", "The stream has too many shards, so the function reads records that are already expired"], "a": 0, "e": "<b>IteratorAge<\/b> is the age of the last record read. A growing value means the consumer is slower than the producers. Options: more shards, <code>ParallelizationFactor<\/code> (up to 10 per shard), faster function, batch tuning, fix failing batches.", "w": "(D) Expired records are not the symptom. (C) Slow producers give a low age, not a growing one. (B) Lambda manages iterators for you."}, {"id": 614560149, "d": "ts", "t": "lambda", "q": "A single bad record in a Kinesis shard makes a Lambda function fail repeatedly and blocks processing of every later record in that shard. Which settings help?", "o": ["Add a dead-letter queue to the Lambda function so failed records leave the stream", "Increase the batch size so the failing record is processed together with more records", "Increase the shard count so the failing record moves to a new shard", "Enable bisect batch on error, set a maximum retry count and add an on-failure destination"], "a": 3, "e": "For stream sources a failing batch is retried until it succeeds or expires, which <b>blocks the shard<\/b>. Use <code>BisectBatchOnFunctionError<\/code>, <code>MaximumRetryAttempts<\/code>, <code>MaximumRecordAgeInSeconds<\/code> and an <b>on-failure destination<\/b>.", "w": "(B) A larger batch makes retries even more likely to include the bad record. (A) A function DLQ is for asynchronous invocations; stream sources use on-failure destinations on the mapping. (C) Resharding does not move records already in a shard."}, {"id": 284128165, "d": "ts", "t": "lambda", "q": "A Java Lambda function has noticeable cold-start latency on the first request after idle periods. Which feature reduces this with the least code change?", "o": ["Use a smaller deployment package by moving the dependencies into a layer", "Increase the reserved concurrency so more warm environments stay available", "Use SnapStart, or provisioned concurrency for guaranteed warm environments", "Enable active tracing, which keeps one environment initialized"], "a": 2, "e": "<b>SnapStart<\/b> restores a pre-initialized snapshot, cutting JVM cold starts. <b>Provisioned concurrency<\/b> keeps environments initialized. Both target cold starts directly.", "w": "(B) Reserved concurrency does not pre-warm environments. (D) Tracing does not keep environments warm. (A) A layer counts toward the same package size and does not fix JVM start-up."}, {"id": 616190724, "d": "ts", "t": "lambda", "q": "A Lambda function in private subnets of a VPC times out when calling DynamoDB. What is the most cost-effective fix?", "o": ["Add an interface VPC endpoint for DynamoDB and attach the function's security group", "Add a gateway VPC endpoint for DynamoDB to the route tables of the private subnets", "Add an internet gateway route to the private subnets for the DynamoDB IP ranges", "Move the function out of the VPC and give it a VPC peering connection for DynamoDB"], "a": 1, "e": "Lambda in a VPC has no internet path by default. A <b>gateway VPC endpoint<\/b> for DynamoDB (and S3) is free and keeps traffic private. A NAT gateway would also work but costs more.", "w": "(A) An interface endpoint works but has hourly charges; the gateway endpoint is free. (C) Private subnets cannot use an internet gateway without public addresses. (D) Peering does not connect to DynamoDB."}, {"id": 4197871277, "d": "ts", "t": "dynamodb", "q": "Writes to a DynamoDB table are being throttled even though the table's provisioned write capacity looks sufficient. One Global Secondary Index has low provisioned write capacity. What is happening?", "o": ["The table's burst capacity is shared with the GSI, and the GSI has consumed it", "The GSI is rebuilt after every write, which uses the table's write capacity", "Every write is also applied to the GSI, so a throttled GSI throttles the base table", "The GSI's reads use the table's write capacity, because indexes share one capacity pool"], "a": 2, "e": "Every table write that touches indexed attributes is replicated to the GSI. If the <b>GSI lacks write capacity<\/b>, back-pressure causes throttling on the base table. Provision the GSI adequately (or use on-demand).", "w": "(A) The throttling comes from the GSI not accepting writes, not from burst sharing. (B) Index updates are incremental, not rebuilds. (D) Reads and writes use separate capacity types."}, {"id": 263485330, "d": "ts", "t": "dynamodb", "q": "A read-heavy application repeatedly reads the same DynamoDB items and needs microsecond latency without rewriting the data access layer. What should be used?", "o": ["A global table in the same region, which serves reads from memory", "DynamoDB Accelerator (DAX), an in-memory cache with the same API", "On-demand capacity mode, which caches hot items automatically", "A read-only secondary index that is cached in the client application"], "a": 1, "e": "<b>DAX<\/b> is an API-compatible in-memory cache for DynamoDB that serves cached reads in microseconds, with minimal code changes (swap the client).", "w": "(A) Global tables replicate across regions and do not cache. (D) Indexes are not in-memory caches. (C) On-demand mode changes billing, not caching."}, {"id": 3587540178, "d": "ts", "t": "dynamodb", "q": "Putting an item into DynamoDB fails with a validation error about item size. What is the standard solution?", "o": ["Move part of the attributes to a Local Secondary Index so that the base item stays below the limit", "Keep the payload in S3 and store a pointer plus metadata in the item, because items are limited to 400 KB", "Request a higher item size limit through Service Quotas, since the 400 KB limit is a soft quota", "Enable compression on the table so that items up to 4 MB fit within the item size limit"], "a": 1, "e": "A DynamoDB item can be at most <b>400 KB<\/b>. The common pattern is <b>S3 for the large object, DynamoDB for the index/pointer<\/b>.", "w": "(D) DynamoDB has no table-level compression setting that changes the limit. (C) The item size limit is fixed. (A) Indexes store copies of projected attributes and do not offload size."}, {"id": 1918066155, "d": "ts", "t": "s3", "q": "A user can call `s3:PutObject` on a bucket that enforces SSE-KMS with a customer managed key, but uploads fail with AccessDenied. What is the likely missing permission?", "o": ["Permission to read the bucket's encryption settings with `s3:GetEncryptionConfiguration`", "Permission to use the KMS key, such as `kms:GenerateDataKey`, in the IAM policy and key policy", "Permission to pass the KMS key to S3 with `iam:PassRole` on the key's ARN", "Permission for S3 to assume the user's role with `sts:AssumeRole` in the bucket policy"], "a": 1, "e": "With <b>SSE-KMS<\/b> the caller needs access to the KMS key as well as S3: <code>kms:GenerateDataKey<\/code> for uploads, <code>kms:Decrypt<\/code> for downloads, granted via IAM and allowed by the key policy.", "w": "(A) Reading the configuration is not needed for uploads. (C) PassRole applies to roles, not to KMS keys. (D) S3 does not assume the user's role; the user needs permission to use the key."}, {"id": 767097749, "d": "ts", "t": "s3", "q": "A static website hosted on S3 returns `403 Forbidden` to visitors. The files exist. What should be checked first?", "o": ["Block Public Access and a bucket policy that allows `s3:GetObject` (or CloudFront with OAC)", "The CORS configuration, because browsers block pages without an `Access-Control-Allow-Origin` header and report 403", "The number of prefixes in the bucket, because websites are limited to ten prefixes", "Versioning settings, because suspended versioning blocks anonymous reads of the latest version"], "a": 0, "e": "S3 website endpoints serve public content: <b>Block Public Access<\/b> must be relaxed and a bucket policy must allow <code>s3:GetObject<\/code>. A better pattern is CloudFront with <b>OAC<\/b>.", "w": "(D) Versioning does not control public reads. (C) There is no prefix limit. (B) CORS errors are produced by the browser; the server does not return 403 for them."}, {"id": 748953990, "d": "ts", "t": "cfn", "q": "A CloudFormation stack creation failed and the stack shows `ROLLBACK_COMPLETE`. What can be done with this stack?", "o": ["Update it with the corrected template, which reuses the resources that were created", "Execute a change set that adds the missing resources to the existing stack", "Run `ContinueUpdateRollback` to move it to `CREATE_COMPLETE`", "Delete it and create a new stack after fixing the template, because it cannot be updated"], "a": 3, "e": "A stack in <b>ROLLBACK_COMPLETE<\/b> (failed creation) can only be <b>deleted<\/b>. You fix the cause and create a new stack. To debug, you can disable rollback or keep successfully provisioned resources.", "w": "(A) A stack in ROLLBACK_COMPLETE cannot be updated. (C) ContinueUpdateRollback works for UPDATE_ROLLBACK_FAILED. (B) Change sets cannot be executed on a stack in this state."}, {"id": 2280730963, "d": "ts", "t": "cfn", "q": "Deleting a CloudFormation stack fails with `DELETE_FAILED` for an S3 bucket resource. What is the most likely reason?", "o": ["The bucket still contains objects, and CloudFormation cannot delete a non-empty bucket", "The bucket policy denies `s3:DeleteBucket` for the role that CloudFormation uses", "The bucket was created in another region, and stacks can only delete buckets in their own region", "The bucket has versioning enabled, and CloudFormation cannot delete versioned buckets"], "a": 0, "e": "CloudFormation only deletes <b>empty<\/b> buckets. Empty the bucket (or use a custom resource / <code>DeletionPolicy: Retain<\/code>) and retry the delete.", "w": "(D) Versioned buckets can be deleted once they are empty, including all versions. (B) That is possible but not the typical cause; the usual cause is objects in the bucket. (C) Buckets created by a stack are in the stack's region."}, {"id": 435742490, "d": "ts", "t": "cfn", "q": "An administrator manually changed a security group that was created by CloudFormation. How can the team detect that the real resources no longer match the template?", "o": ["Run drift detection on the stack to compare the real resources with the template", "Create a change set with the unchanged template, which lists manual changes as differences", "Compare the stack's Outputs with the current values of the resources", "Enable a stack policy, which reports manual modifications as update failures"], "a": 0, "e": "<b>Drift detection<\/b> compares the actual resource configuration with the template and reports modified or deleted resources.", "w": "(B) A change set compares the template with the stack's recorded state, not with real resources. (C) Outputs are only values the template defines. (D) Stack policies only restrict updates made through CloudFormation."}, {"id": 2510802557, "d": "ts", "t": "ecs", "q": "A Fargate task in a private subnet stops with `CannotPullContainerError` when pulling an image from ECR. What should be verified?", "o": ["The task role allows `ecr:GetAuthorizationToken`, which the application code needs to pull its image", "The task definition's CPU and memory sum is higher than the Fargate task size", "The subnet can reach ECR (NAT gateway or VPC endpoints) and the execution role may pull the image", "The cluster has Container Insights enabled, which blocks image pulls from private registries"], "a": 2, "e": "To pull images the task needs network access to ECR (<b>NAT gateway<\/b> or <b>VPC endpoints<\/b> for ECR API, ECR DKR and S3) and an <b>execution role<\/b> with ECR permissions.", "w": "(A) Pulling images is done by the execution role, not the task role. (D) Container Insights does not affect image pulls. (B) A size mismatch is rejected at registration time, not as a pull error."}, {"id": 2547799337, "d": "ts", "t": "ecs", "q": "An ECS service behind an ALB keeps replacing tasks because they fail health checks, although the container starts. What are common causes?", "o": ["The ECR repository has scan on push enabled, which delays registration of the task", "The task uses `awsvpc` mode, which does not support load balancer health checks", "The task definition has no memory reservation, so the load balancer marks it unhealthy", "The health check path or port is wrong, the container port does not match, or the security group blocks the ALB"], "a": 3, "e": "ALB health check failures are usually a mismatch of <b>path/port/protocol<\/b>, a wrong container port mapping, an app that starts slowly (health check grace period), or <b>security groups<\/b> blocking the ALB.", "w": "(B) awsvpc supports ALB health checks; targets are task IPs. (C) A missing memory reservation does not cause failed health checks. (A) Scanning does not delay task registration."}, {"id": 226809508, "d": "ts", "t": "elb-asg", "q": "An Auto Scaling group keeps terminating and relaunching instances in a loop. Instances need 4 minutes to boot the application, and ELB health checks are used. What is the best fix?", "o": ["Increase the default cooldown so that the group does not launch new instances while old ones start", "Increase the health check grace period so the application can finish starting before checks count", "Increase the deregistration delay so that starting instances are not removed from the target group", "Switch the health check type to EC2 so the load balancer is no longer consulted"], "a": 1, "e": "With ELB health checks, instances failing during boot are replaced. The <b>health check grace period<\/b> (default 300 s) gives time for startup before checks count.", "w": "(A) Cooldown limits scaling activities, not health checks. (D) That hides application failures permanently; the grace period is the targeted fix. (C) Deregistration delay applies when instances leave the group."}, {"id": 3739928829, "d": "ts", "t": "elb-asg", "q": "Users of a web app behind an ALB lose their shopping cart because requests reach different instances. Which solutions fix this? (choose the best answer)", "o": ["Increase the deregistration delay so that sessions survive when instances are replaced", "Replace the ALB with an NLB, which always routes a client to the same instance by IP", "Enable sticky sessions, or better, keep session data in ElastiCache or DynamoDB", "Enable cross-zone load balancing so that all requests of a user reach the same Availability Zone"], "a": 2, "e": "<b>Sticky sessions<\/b> pin a user to one target, but the more scalable design is a <b>stateless application<\/b> with session state in ElastiCache or DynamoDB.", "w": "(D) Cross-zone balancing spreads requests across zones. (B) An NLB does not provide per-user session persistence by itself; external session storage does. (A) Deregistration delay only keeps in-flight requests alive."}, {"id": 1867028906, "d": "ts", "t": "cicd", "q": "A CodeBuild project that runs `docker build` fails with `Cannot connect to the Docker daemon`. What is the fix?", "o": ["Grant `ecr:*` to the service role so that the Docker daemon is allowed to start", "Use a larger compute type, because small build environments cannot run Docker", "Add a command to the `install` phase of the buildspec that installs the Docker package", "Enable privileged mode in the CodeBuild project environment"], "a": 3, "e": "Building Docker images inside CodeBuild requires <b>privileged mode<\/b> so the Docker daemon can run.", "w": "(C) Installing the package does not grant the privileges that the daemon needs. (B) Compute size does not enable the daemon. (A) ECR permissions do not start the daemon."}, {"id": 3967637600, "d": "ts", "t": "cicd", "q": "A CodeDeploy deployment to EC2 fails during `AfterInstall`. Where should the developer look first?", "o": ["The S3 access logs of the revision bucket, which show the script exit codes", "The CloudTrail event history for `CreateDeployment`, which holds the script output", "The CodeDeploy agent logs and the hook script output on the instance", "The deployment group's CloudWatch alarm history, which records every hook failure"], "a": 2, "e": "Hook failures are diagnosed on the instance: <b>CodeDeploy agent log<\/b> and the deployment log directory show the script error. Also verify the agent is running and the instance role can fetch the revision.", "w": "(B) CloudTrail records the API call, not script output. (D) Alarm history shows alarm state changes. (A) S3 logs show requests, not script results."}, {"id": 965415882, "d": "ts", "t": "cicd", "q": "A CodePipeline with a CodeCommit source does not start after commits. Which area is the most likely cause?", "o": ["The build project lacks a cache, so CodePipeline skips the source stage", "The EventBridge rule that starts the pipeline is missing, disabled or lacks permission", "The artifact bucket has no versioning, so CodePipeline cannot detect new commits", "The repository has more branches than the pipeline allows, so commits are ignored"], "a": 1, "e": "Pipeline triggers for CodeCommit use an <b>EventBridge rule<\/b> (with a role allowed to call <code>codepipeline:StartPipelineExecution<\/code>). A missing or disabled rule means no trigger.", "w": "(C) Versioning matters for S3 sources, not CodeCommit. (A) Caches only speed up builds. (D) A pipeline watches one configured branch; the number of branches does not matter."}, {"id": 35049086, "d": "ts", "t": "monitoring", "q": "A microservices application on Lambda, API Gateway and DynamoDB has high end-to-end latency. Which service shows which component contributes most of the time?", "o": ["AWS CloudTrail, using the event history to compare request times across services", "Amazon CloudWatch Logs Insights, using queries that sum the duration of each service", "AWS X-Ray, using the service map and trace timelines", "AWS Config, using resource timelines that show the response time of each component"], "a": 2, "e": "<b>X-Ray<\/b> traces requests across services and shows latency per segment/subsegment, pointing at the slow component.", "w": "(B) Logs Insights analyzes logs but does not trace a request across services. (A) CloudTrail records API calls, not request latency. (D) Config records configuration changes."}, {"id": 1203881232, "d": "ts", "t": "monitoring", "q": "The team needs to find out who deleted an SQS queue yesterday and from which IP address. Which service has this information?", "o": ["SQS access logs, which are delivered to S3 for each queue by default", "AWS CloudTrail, which records the `DeleteQueue` call with the caller and source IP", "VPC Flow Logs, which show the API call and the IAM user that sent it", "CloudWatch metrics for SQS, which record the identity of whoever deleted the queue"], "a": 1, "e": "<b>CloudTrail<\/b> records API calls with the caller identity, time and source IP. <code>DeleteQueue<\/code> is a management event recorded by default.", "w": "(D) Metrics are counts, not identities. (A) SQS has no default access logs. (C) Flow logs show network flows, not API calls."}, {"id": 2561160544, "d": "ts", "t": "monitoring", "q": "An application writes the word `ERROR` into its logs. The team wants an alarm when more than 5 errors occur in 5 minutes. What is the standard approach?", "o": ["Create a subscription filter for `ERROR` that sets the alarm state through a Lambda function", "Enable detailed monitoring on the instance, which adds an error count metric automatically", "Create a metric filter for `ERROR` and a CloudWatch alarm on the resulting metric", "Create a Logs Insights query for `ERROR` and attach an alarm directly to the saved query"], "a": 2, "e": "A <b>metric filter<\/b> turns matching log lines into a CloudWatch metric, and an <b>alarm<\/b> on that metric notifies through SNS.", "w": "(A) That works only with custom code; a metric filter and alarm are built in. (B) Detailed monitoring adds EC2 metrics at one-minute intervals, not application errors. (D) Alarms use metrics, not saved Logs Insights queries."}, {"id": 1166227520, "d": "ts", "t": "monitoring", "q": "A developer needs to analyze millions of log events across several log groups to find the top 10 client IP addresses by request count. Which tool fits?", "o": ["CloudWatch Logs Insights, with a query that counts requests by IP and sorts the result", "X-Ray annotations, which store each client IP address and rank them by request count", "CloudWatch metric filters, which count requests per IP address across log groups", "CloudWatch Synthetics, which replays the logged requests and ranks the client addresses"], "a": 0, "e": "<b>Logs Insights<\/b> is an interactive query language for log groups (<code>stats count(*) by ip | sort desc | limit 10<\/code>).", "w": "(C) Metric filters count matches for a metric, but ranking by IP needs a query. (B) X-Ray annotations apply to traced requests, not to arbitrary log events. (D) Synthetics runs scripted checks."}, {"id": 252541523, "d": "ts", "t": "iam-adv", "q": "A role has an `Allow` for `s3:GetObject` but requests still fail with AccessDenied. Which are possible reasons? (choose the best answer)", "o": ["The role's name is longer than 64 characters, which makes IAM ignore its policies", "The object is smaller than the minimum size for `GetObject` in the bucket's storage class", "The role and the bucket are in the same account, which requires a bucket policy as well", "An explicit Deny, a permissions boundary, an SCP, or a resource or KMS policy that blocks the caller"], "a": 3, "e": "Evaluation requires an Allow and <b>no explicit Deny<\/b>; boundaries, SCPs and resource policies can all block. Use the IAM policy simulator, CloudTrail and <code>sts decode-authorization-message<\/code> to diagnose.", "w": "(C) Within one account an identity policy alone is enough. (B) There is no minimum size for GetObject. (A) Role names are limited to 64 characters at creation, so such a role cannot exist."}, {"id": 650259981, "d": "ts", "t": "security", "q": "During heavy S3 uploads using SSE-KMS a service receives KMS `ThrottlingException`. What reduces the KMS request rate?", "o": ["Use S3 Transfer Acceleration, which batches the requests before they reach KMS", "Enable versioning on the bucket so KMS can reuse data keys between object versions", "Enable S3 Bucket Keys, and consider data key caching or a quota increase", "Switch the uploads to SSE-C, which lets KMS cache the customer-provided key between requests"], "a": 2, "e": "Each S3 SSE-KMS request calls KMS. <b>S3 Bucket Keys<\/b> create a bucket-level key so far fewer KMS calls are needed (up to 99% fewer).", "w": "(D) SSE-C does not use KMS at all and changes who manages the key. (B) Versioning does not reduce KMS calls. (A) Transfer Acceleration does not batch KMS calls."}, {"id": 1504338495, "d": "ts", "t": "rds", "q": "An application sends thousands of identical, rarely changing read queries per minute to an RDS database, which is under load. What is the best way to reduce load and latency?", "o": ["Increase the allocated storage, which raises the IOPS and lowers the query latency", "Add an ElastiCache layer with lazy loading and a TTL", "Increase the backup retention period, which keeps a warm copy for reads", "Enable Multi-AZ, which lets the standby answer the repeated read queries"], "a": 1, "e": "<b>Caching<\/b> (ElastiCache, lazy loading with TTL) serves repeated reads from memory. Multi-AZ is for availability, not read scaling.", "w": "(D) A classic Multi-AZ standby is not readable. (C) Backups are not used for reads. (A) Storage size can raise IOPS, but it does not remove the repeated queries."}, {"id": 1960545856, "d": "ts", "t": "messaging", "q": "Messages that were sent to an SQS queue are missing after several days although no consumer deleted them. What is the explanation?", "o": ["SQS deletes messages after 24 hours unless a dead-letter queue is attached", "SQS deletes messages when the visibility timeout has passed three times", "The default retention is 4 days, and it can be raised to 14 days", "SQS deletes messages that were not received within the delay period"], "a": 2, "e": "SQS keeps messages for <b>4 days by default<\/b> (1 minute to 14 days configurable). Expired messages are removed automatically.", "w": "(B) Visibility timeouts do not delete messages. (D) The delay period hides messages; it does not delete them. (A) The default retention is 4 days, and a DLQ does not change it."}, {"id": 2665215462, "d": "ts", "t": "messaging", "q": "A standard SQS queue consumer occasionally receives the same message twice. How should the application be designed?", "o": ["Reduce the message size below 64 KB so SQS does not split and duplicate the message", "Enable long polling, which prevents SQS from returning a message to two consumers", "Make processing idempotent or use FIFO with deduplication, because standard queues are at-least-once", "Shorten the visibility timeout so a duplicate is deleted before it is processed twice"], "a": 2, "e": "Standard queues are <b>at-least-once<\/b>; duplicates are possible. Design idempotent consumers, or use FIFO queues for deduplication within a 5-minute window.", "w": "(D) A shorter timeout makes duplicates more likely. (B) Long polling reduces empty responses; it does not prevent duplicates. (A) SQS does not split messages."}, {"id": 2898210572, "d": "ts", "t": "beanstalk", "q": "A rolling deployment in Elastic Beanstalk fails in the middle, leaving some instances on the old version and some on the new. Which deployment policy avoids this partial state and allows quick rollback?", "o": ["Immutable, which launches a new set of instances and swaps them in only when healthy", "All at once, which updates every instance together so no mixed versions occur", "Rolling, which updates batches and restores a failed batch automatically", "Rolling with additional batch, which adds capacity first and avoids mixed versions"], "a": 0, "e": "<b>Immutable<\/b> deployments create new instances in a separate Auto Scaling group; if they fail, they are terminated and the old fleet is untouched.", "w": "(D) Rolling with an additional batch keeps capacity but can still leave mixed versions. (C) Rolling can leave mixed versions, and a rollback means redeploying. (B) All at once causes downtime when the new version fails."}, {"id": 222112164, "d": "ts", "t": "ec2", "q": "An engineer cannot connect to an EC2 instance over SSH and the connection times out. What is the most likely cause?", "o": ["SSH runs on port 3389 on Linux instances, so the connection never reaches the SSH server", "The security group, network ACL or route does not allow inbound port 22 from the engineer's IP", "The key pair does not match the instance, which makes SSH time out", "The AMI uses an encrypted root volume, which blocks SSH connections"], "a": 1, "e": "A <b>timeout<\/b> points at network filtering (security group, NACL, routing, public IP). A wrong key gives <code>Permission denied (publickey)<\/code>; <b>Connection refused<\/b> means the instance answered but nothing listens.", "w": "(C) B wrong key gives a permission-denied error. (A) SSH uses port 22; 3389 is RDP for Windows. (D) Volume encryption does not affect network access."}, {"id": 2691575314, "d": "ts", "t": "cloudfront", "q": "After deploying a new version of `app.js` to an S3 origin, CloudFront still serves the old file for hours. What are good ways to fix and prevent this?", "o": ["Delete the object from S3 and upload it again, which clears every edge cache", "Invalidate the path now, and use versioned file names or shorter TTLs for future releases", "Change the cache policy to forward all headers, which forces CloudFront to revalidate every request", "Enable S3 Transfer Acceleration, which refreshes edge caches faster"], "a": 1, "e": "Edge caches honor the TTL. <b>Invalidate<\/b> the object to refresh immediately; <b>versioned object names<\/b> avoid invalidations entirely.", "w": "(A) Deleting the object in S3 does not purge edge caches. (D) Transfer Acceleration is unrelated to CloudFront caches. (C) Forwarding headers lowers the hit ratio but does not clear cached copies."}, {"id": 1140190290, "d": "ts", "t": "dynamodb", "q": "A Query on a DynamoDB table returns only part of the data and the response contains `LastEvaluatedKey`. What should the application do?", "o": ["Increase the table's RCUs, which removes the 1 MB limit on a response", "Call Query again with a larger `Limit`, which returns the remaining items in one page", "Call Query again with `LastEvaluatedKey` as `ExclusiveStartKey` until it is no longer returned", "Call Scan with the same key condition, which returns all remaining items without a page limit"], "a": 2, "e": "A response is limited to <b>1 MB<\/b>. A returned <code>LastEvaluatedKey<\/code> means more pages exist; paginate with <code>ExclusiveStartKey<\/code>.", "w": "(B) A page is capped at 1 MB regardless of Limit. (D) Scan is also paginated and is more expensive. (A) RCUs do not change the page limit."}, {"id": 614090713, "d": "ts", "t": "lambda", "q": "A Lambda function that processes SQS messages sometimes fails for one message in a batch of 10, and the whole batch is retried, causing the 9 good messages to be reprocessed. Which feature avoids this?", "o": ["Set the batch size to 1 so that each failure only affects one message", "Move the failed messages to the DLQ immediately from the function with the SQS API", "Increase the visibility timeout so that the good messages are not retried", "Return the failed message IDs with `ReportBatchItemFailures`, so only those messages are retried"], "a": 3, "e": "With <code>ReportBatchItemFailures<\/code> the function returns the IDs of failed messages; only those are retried, the rest are deleted.", "w": "(A) That works but loses batching efficiency; partial batch response keeps the batch. (C) Visibility timeout does not mark messages as handled. (B) The function should report failures; manual DLQ handling needs custom code."}, {"id": 1996796049, "d": "sec", "t": "iam-adv", "q": "Amazon S3 must be allowed to invoke a Lambda function when objects are uploaded. Which kind of policy grants this?", "o": ["A permissions boundary on the function's execution role that allows S3 to call it", "An identity-based policy on the bucket owner's IAM user that allows `lambda:InvokeFunction`", "A resource-based policy on the function that lets the S3 service invoke it", "A trust policy on the function's execution role that names `s3.amazonaws.com`"], "a": 2, "e": "AWS services invoke Lambda through the function's <b>resource-based policy<\/b> (added with <code>lambda add-permission<\/code> or automatically by the console/SAM). The execution role controls what the function can call, not who can invoke it.", "w": "(B) The caller is the S3 service, not a user. (A) Boundaries limit permissions; they do not grant access. (D) The execution role's trust policy lets Lambda assume the role; it does not let S3 invoke the function."}, {"id": 250624607, "d": "sec", "t": "iam-adv", "q": "A developer in Account A must read an S3 bucket in Account B. What is the recommended setup?", "o": ["Create a role in Account B that trusts Account A, and have the developer call `sts:AssumeRole`", "Attach an identity-based policy for Account B's bucket to the developer's user in Account A", "Create an IAM user in Account B for the developer and share its access keys over a secure channel", "Enable S3 Cross-Region Replication to copy the bucket into Account A"], "a": 0, "e": "<b>Cross-account roles<\/b>: the role in B trusts A, A's principal is allowed <code>sts:AssumeRole<\/code> on that role, and STS returns temporary credentials. No long-term secrets are shared.", "w": "(C) That means long-term keys that can leak. (B) Across accounts the bucket's own policy must allow Account A as well, so an identity policy alone is not enough. (D) Replication is unnecessary; roles give direct access."}, {"id": 3243700705, "d": "sec", "t": "iam-adv", "q": "An engineer creates a Lambda function through a deployment pipeline and passes an execution role to it. Which IAM permission must the pipeline's identity have for that role?", "o": ["`lambda:UpdateFunctionConfiguration` on the function, because it sets the role", "`iam:AttachRolePolicy` on the execution role, because Lambda attaches policies at creation", "`iam:PassRole` scoped to the execution role's ARN", "`sts:AssumeRole` on the execution role, because the pipeline assumes it while creating the function"], "a": 2, "e": "<b>iam:PassRole<\/b> controls who may hand a role to an AWS service. Scope it to the exact role ARN to prevent privilege escalation.", "w": "(B) Attaching policies is a different permission and is not needed to pass a role. (D) Lambda assumes the role at runtime; the pipeline does not. (A) That permission applies to updates and does not replace PassRole when setting a role."}, {"id": 2883092111, "d": "sec", "t": "iam-adv", "q": "A third-party vendor needs access to resources in your account through a cross-account role. How do you protect against the confused deputy problem?", "o": ["Limit the session duration of the role to 15 minutes", "Require MFA in the trust policy so that the vendor must sign in with a device", "Require an `ExternalId` condition in the role's trust policy", "Add the vendor's account ID to the role's permissions policy"], "a": 2, "e": "An <b>ExternalId<\/b> condition in the trust policy ensures the vendor can assume the role only on behalf of the correct customer.", "w": "(B) MFA does not distinguish between the vendor's customers. (D) The account ID belongs in the trust policy and does not solve the problem. (A) A short session does not prevent a confused deputy."}, {"id": 2524093895, "d": "sec", "t": "cli-sdk", "q": "A company requires MFA for CLI access to a sensitive account. How does a developer use the CLI with MFA?", "o": ["Call `aws sts get-session-token` with the MFA serial number and token code and use the temporary keys", "Enable MFA in the AWS CLI configuration file with `mfa_required=true` and keep the access keys", "Run `aws configure` with the virtual MFA device ARN as the secret access key", "Add the MFA token code to `AWS_ACCESS_KEY_ID` in the profile, so every request is signed with it"], "a": 0, "e": "MFA with the CLI uses <b>STS<\/b>: <code>GetSessionToken<\/code> or <code>AssumeRole<\/code> with <code>--serial-number<\/code> and <code>--token-code<\/code>, then use the temporary keys.", "w": "(D) MFA codes are not part of access keys. (B) There is no such setting; MFA needs STS credentials. (C) The device ARN is not a secret key."}, {"id": 2839518827, "d": "sec", "t": "iam-adv", "q": "Each user must only access the S3 prefix named after their own IAM user name, using one shared policy. Which feature enables this?", "o": ["A permissions boundary that is generated from each user's tags", "S3 Access Points, one per user, each with an access point policy", "IAM policy variables such as `${aws:username}` in the resource ARN", "An S3 bucket policy with a `NotPrincipal` element for each user's folder"], "a": 2, "e": "<b>Policy variables<\/b> like <code>arn:aws:s3:::bucket/${aws:username}/*<\/code> let one policy adapt to each caller. For Cognito users use <code>${cognito-identity.amazonaws.com:sub}<\/code>.", "w": "(D) That would need a statement per user. (B) Access points work but need one per user, so they do not give one shared policy. (A) Boundaries limit permissions; they do not grant them."}, {"id": 606531216, "d": "sec", "t": "iam-adv", "q": "A company wants to guarantee that no account in an organizational unit can use any region other than eu-west-1, even for administrators. Which feature enforces this?", "o": ["An IAM permissions boundary on every administrator user in each account", "AWS Config rules that delete resources created outside the region", "A CloudWatch alarm that stops resources created outside the region", "A service control policy that denies actions outside the allowed region"], "a": 3, "e": "<b>SCPs<\/b> set the maximum permissions for all principals in member accounts (not the management account). An explicit Deny with <code>aws:RequestedRegion<\/code> cannot be overridden by IAM policies inside the account.", "w": "(A) Boundaries must be attached to each principal and can be changed by administrators. (C) Alarms cannot stop resources by region. (B) Config detects or remediates after creation; it does not prevent it."}, {"id": 2213828064, "d": "sec", "t": "iam-adv", "q": "A team wants to tighten an overly broad IAM role based on what it actually used. Which tool can generate a least-privilege policy from CloudTrail activity?", "o": ["IAM credential reports, which list the actions each role used in the last 90 days", "IAM Access Analyzer policy generation based on CloudTrail activity", "AWS Trusted Advisor, which recommends policy changes from observed API usage", "AWS Config, which generates a minimal policy from the resource configuration history"], "a": 1, "e": "<b>IAM Access Analyzer<\/b> can generate a policy based on access activity found in CloudTrail, helping to reach least privilege. It also finds resources shared outside your account.", "w": "(C) Trusted Advisor checks cost, security settings and limits, not policy contents. (A) Credential reports list credential usage, not actions. (D) Config tracks resource configuration, not actions used."}, {"id": 1643973922, "d": "sec", "t": "security", "q": "A customer managed KMS key has automatic rotation enabled. What happens to data already encrypted with the key?", "o": ["The key ID changes, so applications must be updated and old data stays readable with the old ID", "Old ciphertext can only be decrypted by importing the old key material again", "KMS re-encrypts all existing data with the new key material within 24 hours", "Nothing: the key ID stays the same and KMS keeps old key material to decrypt old data"], "a": 3, "e": "Automatic rotation creates new <b>backing key material<\/b> while keeping the same key ID/ARN; old material is retained so existing ciphertext still decrypts.", "w": "(C) KMS does not re-encrypt your data. (A) The key ID and ARN stay the same. (B) KMS retains the old key material automatically."}, {"id": 1700643989, "d": "sec", "t": "security", "q": "An application must encrypt a 500 MB file with a KMS key. Which approach should be used?", "o": ["Use envelope encryption: get a data key, encrypt the file locally and store the encrypted key with it", "Call `kms:Encrypt` in a loop with 4 KB chunks and store each ciphertext in S3", "Upload the file to S3 with SSE-S3 and use the KMS key only for the bucket policy", "Use an asymmetric KMS key to encrypt the file in one `Encrypt` call"], "a": 0, "e": "KMS <code>Encrypt<\/code> handles at most 4 KB. For large data use <b>envelope encryption<\/b> (<code>GenerateDataKey<\/code>) - the AWS Encryption SDK implements it.", "w": "(B) It works but is slow and costly and runs into KMS quotas. (C) SSE-S3 does not use your KMS key. (D) Asymmetric keys also have small payload limits."}, {"id": 4285722489, "d": "sec", "t": "security", "q": "A KMS key policy contains only the default statement that gives the account root user full access. How can IAM policies grant a developer access to use the key?", "o": ["IAM policies cannot grant KMS access in the same account; only cross-account roles can", "Only a grant created by an administrator can give the developer access to the key", "The default statement enables IAM policies, so an IAM policy can allow `kms:Encrypt` and `kms:Decrypt`", "Key policies always override IAM, so only the key policy can grant access to the developer"], "a": 2, "e": "A key policy that allows the account root (<b>Enable IAM User Permissions<\/b>) delegates control to IAM policies in that account. Without it, only the key policy statements apply.", "w": "(D) The default statement delegates control to IAM. (B) Grants are one option, not the only one. (A) IAM policies work for same-account access when the key policy enables them."}, {"id": 2364796050, "d": "sec", "t": "security", "q": "An encrypted EBS snapshot must be copied to another region. What must the developer specify?", "o": ["An IAM user from the destination region that owns the original key", "A KMS key in the destination region, because keys are regional and the copy is re-encrypted", "Nothing, because snapshot copies keep the original key and can be used across regions", "The key ID from the source region, because KMS replicates keys to every region automatically"], "a": 1, "e": "<b>KMS keys are regional<\/b>. Cross-region copies of encrypted snapshots are re-encrypted with a key that exists in the destination region.", "w": "(D) Keys are regional; only multi-Region keys replicate. (C) The copy must be encrypted with a key available in the destination region. (A) Keys are not owned by IAM users."}, {"id": 132902152, "d": "sec", "t": "security", "q": "A temporary process needs to use a KMS key for a short time and the key policy should not be edited. Which KMS feature fits?", "o": ["Multi-Region keys, which let the process use a replica without changing the primary policy", "Grants (`CreateGrant`), which delegate limited permissions that can be revoked", "Key aliases, which give another principal temporary access under a different name", "Key rotation, which creates a short-lived copy of the key for the process"], "a": 1, "e": "<b>Grants<\/b> give a principal specific operations on a key programmatically and can be retired or revoked without changing the key policy (used by AWS services such as EBS).", "w": "(C) Aliases are names, not permissions. (D) Rotation changes key material and has nothing to do with delegation. (A) Replica keys have their own policies."}, {"id": 2489740216, "d": "sec", "t": "security", "q": "Security auditors want to know which principal used a KMS key to decrypt data and when. Where is this recorded?", "o": ["CloudTrail, which records KMS API calls such as `Decrypt` with the caller and time", "CloudWatch metrics for KMS, which record the principal behind each key use", "VPC Flow Logs, which record the principal that called the KMS endpoint", "S3 server access logs, which record the key used for each object"], "a": 0, "e": "Every KMS API call (Encrypt, Decrypt, GenerateDataKey) is logged in <b>CloudTrail<\/b>, which is a key reason to prefer customer managed keys for auditing.", "w": "(D) S3 logs show object requests, not KMS calls. (C) Flow logs show IP traffic, not principals. (B) Metrics are aggregated counts."}, {"id": 1785259664, "d": "sec", "t": "security", "q": "A database password must be rotated automatically every 30 days with minimal custom code for an RDS instance. Which service should store it?", "o": ["AWS KMS with automatic key rotation enabled on the key that encrypts the password", "AWS Secrets Manager with automatic rotation", "SSM Parameter Store SecureString with an automatic rotation schedule", "AWS AppConfig with a deployment strategy that publishes a new password every 30 days"], "a": 1, "e": "<b>Secrets Manager<\/b> has built-in rotation (rotation Lambda templates for RDS) and integrates with RDS. Parameter Store has no native rotation.", "w": "(C) Parameter Store has no automatic rotation. (A) KMS rotation does not change the database password. (D) AppConfig deploys configuration but does not change the database password."}, {"id": 2244228254, "d": "sec", "t": "security", "q": "An application needs hierarchical configuration for dev, test and prod (for example `/myapp/prod/db/url`) at no cost, including encrypted values. Which service fits best?", "o": ["DynamoDB with a path as the partition key and client-side encryption", "AppConfig, which stores hierarchical values and encrypts them with KMS", "SSM Parameter Store, using path hierarchies and SecureString parameters", "Secrets Manager, which offers free hierarchies and versioned encrypted values"], "a": 2, "e": "<b>Parameter Store<\/b> supports hierarchies (<code>GetParametersByPath<\/code>), versioning and SecureString (KMS) values in the free Standard tier.", "w": "(D) Secrets Manager charges per secret. (B) AppConfig is for configuration deployments and does not store values by path like this. (A) That can be built but is more work than the free built-in service."}, {"id": 4111895813, "d": "sec", "t": "security", "q": "A Lambda function reads an SSM SecureString parameter. Which permissions does its execution role need?", "o": ["`ssm:GetParametersByPath` on the root path and `iam:PassRole` for the KMS key", "`secretsmanager:GetSecretValue` on the parameter and `kms:Decrypt` on its KMS key", "`ssm:GetParameter` on the parameter and `kms:Decrypt` on its KMS key", "`ssm:GetParameter` on the parameter and `kms:GenerateDataKey` on its KMS key"], "a": 2, "e": "Reading a <b>SecureString<\/b> requires access to the parameter and permission to decrypt with the KMS key (when a customer managed key is used).", "w": "(D) GenerateDataKey is used for writing, not reading. (A) PassRole does not apply to KMS keys. (B) Parameter Store is not Secrets Manager."}, {"id": 527267422, "d": "sec", "t": "cfn", "q": "A CloudFormation template creates an RDS instance and must not contain the master password in plain text. What is the best practice?", "o": ["Use a dynamic reference to a Secrets Manager secret, or let RDS manage the master password", "Encode the password with `Fn::Base64` in the template and decode it in the user data", "Store the password in the template's `Metadata` section, which CloudFormation encrypts", "Use a parameter with `NoEcho: true` and pass the password in plain text at deployment"], "a": 0, "e": "<b>Dynamic references<\/b> resolve secrets at deployment time without storing them in the template. Base64 is not encryption.", "w": "(D) NoEcho only masks the value in the console; it is still handled in plain text. (B) Base64 is not encryption. (C) Metadata is stored in plain text."}, {"id": 185604907, "d": "sec", "t": "cognito", "q": "A mobile app must let signed-in users upload photos directly to S3 using temporary AWS credentials. Which Cognito feature provides the credentials?", "o": ["A Cognito User Pool, which returns temporary AWS credentials after sign-in", "A Cognito app client secret, which the app uses to sign S3 requests", "Cognito Sync, which stores the user's AWS credentials and syncs them between devices", "A Cognito Identity Pool, which exchanges the user's token for temporary credentials of an IAM role"], "a": 3, "e": "<b>Identity Pools<\/b> return temporary AWS credentials (via STS) mapped to an IAM role. User Pools authenticate and issue JWTs only.", "w": "(A) User pools return JWTs, not AWS credentials. (C) Cognito Sync synchronizes app data. (B) The app client secret is not an AWS credential."}, {"id": 3701886871, "d": "sec", "t": "cognito", "q": "An API Gateway REST API must only accept calls from users who signed in with a Cognito User Pool. How is it configured?", "o": ["Require an API key on the methods and give a key to every signed-in user", "Add a resource policy that lists the e-mail addresses of the signed-in users", "Use an IAM authorizer and give each user pool user an IAM user", "Add a Cognito User Pool authorizer to the methods and send the token in the Authorization header"], "a": 3, "e": "A <b>Cognito authorizer<\/b> validates the JWT issued by the user pool before the request reaches the integration. API keys are for usage tracking, not authentication.", "w": "(A) API keys identify clients; they do not authenticate users. (B) Resource policies cannot evaluate user pool identities that way. (C) IAM authorization needs SigV4 with IAM credentials, not user pool sign-in."}, {"id": 4053208762, "d": "sec", "t": "cognito", "q": "Before Cognito issues tokens the application needs to add custom claims to the ID token. How?", "o": ["Use a Custom Message trigger that appends claims to the token", "Use a Pre Token Generation Lambda trigger of the user pool", "Use a Post Authentication trigger, which can modify the tokens after they are issued", "Use an identity pool role mapping rule that adds claims to the ID token"], "a": 1, "e": "<b>Pre token generation<\/b> is a Lambda trigger that can add, override or suppress claims before the token is issued. Other triggers: pre sign-up, post confirmation, custom auth.", "w": "(C) Post Authentication runs after sign-in and cannot change the issued token. (D) Role mapping affects IAM roles, not token claims. (A) Custom Message changes emails and SMS texts."}, {"id": 1493409517, "d": "sec", "t": "cognito", "q": "Customers want to sign in with their Google accounts but still be managed in your user directory. What do you configure?", "o": ["Connect AWS Directory Service to Google as an external directory", "Add a Route 53 record that redirects sign-ins to Google's login page", "Configure Google as a federated identity provider in the user pool", "Create an IAM user for each Google account that signs in"], "a": 2, "e": "User pools support <b>federation<\/b> with social providers (Google, Facebook, Apple, Amazon) and SAML/OIDC providers; users are created in the pool and receive standard Cognito tokens.", "w": "(D) IAM users are not for app customers. (A) Directory Service connects to Active Directory, not to Google. (B) DNS records cannot perform authentication."}, {"id": 4247702945, "d": "sec", "t": "cognito", "q": "An app allows anonymous visitors to read public data stored in AWS but with very limited permissions. Which Cognito option supports this?", "o": ["A user pool group named guests with an IAM role that has restricted permissions", "An identity pool with an unauthenticated role that has restricted permissions", "An API Gateway usage plan that issues limited AWS credentials to anonymous callers", "Cognito Sync with a public dataset that anonymous visitors can read"], "a": 1, "e": "Identity Pools can enable <b>unauthenticated identities<\/b> which assume a separate, tightly scoped IAM role.", "w": "(A) Users in a group must sign in; guests are anonymous. (C) Usage plans meter API calls and do not issue AWS credentials. (D) Cognito Sync is not an access control mechanism."}, {"id": 1508997875, "d": "sec", "t": "apigw", "q": "An API must be callable only by clients that sign requests with IAM credentials (for example another AWS service). Which authorization type is used?", "o": ["A Cognito User Pool authorizer with a service account that signs in for the client", "AWS_IAM authorization with Signature Version 4 signing", "A Lambda authorizer that validates an API key sent in the Authorization header", "API keys with a usage plan that restricts the callers to known keys"], "a": 1, "e": "<b>AWS_IAM<\/b> authorization requires SigV4-signed requests and an IAM policy allowing <code>execute-api:Invoke<\/code> on the API.", "w": "(A) Cognito authorizers validate user tokens. (C) That works only with custom logic and does not use IAM credentials. (D) API keys are not authentication."}, {"id": 1239467274, "d": "sec", "t": "apigw", "q": "A company validates bearer tokens issued by a third-party identity provider and needs custom logic to decide access. Which API Gateway feature fits?", "o": ["A Cognito User Pool authorizer that is configured with the third party's issuer URL", "A Lambda authorizer that returns an IAM policy, with a cached result", "An IAM authorizer that signs requests with the identity provider's tokens", "A usage plan with an API key per token that is issued by the identity provider"], "a": 1, "e": "A <b>Lambda authorizer<\/b> runs custom auth logic and returns an IAM policy. Results can be cached for the configured TTL to reduce latency.", "w": "(A) A Cognito authorizer validates user pool tokens and cannot run custom logic. (C) IAM authorizers use SigV4, not provider tokens. (D) API keys do not carry token validation."}, {"id": 483862468, "d": "sec", "t": "s3", "q": "A bucket policy must make sure every uploaded object is encrypted with SSE-KMS. How can this be enforced?", "o": ["Enable S3 Versioning, which re-encrypts new versions with the bucket key", "Deny `s3:GetObject` when the object is not encrypted with SSE-KMS", "Deny `s3:PutObject` when the `x-amz-server-side-encryption` header is not `aws:kms`", "Allow `s3:PutObject` only when the object key ends in `.kms`"], "a": 2, "e": "A bucket policy with an explicit <b>Deny<\/b> and a condition on the <code>x-amz-server-side-encryption<\/code> header enforces encryption. Default bucket encryption also encrypts objects that arrive without a header.", "w": "(D) Key names do not control encryption. (B) That blocks reads, not uploads. (A) Versioning does not change encryption."}, {"id": 1358784301, "d": "sec", "t": "s3", "q": "A customer needs temporary access to download one private object for the next hour. What is the simplest secure approach?", "o": ["Create a bucket policy that allows the customer's IP address for one hour", "Copy the object to a public bucket and delete it after an hour", "Create an IAM user for the customer and delete it after an hour", "Generate a pre-signed URL that expires in one hour"], "a": 3, "e": "A <b>pre-signed URL<\/b> carries the signer's permissions for one object for a limited time.", "w": "(A) IP addresses change and the policy would need editing. (C) Creating and deleting users is heavy and can leave credentials behind. (B) A public bucket exposes the object to everyone."}, {"id": 1732048603, "d": "sec", "t": "s3", "q": "Which S3 features protect object versions from being deleted accidentally or maliciously? (choose the best answer)", "o": ["MFA Delete on a versioned bucket, and S3 Object Lock", "S3 Replication, which blocks deletes in the source bucket until the copy is verified", "S3 Versioning alone, because a version cannot be deleted by anyone", "S3 Intelligent-Tiering, which keeps deleted versions in the Archive Access tier"], "a": 0, "e": "<b>MFA Delete<\/b> requires MFA to permanently delete versions or change versioning; <b>Object Lock<\/b> (WORM) prevents deletion for a retention period.", "w": "(C) Versions can be deleted unless MFA Delete or Object Lock applies. (D) Tiering is a cost feature. (B) Replication copies objects; it does not block deletes."}, {"id": 2914961641, "d": "sec", "t": "s3", "q": "A company wants to keep full control of encryption keys and send the key with every request, with AWS never storing the key. Which S3 option is this?", "o": ["SSE-KMS, where you send a data key with each request and KMS does not store it", "Client-side encryption, where S3 receives the key and discards it after the upload", "SSE-S3, where you send the AES key with each request and S3 stores it encrypted", "SSE-C, where you send the key with each request over HTTPS and S3 does not store it"], "a": 3, "e": "With <b>SSE-C<\/b> the client provides the key per request (over HTTPS); S3 uses it to encrypt/decrypt and discards it.", "w": "(A) KMS manages the keys; you do not send them. (C) SSE-S3 keys are managed by S3. (B) With client-side encryption, S3 never receives the key."}, {"id": 2003822475, "d": "sec", "t": "cloudfront", "q": "A video platform must let only paying subscribers watch videos served by CloudFront and wants access that expires. Which feature is used?", "o": ["CloudFront signed URLs or signed cookies created with a key group", "Geo restriction with an allow list of subscriber countries", "S3 pre-signed URLs with the distribution as the origin", "A CloudFront cache policy that includes the subscriber ID in the cache key"], "a": 0, "e": "<b>CloudFront signed URLs/cookies<\/b> restrict viewer access with expiration (and optionally IP). Signed cookies suit many files such as an entire course.", "w": "(C) Pre-signed URLs are validated by S3 and can leak through caches. (D) Cache keys do not authenticate. (B) Geo restriction cannot tell subscribers from other users."}, {"id": 3469633822, "d": "sec", "t": "vpc", "q": "An RDS database in a private subnet must accept connections only from the application servers. What is the most maintainable security group rule?", "o": ["Allow the DB port from the subnet CIDR of the application servers", "Allow the DB port from the application servers' security group", "Allow the DB port from the public IP addresses of the application servers", "Allow the DB port from the VPC CIDR and block other traffic with a NACL"], "a": 1, "e": "Referencing the <b>application security group<\/b> as the source keeps the rule correct as instances scale and change IPs.", "w": "(A) A CIDR also admits other resources in the subnet. (C) Public IPs change, and traffic inside the VPC uses private addresses. (D) NACLs are stateless and harder to maintain than a security group reference."}, {"id": 2957311076, "d": "sec", "t": "other", "q": "A public ALB needs protection against SQL injection and cross-site scripting. Which service should be attached?", "o": ["AWS Shield Advanced with its automatic application layer mitigation only", "AWS WAF with managed rule groups", "Network ACLs with deny rules for known attack patterns", "Amazon GuardDuty with an automatic block list"], "a": 1, "e": "<b>AWS WAF<\/b> inspects HTTP requests at layer 7 and can block SQLi/XSS patterns and rate-limit. Shield protects against DDoS; security groups work at layers 3-4.", "w": "(A) Shield Advanced works with WAF for layer 7 rules, but the SQL injection and XSS rules come from WAF. (C) NACLs inspect IPs and ports, not request content. (D) GuardDuty detects threats but does not filter requests."}, {"id": 4098658407, "d": "sec", "t": "other", "q": "A company wants free, automatically renewing TLS certificates for an Application Load Balancer. Which service issues them?", "o": ["AWS KMS, which creates and renews TLS certificates", "AWS Secrets Manager, which issues and rotates TLS certificates", "AWS Certificate Manager (ACM)", "AWS Private CA, which issues free public certificates"], "a": 2, "e": "<b>ACM<\/b> provisions and renews public certificates for ELB, CloudFront and API Gateway. For CloudFront the certificate must be in us-east-1.", "w": "(D) Private CA issues private certificates and charges for the CA. (A) KMS manages encryption keys. (B) Secrets Manager stores secrets; it does not issue certificates."}, {"id": 2907728365, "d": "sec", "t": "s3", "q": "A security policy requires all access to a bucket to use TLS. Which bucket policy condition enforces this?", "o": ["Deny when `aws:CalledVia` is empty", "Deny when `s3:TlsPolicy` is not `required`", "Deny when `aws:ViaAWSService` is `false`", "Deny when `aws:SecureTransport` is `false`"], "a": 3, "e": "A <b>Deny<\/b> with <code>\"Bool\": {\"aws:SecureTransport\": \"false\"}<\/code> blocks any request that is not HTTPS.", "w": "(B) There is no s3:TlsPolicy condition key. (C) ViaAWSService tells whether a service called on your behalf. (A) CalledVia lists the services in a chain of calls. Only aws:SecureTransport checks for HTTPS."}, {"id": 113080201, "d": "sec", "t": "lambda", "q": "A Lambda function needs a third-party API key. Which option follows best practice?", "o": ["Store the key in Secrets Manager or a SecureString parameter and fetch it at runtime with a scoped role", "Store the key in the function's tags and restrict who can read the tags with IAM", "Store the key in a private S3 object that the function reads on every invocation", "Store the key in a Lambda environment variable that is encrypted with the default key"], "a": 0, "e": "Never hard-code secrets. Use <b>Secrets Manager / Parameter Store<\/b>, fetched at init and cached across invocations; environment variables can be encrypted with KMS but have no rotation.", "w": "(D) Anyone who can read the function configuration can read the variable, and there is no rotation. (B) Tags are not meant for secrets and appear in many tools. (C) S3 objects lack the rotation and audit features of Secrets Manager."}, {"id": 1206947500, "d": "sec", "t": "dynamodb", "q": "Mobile users authenticated through Cognito should only read and write DynamoDB items whose partition key equals their own identity ID. Which IAM condition key enables this?", "o": ["`dynamodb:ReturnValues` compared with the identity ID policy variable", "`dynamodb:Attributes` compared with the identity ID policy variable", "`dynamodb:Select` compared with the identity ID policy variable", "`dynamodb:LeadingKeys` compared with the identity ID policy variable"], "a": 3, "e": "<b>Fine-grained access control<\/b>: the condition key <code>dynamodb:LeadingKeys<\/code> restricts access to items by partition key value, matched with the identity policy variable.", "w": "(B) Attributes restricts which attributes can be accessed, not which items. (A) ReturnValues restricts what the response returns. (C) Select restricts the Select parameter of Query and Scan."}, {"id": 856524303, "d": "sec", "t": "monitoring", "q": "A security team wants tamper-evident audit logs of all API activity across all regions. What should be configured?", "o": ["VPC Flow Logs in every region delivered to a protected S3 bucket", "A CloudTrail trail for one region with CloudWatch Logs as the only destination", "A multi-region CloudTrail trail to a protected S3 bucket with log file validation enabled", "AWS Config with an aggregator, which records every API call across regions"], "a": 2, "e": "<b>CloudTrail<\/b> records API calls; a multi-region trail covers all regions, and <b>log file validation<\/b> detects tampering. Protect the bucket (and consider an organization trail).", "w": "(B) A single-region trail misses other regions and has no integrity validation. (D) Config records configuration changes, not API calls. (A) Flow logs record network traffic, not API activity."}, {"id": 1896688286, "d": "sec", "t": "rds", "q": "How can an application authenticate to an RDS MySQL database without storing a password?", "o": ["A KMS key that signs each database connection with a token valid for one day", "IAM database authentication with a 15-minute token generated through the AWS SDK", "A Secrets Manager secret that is read once at deployment and stored in a config file", "A security group rule that identifies the application and replaces the database login"], "a": 1, "e": "<b>IAM DB authentication<\/b> (MySQL, PostgreSQL) lets IAM credentials generate an authentication token valid for 15 minutes, used instead of a password.", "w": "(C) That still stores a password. (D) Security groups filter network traffic; they do not authenticate users. (A) Tokens from IAM authentication are valid for 15 minutes and are not signed with a KMS key."}, {"id": 2591594655, "d": "sec", "t": "ecs", "q": "An ECS task must receive a database password as an environment variable without storing it in the task definition in plain text. What should be used?", "o": ["Reference the secret in `environment` of the task definition and let the task role read it", "Reference a Secrets Manager secret or parameter in `secrets` of the task definition, and let the execution role read it", "Pass the secret through the service's load balancer listener as a custom header", "Store the secret in the container image and restrict the repository with an IAM policy"], "a": 1, "e": "The task definition <code>secrets<\/code> block injects values from <b>Secrets Manager<\/b> or <b>Parameter Store<\/b> at launch; the <b>execution role<\/b> fetches them.", "w": "(A) Values in `environment` are stored in plain text; secrets are injected from `secrets` using the execution role. (D) Secrets in images can leak and cannot rotate. (C) Load balancer headers are not a secrets channel."}, {"id": 1246868960, "d": "dev", "t": "lambda", "q": "A Lambda function is invoked asynchronously (for example by S3) and fails. What is the default retry behavior?", "o": ["Lambda retries until the event is older than 14 days, as SQS does", "Lambda retries once after one minute, then discards the event without any record", "Lambda retries every minute for 24 hours before sending the event to a DLQ", "Lambda retries twice more (3 attempts), then sends the event to a DLQ or on-failure destination"], "a": 3, "e": "<b>Asynchronous<\/b> invocations are retried <b>2 times<\/b> by Lambda (with delays). Afterwards the event goes to a DLQ (SQS/SNS) or an on-failure destination if configured.", "w": "(B) The default is two retries, and failed events can go to a DLQ or destination. (C) The retry period is limited to at most six hours of event age. (A) SQS retention is unrelated to asynchronous retries."}, {"id": 2632734585, "d": "dev", "t": "lambda", "q": "Where should a Lambda function create its SDK clients and database connections to benefit from execution environment reuse?", "o": ["Outside the handler, in the initialization code, so warm invocations reuse them", "Inside the handler, so each invocation gets a fresh and safe connection", "In a Lambda layer, which keeps the connections open between invocations", "In the /tmp directory, which persists connections across all execution environments"], "a": 0, "e": "Code outside the handler runs once per execution environment (cold start) and is reused by later warm invocations - the best place for <b>SDK clients, DB connections and loaded config<\/b>.", "w": "(B) Creating them on every invocation wastes time. (C) Layers hold code; they do not keep connections. (D) /tmp is private to one execution environment and cannot hold live connections."}, {"id": 3422386823, "d": "dev", "t": "lambda", "q": "An SQS-triggered Lambda function scales out quickly and overloads a downstream relational database. How can the developer limit the pressure?", "o": ["Set maximum concurrency on the event source mapping (or reserved concurrency) and consider RDS Proxy", "Set the queue's visibility timeout to zero so messages are processed one at a time", "Convert the standard queue to FIFO so that Lambda cannot scale beyond one concurrent execution", "Increase the SQS batch window so the function runs less often and uses fewer connections"], "a": 0, "e": "Lambda scales pollers with queue depth. Capping <b>maximum concurrency<\/b> on the mapping or <b>reserved concurrency<\/b> on the function limits parallel invocations; <b>RDS Proxy<\/b> pools connections.", "w": "(D) A longer window delays but does not cap parallelism. (B) A zero timeout makes messages immediately visible again and causes duplicates. (C) FIFO queues scale per message group, so concurrency can still be high."}, {"id": 2899332964, "d": "dev", "t": "lambda", "q": "A function has dependencies larger than the 250 MB unzipped limit of zip packages. Which packaging option supports up to 10 GB?", "o": ["Package the function as a container image in Amazon ECR", "Add more than 5 layers by requesting a quota increase", "Upload the zip package to S3, which allows up to 10 GB for deployments", "Store the dependencies in EFS and mount it in the function"], "a": 0, "e": "<b>Container image<\/b> deployment supports images up to <b>10 GB<\/b>. Zip packages are limited (50 MB zipped direct upload, 250 MB unzipped including layers) and only 5 layers are allowed.", "w": "(B) The limit of 5 layers cannot be increased, and layers count toward 250 MB. (D) EFS holds files at runtime; it is not a deployment package option (and it needs a VPC). (C) Zip deployments are still limited to 250 MB unzipped."}, {"id": 142497598, "d": "dev", "t": "lambda", "q": "A function needs about 5 GB of temporary disk space while processing a file. What can be configured?", "o": ["Attach an EBS volume to the function with 5 GB of capacity", "Raise the memory to 10 GB, which also raises the /tmp size to 10 GB", "Increase the ephemeral storage setting, which allows up to 10 GB", "Store the data in a layer, which provides writable scratch space"], "a": 2, "e": "Lambda <b>ephemeral storage (/tmp)<\/b> is configurable from 512 MB up to 10,240 MB. For shared persistent storage mount EFS.", "w": "(A) Lambda has no EBS attachments. (D) Layers are read-only. (B) The /tmp size is configured separately from memory."}, {"id": 89723826, "d": "dev", "t": "lambda", "q": "An API needs consistently low latency with no cold starts during business hours. Which Lambda setting helps?", "o": ["Provisioned concurrency, optionally scheduled with Application Auto Scaling", "SnapStart, which keeps a number of environments running during business hours", "A higher memory setting, which removes the initialization time of the runtime", "Reserved concurrency, which keeps a number of environments initialized at all times"], "a": 0, "e": "<b>Provisioned concurrency<\/b> keeps execution environments initialized. <b>Reserved concurrency<\/b> only guarantees/limits capacity, it does not pre-warm anything.", "w": "(D) Reserved concurrency guarantees capacity but does not pre-warm it. (B) SnapStart shortens cold starts but does not keep environments running. (C) More memory speeds up initialization but does not remove cold starts."}, {"id": 3739110592, "d": "dev", "t": "lambda", "q": "A CloudFront distribution must add a security header to every viewer response at very high request volume at the lowest cost and latency. Which option fits best?", "o": ["Lambda@Edge on origin response events", "A Lambda function behind the origin that adds the header", "CloudFront Functions on viewer response events", "A WAF rule that appends the header to every response"], "a": 2, "e": "<b>CloudFront Functions<\/b> are for short, simple viewer-side logic (header manipulation, redirects, URL rewrites) with sub-millisecond execution and the lowest cost. Lambda@Edge is for heavier logic and origin events.", "w": "(A) Lambda@Edge works but costs more and adds latency. (B) That adds latency and cost for every origin request. (D) WAF cannot modify the responses of allowed requests."}, {"id": 2226879583, "d": "dev", "t": "lambda", "q": "A function behind an Application Load Balancer target group must be updated gradually: 10% of the traffic to the new version first. Which Lambda feature supports weighted routing?", "o": ["A version-specific function URL that the load balancer weights by percentage", "An alias routing configuration that splits traffic between two versions by weight", "A provisioned concurrency configuration that sends 10% of requests to the new version", "A Lambda layer that routes requests to the new code for 10% of invocations"], "a": 1, "e": "A Lambda <b>alias<\/b> can send a weighted share of traffic to a second version, enabling canary releases (CodeDeploy automates the shifting and rollback).", "w": "(A) Function URLs are not weighted by the load balancer. (D) Layers are shared code and do not route traffic. (C) Provisioned concurrency does not route traffic."}, {"id": 984046480, "d": "dev", "t": "dynamodb", "q": "An application strongly-consistently reads 10 items per second, each 6 KB in size. How many RCUs are required?", "o": ["15 RCUs", "20 RCUs", "10 RCUs", "60 RCUs"], "a": 1, "e": "1 RCU = one strongly consistent read of up to <b>4 KB<\/b> per second. A 6 KB item needs <b>2<\/b> RCUs (rounded up to 8 KB), so 10 reads/s x 2 = <b>20 RCUs<\/b>. Eventually consistent reads would need 10.", "w": ""}, {"id": 813134978, "d": "dev", "t": "dynamodb", "q": "An application writes 5 items per second, each 2.5 KB in size. How many WCUs are required?", "o": ["15 WCUs", "13 WCUs", "5 WCUs", "10 WCUs"], "a": 0, "e": "1 WCU = one write of up to <b>1 KB<\/b> per second. 2.5 KB rounds up to 3 KB = <b>3<\/b> WCUs per write; 5 x 3 = <b>15 WCUs<\/b>.", "w": ""}, {"id": 3476636605, "d": "dev", "t": "dynamodb", "q": "An application performs 10 transactional writes per second with 3 KB items. How many WCUs are needed?", "o": ["60 WCUs", "10 WCUs", "30 WCUs", "20 WCUs"], "a": 0, "e": "A transactional write costs <b>2x<\/b>: 3 KB = 3 WCUs, times 2 = 6 per write, times 10 per second = <b>60 WCUs<\/b>. Transactional reads also cost 2x.", "w": ""}, {"id": 1831191937, "d": "dev", "t": "dynamodb", "q": "A table is keyed by `userId`, but the application frequently needs to find users by `email`. What is the best solution?", "o": ["Create a local secondary index with `email` as the sort key after the table exists", "Create a global secondary index with `email` as the partition key", "Run a Scan with a filter on `email` and cache the result in DAX", "Add `email` as a second sort key of the table's primary key"], "a": 1, "e": "A <b>GSI<\/b> supports a different partition key and can be added at any time. <b>Scan<\/b> reads the whole table and is expensive; an LSI must share the table's partition key and be created with the table.", "w": "(A) LSIs must be created with the table and share the partition key. (D) A primary key cannot be changed after creation. (C) Scans read the whole table; caching hides the cost but not the inefficiency."}, {"id": 3582341467, "d": "dev", "t": "dyna
