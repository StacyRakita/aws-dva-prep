modb", "q": "How can a page-view counter be incremented safely when many clients update it at the same time, without reading it first?", "o": ["Use a transaction that reads the counter and writes the new value in the same call", "Read the item with a strongly consistent read, add one and write it back with PutItem", "Use UpdateItem with `SET views = views + :inc`", "Use BatchWriteItem to write the incremented counter from every client"], "a": 2, "e": "<b>UpdateItem<\/b> with an arithmetic update expression applies the change atomically on the server, avoiding read-modify-write races.", "w": "(B) Concurrent clients can overwrite each other's updates. (A) Transactions can work but cost double and still need a read first. (D) BatchWriteItem replaces items and has no arithmetic."}, {"id": 1920380535, "d": "dev", "t": "dynamodb", "q": "A PutItem must succeed only if no item with the same primary key exists yet. What should be used?", "o": ["A ConditionExpression such as `attribute_not_exists(pk)`", "A FilterExpression such as `attribute_not_exists(pk)`", "A ReturnValues setting of `ALL_OLD` that rejects the write if an old item is returned", "A KeyConditionExpression such as `pk <> :id`"], "a": 0, "e": "<b>Conditional writes<\/b> use <code>ConditionExpression<\/code>. If the condition fails, DynamoDB returns <code>ConditionalCheckFailedException<\/code>.", "w": "(B) Filter expressions apply to reads. (D) Key conditions apply to Query. (C) ReturnValues only changes what the response returns."}, {"id": 2260016177, "d": "dev", "t": "dynamodb", "q": "A developer uses FilterExpression in a Query to return only a few attributes of matching rows and expects lower read costs. What actually happens?", "o": ["The filter runs after the read, so the full items still consume read capacity", "The filter turns the Query into a Scan, which consumes capacity for the whole table", "The filter reduces consumed capacity only when the table uses on-demand mode", "The filter runs before the read, so only matching items consume read capacity"], "a": 0, "e": "<b>FilterExpression<\/b> and <b>ProjectionExpression<\/b> reduce what is returned, but RCUs are consumed for everything that was <b>read<\/b> (up to the 1 MB page).", "w": "(D) Filters are applied after items are read. (B) The Query stays a Query. (C) Capacity is consumed by what is read in both modes."}, {"id": 819886732, "d": "dev", "t": "dynamodb", "q": "Which index type supports strongly consistent reads?", "o": ["Neither, because strongly consistent reads work only on the base table's primary key", "A global secondary index (GSI)", "A global secondary index, when the table uses provisioned capacity", "A local secondary index (LSI)"], "a": 3, "e": "<b>LSIs<\/b> can return strongly consistent reads; <b>GSIs<\/b> are eventually consistent only.", "w": "(B) GSIs are always eventually consistent. (C) The capacity mode does not matter. (A) LSIs support strongly consistent reads."}, {"id": 3173546679, "d": "dev", "t": "dynamodb", "q": "Every change to items in a DynamoDB table must trigger a Lambda function that sends notifications, including the new item state. What is needed?", "o": ["Create a global secondary index on the changed attributes and poll it with Lambda", "Enable point-in-time recovery and restore a new table every minute for the function to read", "Enable TTL on the table so that changed items trigger the function when they expire", "Enable DynamoDB Streams with a new-image view and map the stream to a Lambda function"], "a": 3, "e": "<b>DynamoDB Streams<\/b> deliver an ordered stream of item changes (24-hour retention) that Lambda consumes through an event source mapping.", "w": "(C) TTL events cover expirations, not every change. (A) Indexes are for queries and do not report changes. (B) That is slow, costly and not event driven."}, {"id": 3841024668, "d": "dev", "t": "dynamodb", "q": "Session items in DynamoDB must disappear automatically one hour after creation without consuming write capacity. What should be used?", "o": ["A global secondary index on the timestamp with a lifecycle rule", "TTL on an attribute that holds the expiry time as epoch seconds", "A scheduled Lambda function that runs DeleteItem for expired sessions", "DynamoDB Streams with a filter that deletes items after one hour"], "a": 1, "e": "<b>TTL<\/b> deletes expired items in the background for free (typically within a couple of days after expiry; expired items can be filtered in reads).", "w": "(C) That works but consumes write capacity and needs code. (A) Indexes have no lifecycle rules. (D) Streams report changes; they cannot delete items."}, {"id": 3703960012, "d": "dev", "t": "dynamodb", "q": "An application needs users in several regions to read and write the same data with local latency. Which feature fits?", "o": ["Cross-region replication of the underlying S3 bucket", "DynamoDB Global Tables", "DynamoDB Accelerator in each region", "A global secondary index replicated to each region"], "a": 1, "e": "<b>Global Tables<\/b> provide multi-region, multi-active replication.", "w": "(C) DAX is a regional cache. (D) Indexes are not replicated across regions. (A) DynamoDB does not store tables in a bucket you can replicate."}, {"id": 2245010441, "d": "dev", "t": "dynamodb", "q": "Two items in different tables must be updated together: both succeed or both fail. Which API provides this?", "o": ["TransactWriteItems", "Two PutItem calls wrapped in a try block that retries on failure", "BatchWriteItem", "UpdateItem with a ConditionExpression on both tables"], "a": 0, "e": "<b>TransactWriteItems<\/b> provides ACID, all-or-nothing writes (up to 100 items, 4 MB). <b>BatchWriteItem<\/b> is not atomic.", "w": "(C) Batch writes are not atomic. (D) UpdateItem touches one item in one table. (B) Retrying can leave the second item missing if the retry also fails."}, {"id": 1142743993, "d": "dev", "t": "apigw", "q": "The same REST API must call the `dev` Lambda alias in the dev stage and the `prod` alias in the prod stage without separate APIs. What should be used?", "o": ["API keys that select the alias according to the caller", "Resource policies that route each stage to the matching alias", "Stage variables referenced in the Lambda integration, such as `${stageVariables.alias}`", "Usage plans that map each stage to a Lambda alias"], "a": 2, "e": "<b>Stage variables<\/b> act like environment variables for a stage and can be used in integration URIs and Lambda function names/aliases.", "w": "(D) Usage plans manage quotas and throttles. (A) API keys do not select integrations. (B) Resource policies control who can call the API."}, {"id": 3689833899, "d": "dev", "t": "apigw", "q": "A team wants to send 10% of the traffic of the prod stage to a new deployment and the rest to the current one. Which API Gateway feature is used?", "o": ["Canary release settings on the stage", "A usage plan with a quota of 10% of the daily requests", "An edge-optimized endpoint that routes 10% of requests through a second distribution", "A stage variable that selects the new version for 10% of the clients"], "a": 0, "e": "<b>Canary deployments<\/b> on a stage route a configurable percentage to the new deployment; you can promote it or roll back.", "w": "(B) Quotas limit consumption, not routing. (D) Stage variables are static per stage. (C) Endpoint types do not split traffic."}, {"id": 1920005074, "d": "dev", "t": "apigw", "q": "A developer must transform an incoming JSON request into a different structure for a backend without writing code. Which integration approach supports this?", "o": ["A non-proxy integration with a mapping template in Velocity Template Language", "A Lambda proxy integration with a request transformation setting", "A request validator with a model that renames the fields", "An HTTP API route with a built-in JSON transform"], "a": 0, "e": "<b>Mapping templates (VTL)<\/b> in REST API non-proxy integrations transform requests and responses. Proxy integrations pass requests through unchanged.", "w": "(B) Proxy integrations pass requests through unchanged. (D) HTTP APIs offer limited parameter mapping, not VTL transforms. (C) Validators check a request against a model; they do not rewrite it."}, {"id": 313154167, "d": "dev", "t": "apigw", "q": "Different customers must have different request quotas and rate limits on the same API. What should be configured?", "o": ["Resource policies with request limits for each customer account", "Cognito groups with different throttle limits per group", "Stage variables with a quota value for each customer", "Usage plans with API keys assigned to each customer"], "a": 3, "e": "<b>Usage plans<\/b> define throttling and quotas, and <b>API keys<\/b> identify customers. Keys are for metering, not for authentication.", "w": "(C) Stage variables are configuration values and do not enforce limits. (B) Groups do not set API Gateway throttles. (A) Resource policies control access, not request rates."}, {"id": 4196749618, "d": "dev", "t": "apigw", "q": "A simple, low-cost public API only needs Lambda integration and JWT authorization, with no request validation or API keys. Which API type is the best fit?", "o": ["An HTTP API", "A REST API with caching enabled", "A WebSocket API with a Lambda route", "A private REST API behind an interface endpoint"], "a": 0, "e": "<b>HTTP APIs<\/b> are cheaper and faster with built-in JWT authorizers and simple Lambda/HTTP integrations. REST APIs add features like usage plans, validation and caching.", "w": "(B) REST APIs cost more and offer features that are not needed. (C) WebSocket APIs are for two-way communication. (D) Private APIs are only reachable from a VPC."}, {"id": 3326105908, "d": "dev", "t": "messaging", "q": "An S3 upload event must trigger an image resizer, a virus scanner and an analytics pipeline independently. Which design fits?", "o": ["Send the S3 events to an SNS topic and subscribe one SQS queue per processor", "Send the S3 events to three Lambda functions in sequence through one chain", "Send the S3 events to one SQS queue that all three processors read", "Send the S3 events to EventBridge Pipes that call the processors one after another"], "a": 0, "e": "<b>SNS fan-out<\/b> delivers a copy to each subscriber queue so each consumer scales and fails independently. Consumers of one SQS queue compete for messages.", "w": "(C) Consumers of one queue compete for messages. (B) A chain couples the processors, and one failure blocks the next. (D) Pipes connect a source to one target and do not fan out independently."}, {"id": 2425802957, "d": "dev", "t": "messaging", "q": "An SNS subscriber should receive only messages whose `eventType` attribute equals `order_created`. What is used?", "o": ["A topic access policy with an attribute condition", "A delivery policy with a message group for the attribute", "A redrive policy that moves other messages to a queue", "A subscription filter policy"], "a": 3, "e": "<b>Subscription filter policies<\/b> filter on message attributes (or body) so each subscriber gets only relevant messages.", "w": "(A) Topic policies control publishers and subscribers. (B) Delivery policies control retries. (C) Redrive policies handle undeliverable messages."}, {"id": 519247943, "d": "dev", "t": "messaging", "q": "Records for the same customer must be processed in order in a Kinesis data stream. How is this guaranteed?", "o": ["Use the customer ID as the partition key so all records of a customer go to one shard", "Use enhanced fan-out, which keeps the order of records across shards", "Use one stream per customer and merge them in the consumer", "Use a random partition key and sort the records by timestamp in the consumer"], "a": 0, "e": "Kinesis guarantees ordering <b>per shard<\/b>; records with the same <b>partition key<\/b> land in the same shard.", "w": "(D) Records would be spread across shards and arrive out of order. (C) That does not scale and merging needs ordering logic. (B) Enhanced fan-out only affects read throughput."}, {"id": 3645977796, "d": "dev", "t": "messaging", "q": "Streaming clickstream data must be delivered to S3 in near real time with no consumer code to manage. What should be used?", "o": ["Amazon Data Firehose", "Amazon MSK with a managed connector", "Kinesis Data Streams with a Lambda consumer", "AWS Glue with a streaming job"], "a": 0, "e": "<b>Firehose<\/b> is a managed delivery service (S3, Redshift, OpenSearch, HTTP endpoints) with buffering and optional Lambda transformation.", "w": "(C) That requires consumer code you maintain. (B) MSK needs cluster and connector management. (D) Glue streaming jobs need development and are more complex."}, {"id": 2474698420, "d": "dev", "t": "messaging", "q": "Messages in an SQS queue must become visible to consumers only 5 minutes after they are sent. What should be configured?", "o": ["Set a delay on the queue or on each message (up to 15 minutes)", "Set the visibility timeout of the queue to 5 minutes", "Set the message retention period of the queue to 5 minutes", "Set long polling to 5 minutes on the consumer"], "a": 0, "e": "<b>Delay queues<\/b> postpone delivery of new messages (0-15 minutes). Visibility timeout hides a message after it has been received.", "w": "(B) Visibility timeout applies after a message is received. (C) Retention deletes messages after the period. (D) Long polling is limited to 20 seconds and does not delay messages."}, {"id": 1175048208, "d": "dev", "t": "messaging", "q": "A message larger than 256 KB must be sent through SQS. What is the standard approach?", "o": ["Compress the message with gzip and send it as a binary message attribute", "Store the payload in S3 and send a reference, for example with the SQS Extended Client Library", "Switch to a FIFO queue, which supports messages up to 1 MB", "Raise the queue's maximum message size above 256 KB in the queue settings"], "a": 1, "e": "SQS and SNS messages are limited to 256 KB. The <b>Extended Client Library<\/b> (for Java) automates the <b>S3 pointer pattern<\/b>.", "w": "(D) The queue setting goes up to 256 KB at most. (A) Attributes count toward the 256 KB limit. (C) FIFO queues have the same size limit."}, {"id": 3046358582, "d": "dev", "t": "stepfunctions", "q": "An order workflow must run several Lambda functions in sequence with retries on failure, a branch based on a condition, and a manual approval step. Which service fits best?", "o": ["AWS Step Functions with Choice, Retry and Catch and a task token for approval", "A chain of Lambda functions that invoke each other and keep the state in DynamoDB", "Amazon SQS with a Lambda consumer per step and a delay queue for the approval", "AWS Batch with a job dependency for each step and an approval job"], "a": 0, "e": "<b>Step Functions<\/b> orchestrates workflows with built-in retries, branching and the <code>waitForTaskToken<\/code> pattern for human approval.", "w": "(C) That needs custom code for branching and retries. (B) Chaining couples the functions and handles errors manually. (D) Batch runs containerized jobs, not short workflows with approvals."}, {"id": 2507625214, "d": "dev", "t": "stepfunctions", "q": "Thousands of short event-processing workflows (each under a minute) start every second and cost must be minimized. Which workflow type should be used?", "o": ["Standard workflows with a lower state transition count", "An Auto Scaling group of workers that poll an SQS queue", "Express workflows", "A Lambda function that calls the next function in the pipeline"], "a": 2, "e": "<b>Express workflows<\/b> (up to 5 minutes) are built for high-volume event processing and are billed by executions and duration; <b>Standard<\/b> is billed per state transition.", "w": "(A) Standard is billed per transition and has lower start rates. (D) Chains are harder to maintain. (B) Workers add operational overhead."}, {"id": 2362982726, "d": "dev", "t": "s3", "q": "A 6 GB file must be uploaded to S3 in one logical operation. What is required?", "o": ["A single PUT with a longer timeout, because the object limit is 5 TB", "S3 Select, which splits large uploads into several requests", "Multipart upload, because a single PUT is limited to 5 GB", "Transfer Acceleration, which raises the single upload limit to 50 GB"], "a": 2, "e": "A single <code>PutObject<\/code> can be at most <b>5 GB<\/b>; larger objects (up to 5 TB) need <b>multipart upload<\/b> (recommended for anything over 100 MB).", "w": "(A) A single PUT is limited to 5 GB even though objects can be up to 5 TB. (D) Transfer Acceleration speeds up transfers; it does not change limits. (B) S3 Select reads parts of objects; it does not upload."}, {"id": 3549367167, "d": "dev", "t": "s3", "q": "Users worldwide upload large files to a single bucket in one region and experience slow uploads. Which feature speeds this up?", "o": ["S3 Transfer Acceleration, which sends uploads through the nearest edge location", "Lifecycle rules that move new uploads to a closer storage class", "S3 Select, which compresses uploads before they travel to the bucket", "Cross-region replication, which accepts uploads in the nearest region"], "a": 0, "e": "<b>Transfer Acceleration<\/b> uses the AWS edge network to speed up long-distance uploads and downloads.", "w": "(D) Replication copies objects after they are uploaded. (C) S3 Select reads parts of objects. (B) Storage classes do not affect upload speed."}, {"id": 2824523744, "d": "dev", "t": "s3", "q": "Objects older than 90 days in a bucket should automatically move to a cheaper storage class, and be deleted after one year. What is used?", "o": ["S3 Lifecycle rules with transition and expiration actions", "S3 Batch Operations scheduled by EventBridge every day", "S3 Inventory with an automated delete of the listed objects", "S3 Intelligent-Tiering with an expiration setting in the object tags"], "a": 0, "e": "<b>Lifecycle configuration<\/b> transitions objects between storage classes and expires them based on age or tags.", "w": "(C) Inventory lists objects; it does not act on them. (D) Intelligent-Tiering moves objects by access, and expiration is a lifecycle action. (B) That works but needs custom scheduling; lifecycle rules are built in."}, {"id": 2520355975, "d": "dev", "t": "cli-sdk", "q": "A script lists millions of S3 objects with the SDK and receives only 1,000 keys per call. How should it get all keys?", "o": ["Call `ListObjects` again with the same parameters, which returns the next 1,000 keys", "Set `MaxKeys` to 10,000 so that one call returns all keys", "Use S3 Select to list the keys in a single response", "Use a paginator or the continuation token until all pages are read"], "a": 3, "e": "List calls are <b>paginated<\/b> (1,000 keys max per response). SDKs provide paginators that follow the continuation token automatically.", "w": "(B) A call returns at most 1,000 keys. (C) S3 Select queries object contents, not listings. (A) Repeating the same call returns the same page."}, {"id": 547559213, "d": "dev", "t": "rds", "q": "A gaming application needs a real-time leaderboard with ranked scores that update frequently. Which ElastiCache engine and structure fit best?", "o": ["RDS Multi-AZ with an index on the score column", "DynamoDB with a TTL on the score attribute", "Memcached with a multi-threaded cache cluster", "Redis with sorted sets"], "a": 3, "e": "<b>Redis<\/b> supports sorted sets, which are ideal for leaderboards. Memcached has only simple key-value storage.", "w": "(C) Memcached has no sorted data structure. (A) That is slower for frequent ranked updates. (B) TTL deletes items; it does not rank them."}, {"id": 1399126310, "d": "dev", "t": "lambda", "q": "Which statement about Lambda synchronous invocation errors is correct?", "o": ["Lambda retries twice and then sends the event to a DLQ", "Errors go back to the caller, which decides whether to retry", "Lambda retries until the function succeeds or the event expires", "Lambda stores the failed event and replays it when the caller asks"], "a": 1, "e": "With <b>synchronous<\/b> invocation (API Gateway, ALB, SDK RequestResponse) the result or error goes back to the caller; DLQs and automatic retries belong to <b>asynchronous<\/b> invocation.", "w": "(A) That describes asynchronous invocation. (C) Synchronous calls are not retried by Lambda. (D) Lambda does not store failed synchronous events."}, {"id": 669038145, "d": "dep", "t": "cfn", "q": "A template needs different AMI IDs per region without conditionals in every resource. Which section is designed for static lookup tables?", "o": ["Conditions, read with `Fn::If` and `AWS::Region`", "Mappings, read with `Fn::FindInMap` and `AWS::Region`", "Outputs, read with `Fn::ImportValue` and `AWS::Region`", "Parameters, read with `Ref` and `AWS::Region`"], "a": 1, "e": "<b>Mappings<\/b> are static key-value tables. A common pattern is a region-to-AMI map read with <code>Fn::FindInMap<\/code> and the pseudo parameter <code>AWS::Region<\/code>.", "w": "(D) Parameters are values supplied at deployment time. (A) Conditions are true or false checks, not tables. (C) Outputs expose values to other stacks."}, {"id": 1045661731, "d": "dep", "t": "cfn", "q": "A resource should only be created in the production environment (a parameter `Env` equals `prod`). Which CloudFormation feature handles this?", "o": ["The `Conditions` section and a `Condition` on the resource", "A `DeletionPolicy` that removes the resource outside production", "The `Rules` section that skips the resource in other environments", "The `Mappings` section with a key for each environment"], "a": 0, "e": "<b>Conditions<\/b> (Fn::Equals, Fn::And, Fn::Or, Fn::Not, Fn::If) decide whether resources, properties or outputs are created.", "w": "(D) Mappings are lookup tables. (C) Rules validate parameter values; they do not skip resources. (B) DeletionPolicy applies to deletion."}, {"id": 1933741660, "d": "dep", "t": "cfn", "q": "Which intrinsic function returns the Amazon Resource Name of an IAM role defined in the same template?", "o": ["`Fn::GetAtt` with the `Arn` attribute", "`Ref` on the role, which returns the ARN", "`Fn::Sub` with the role name, which resolves the role's ARN automatically", "`Fn::ImportValue` with the name of the role resource"], "a": 0, "e": "<code>Ref<\/code> on an IAM role returns the <b>name<\/b>; to get the <b>ARN<\/b> use <code>!GetAtt MyRole.Arn<\/code>. The returned values differ per resource type.", "w": "(B) Ref on an IAM role returns its name. (C) Sub only substitutes variables you provide. (D) ImportValue reads exports from other stacks."}, {"id": 2804715614, "d": "dep", "t": "cfn", "q": "A stack exports a VPC ID. Another stack in the same region must use it. Which function reads the exported value?", "o": ["`Fn::FindInMap` with the export name", "`Ref` with the output's logical ID from the other stack", "`Fn::ImportValue` with the export name", "`Fn::GetAtt` with the producing stack's name"], "a": 2, "e": "Outputs with an <b>Export<\/b> name become importable by other stacks in the same account and region via <code>Fn::ImportValue<\/code>.", "w": "(D) GetAtt reads resources in the same template. (B) Ref cannot see other stacks. (A) FindInMap reads Mappings."}, {"id": 3387763293, "d": "dep", "t": "cfn", "q": "A company wants to review exactly what a stack update would change before executing it. What should the developer use?", "o": ["Drift detection", "A change set", "A dry run with `aws cloudformation validate-template`", "A stack policy"], "a": 1, "e": "<b>Change sets<\/b> preview additions, modifications, and replacements before you execute the update.", "w": "(A) Drift detection compares real resources with the template. (D) Stack policies restrict updates. (C) validate-template checks syntax and does not preview changes."}, {"id": 24003786, "d": "dep", "t": "cfn", "q": "An EC2 instance in a stack must signal CloudFormation that its bootstrap finished successfully before the stack is marked CREATE_COMPLETE. What is used?", "o": ["A stack policy that waits for the instance's status checks", "A CreationPolicy (or WaitCondition) with `cfn-signal` sent from the instance", "An UpdatePolicy with a signal count and a timeout for the instance", "A DependsOn on the instance with `cfn-init` as the dependency"], "a": 1, "e": "<b>CreationPolicy<\/b> makes CloudFormation wait for a number of success signals (<code>cfn-signal<\/code>) within a timeout before completing the resource.", "w": "(D) DependsOn orders resources and does not wait for a signal. (C) UpdatePolicy applies to updates of Auto Scaling groups and similar resources. (A) Stack policies restrict updates."}, {"id": 3831816987, "d": "dep", "t": "cfn", "q": "A DBA wants to be sure that the production RDS database is kept as a snapshot when the stack is deleted. What should be set?", "o": ["`DeletionPolicy: Snapshot` on the database", "`UpdateReplacePolicy: Retain` on the database", "Termination protection on the stack", "A stack policy that denies `Update:Delete`"], "a": 0, "e": "<b>DeletionPolicy<\/b> options: Delete (default), Retain, and <b>Snapshot<\/b> for resources that support snapshots (RDS, EBS, ElastiCache, ...).", "w": "(B) That keeps the old resource after replacement, not on stack deletion. (C) Termination protection blocks deleting the stack instead of snapshotting. (D) Stack policies protect updates, not stack deletion."}, {"id": 3675221396, "d": "dep", "t": "cfn", "q": "Which mechanism prevents a CloudFormation update from accidentally modifying or replacing the production database resource?", "o": ["Termination protection on the stack", "A change set that is reviewed before each update", "A stack policy that denies update actions on that resource", "A DeletionPolicy of Retain on the resource"], "a": 2, "e": "A <b>stack policy<\/b> is a JSON document that protects specific resources from update actions during stack updates.", "w": "(B) Change sets show changes but do not prevent them. (A) Termination protection blocks stack deletion. (D) Retain keeps a resource when it is deleted."}, {"id": 3179449004, "d": "dep", "t": "cfn", "q": "A template creates an IAM role with a custom name and the deployment fails asking for acknowledgment. Which capability is required?", "o": ["CAPABILITY_IAM", "CAPABILITY_AUTO_EXPAND", "No capability, because custom names are allowed by default", "CAPABILITY_NAMED_IAM"], "a": 3, "e": "IAM resources need <code>CAPABILITY_IAM<\/code>; when they have <b>custom names<\/b> you need <code>CAPABILITY_NAMED_IAM<\/code>. <code>CAPABILITY_AUTO_EXPAND<\/code> is for macros and transforms.", "w": "(A) CAPABILITY_IAM covers IAM resources with generated names. (B) AUTO_EXPAND is for macros and transforms. (C) IAM resources always need an acknowledgment."}, {"id": 2084605913, "d": "dep", "t": "cfn", "q": "The same security baseline stack must be deployed to 40 accounts in several regions from one place. Which feature should be used?", "o": ["Change sets with a role per account", "Custom resources that call the CloudFormation API in each account", "Nested stacks", "CloudFormation StackSets"], "a": 3, "e": "<b>StackSets<\/b> deploy a template to many accounts and regions (with Organizations integration for automatic deployment).", "w": "(C) Nested stacks stay in one account and region. (A) Change sets update one stack. (B) That can work but is custom code, while StackSets does it natively."}, {"id": 179847591, "d": "dep", "t": "sam", "q": "What does the line `Transform: AWS::Serverless-2016-10-31` at the top of a template do?", "o": ["It makes CloudFormation validate the template against the Serverless Framework schema", "It marks the template as SAM, which CloudFormation expands into standard resources", "It marks the template as a CDK output that CloudFormation synthesizes", "It switches the stack to use AWS Lambda for deployments"], "a": 1, "e": "The <b>SAM transform<\/b> expands <code>AWS::Serverless::*<\/code> shorthand resources into standard CloudFormation resources at deployment time.", "w": "(C) CDK generates plain templates and needs no transform. (A) The transform belongs to SAM, not to the Serverless Framework. (D) The transform does not change how stacks deploy."}, {"id": 1769087929, "d": "dep", "t": "sam", "q": "Which SAM command builds the application and which one deploys it interactively the first time?", "o": ["`sam build` and `sam deploy --guided`", "`sam validate` and `sam sync --guided`", "`sam build` and `sam local deploy`", "`sam package` and `sam init --guided`"], "a": 0, "e": "<code>sam build<\/code> compiles and prepares artifacts; <code>sam deploy --guided<\/code> asks questions and stores answers in <code>samconfig.toml<\/code>.", "w": "(D) sam init creates a project, and package only uploads artifacts. (B) validate checks the template; sync is for fast updates. (C) There is no sam local deploy."}, {"id": 2207635222, "d": "dep", "t": "sam", "q": "A developer wants to test a Lambda function locally with a sample S3 event before deploying. Which tools are used?", "o": ["`sam deploy --guided` and a test event in the console", "`sam local generate-event s3 put` and `sam local invoke` with Docker", "`aws lambda invoke --local` with an event file", "`sam logs` and `sam local start-lambda` with the AWS CLI"], "a": 1, "e": "SAM CLI can generate sample events and run functions in a local container that emulates Lambda; <code>sam local start-api<\/code> emulates API Gateway.", "w": "(D) sam logs reads CloudWatch Logs from a deployed function. (C) The CLI has no local mode. (A) That deploys the function, which the question wants to avoid."}, {"id": 2971342531, "d": "dep", "t": "sam", "q": "A SAM application must shift traffic to a new Lambda version gradually and roll back automatically on alarms. Which SAM properties are used?", "o": ["`Layers` with `DeploymentPreference`", "`ReservedConcurrentExecutions` with `Events`", "`AutoPublishAlias` with `DeploymentPreference` and `Alarms`", "`ProvisionedConcurrencyConfig` with `AutoPublishAlias`"], "a": 2, "e": "SAM integrates with <b>CodeDeploy<\/b>: <code>AutoPublishAlias<\/code> + <code>DeploymentPreference<\/code> (Canary/Linear/AllAtOnce) + CloudWatch <code>Alarms<\/code> and optional pre/post traffic hooks.", "w": "(D) Provisioned concurrency pre-warms and does not shift traffic. (B) Reserved concurrency caps the function. (A) Layers share code, and DeploymentPreference needs an alias."}, {"id": 753439429, "d": "dep", "t": "cdk", "q": "What does `cdk synth` produce?", "o": ["A diff between the app and the deployed stack", "A bootstrapped environment with an S3 bucket and roles", "A deployed stack in the account", "A CloudFormation template generated from the app, in `cdk.out`"], "a": 3, "e": "<code>cdk synth<\/code> synthesizes the app into a CloudFormation template; <code>cdk deploy<\/code> then deploys it through CloudFormation.", "w": "(C) That is `cdk deploy`. (B) That is `cdk bootstrap`. (A) That is `cdk diff`."}, {"id": 3931956824, "d": "dep", "t": "cdk", "q": "Before deploying a CDK app that uses assets (for example Lambda code) to a new account and region for the first time, what must be done?", "o": ["Run `cdk diff` against the new account, which creates the missing resources", "Run `cdk synth` to publish the assets to the account before the deployment", "Run `cdk init` in the new region to create the staging bucket for the assets", "Run `cdk bootstrap` to create the toolkit resources: an S3 bucket, roles and an ECR repository"], "a": 3, "e": "<b>Bootstrapping<\/b> provisions the staging bucket, repository and IAM roles that CDK deployments use in that account and region.", "w": "(B) synth only generates templates locally. (C) init creates a project. (A) diff only compares and creates nothing."}, {"id": 120200450, "d": "dep", "t": "cdk", "q": "Which CDK construct level provides high-level patterns that combine several resources, for example a load-balanced Fargate service?", "o": ["L1 constructs, which are patterns that combine several resources", "Aspects, which are patterns that combine several resources", "L2 constructs, which map one-to-one to CloudFormation resources", "L3 constructs, which are patterns that combine several resources"], "a": 3, "e": "<b>L1<\/b> = raw CloudFormation resources, <b>L2<\/b> = curated resources with defaults and helpers, <b>L3<\/b> = patterns of multiple resources.", "w": "(A) L1 constructs map one-to-one to CloudFormation resources. (C) L2 constructs add defaults and helpers to a single resource. (B) Aspects visit constructs to apply rules, not to build architectures."}, {"id": 3553991286, "d": "dep", "t": "beanstalk", "q": "A company needs a zero-downtime Elastic Beanstalk deployment that keeps full capacity during the update and allows the quickest rollback. Which policy fits best?", "o": ["All at once, which keeps full capacity because the old and new versions run together", "Rolling, which keeps full capacity by updating all instances at the same time", "Immutable, which launches a full new set of instances and keeps the old ones until the new ones are healthy", "Rolling with additional batch, which provides the quickest rollback by terminating the new batch"], "a": 2, "e": "<b>Immutable<\/b> launches a parallel set of instances in a temporary Auto Scaling group; if healthy they replace the old ones, otherwise they are removed. Highest cost, best safety.", "w": "(B) Rolling reduces capacity while a batch is updated. (D) Rolling with an additional batch rolls back by redeploying. (A) All at once updates every instance together and causes downtime."}, {"id": 3093951523, "d": "dep", "t": "beanstalk", "q": "An Elastic Beanstalk update must never reduce serving capacity but should avoid the cost of doubling the fleet. Which policy fits?", "o": ["Rolling, which adds instances first and then updates the old ones in batches", "Rolling with additional batch, which adds a batch of new instances before updating the others", "Immutable, which adds only a single extra instance before updating the others", "All at once, which keeps capacity by updating half of the instances at a time"], "a": 1, "e": "<b>Rolling with additional batch<\/b> first launches one extra batch of new instances so capacity is never reduced, then updates the rest in batches.", "w": "(C) Immutable launches a whole new set of instances, which is more expensive. (A) Plain rolling updates instances in place, so capacity drops during each batch. (D) All at once updates all instances together."}, {"id": 2921170690, "d": "dep", "t": "beanstalk", "q": "A developer must install a custom package and write a config file on every Beanstalk instance during deployment. Where is this defined?", "o": ["In a `Procfile` that lists the packages to install on each instance", "In the environment's software configuration page, as a startup script", "In an instance profile policy that grants the permission to install packages", "In `.ebextensions` config files inside the application source bundle"], "a": 3, "e": "<b>.ebextensions<\/b> YAML/JSON config files customize packages, files, commands, option settings and extra resources.", "w": "(B) The console sets options and properties, not packages and files for every instance. (A) A Procfile defines how the application processes start. (C) Instance profiles grant permissions; they do not install packages."}, {"id": 3047714210, "d": "dep", "t": "beanstalk", "q": "A background job processor should read messages from SQS in Elastic Beanstalk without exposing a web endpoint. Which environment tier is used?", "o": ["The worker environment tier, which reads from an SQS queue", "A Docker environment, because only Docker platforms can read from SQS", "The web server environment tier with the load balancer disabled", "A single instance environment with an SQS trigger configured in the console"], "a": 0, "e": "The <b>worker tier<\/b> runs a daemon that pulls messages from an SQS queue and POSTs them to the app; <code>cron.yaml<\/code> schedules periodic tasks.", "w": "(C) The web tier serves HTTP requests. (D) A single instance is still a web server environment. (B) The worker tier is available for many platforms."}, {"id": 1587432463, "d": "dep", "t": "beanstalk", "q": "A production Elastic Beanstalk environment includes an RDS instance created by Beanstalk. What is the risk?", "o": ["The database is publicly accessible because Beanstalk uses the default VPC security group", "The database is part of the environment and is deleted with it; use a separate RDS for production", "The database is replicated to a second environment, so you pay for two databases", "The database is limited to one Availability Zone and cannot use Multi-AZ"], "a": 1, "e": "A database created inside the environment is part of it. For production create the <b>database outside<\/b> Beanstalk (or decouple it with a snapshot and delete protection).", "w": "(C) Beanstalk does not replicate the database. (A) The database follows the environment's security group configuration. (D) Databases created by Beanstalk can be configured for Multi-AZ."}, {"id": 2908330201, "d": "dep", "t": "ecs", "q": "Which ECS component keeps a specified number of tasks running and registers them with a load balancer?", "o": ["The ECS container instance", "The ECS service", "The ECS cluster", "The ECS task definition"], "a": 1, "e": "A <b>service<\/b> maintains the desired task count, replaces failed tasks and integrates with ALB/NLB. A <b>task definition<\/b> is the blueprint.", "w": "(D) A task definition is the blueprint. (A) A container instance is an EC2 host. (C) A cluster groups resources; the service maintains the desired count."}, {"id": 331694339, "d": "dep", "t": "ecs", "q": "A containerized app needs to call DynamoDB. Which ECS setting provides the permissions to the application code?", "o": ["The service-linked role of ECS", "The EC2 instance profile of the container instance", "The task execution role in the task definition", "The task role in the task definition"], "a": 3, "e": "The <b>task role<\/b> is assumed by containers in the task. The <b>execution role<\/b> is used by the ECS agent to pull images, write logs and fetch secrets.", "w": "(C) The execution role is for pulling images and writing logs. (B) The instance profile belongs to the host and would be shared by all tasks. (A) The service-linked role lets ECS manage resources."}, {"id": 1102870883, "d": "dep", "t": "ecs", "q": "An ECS service on Fargate must scale the number of tasks based on average CPU usage. Which feature is used?", "o": ["An EC2 Spot Fleet with a capacity target based on CPU", "An EC2 Auto Scaling group with a CPU target tracking policy", "A Route 53 weighted record per task that is added when CPU rises", "Service Auto Scaling with target tracking on `ECSServiceAverageCPUUtilization`"], "a": 3, "e": "ECS <b>Service Auto Scaling<\/b> adjusts the desired task count. For the EC2 launch type the cluster capacity is scaled additionally (capacity providers).", "w": "(B) Fargate has no instances. (A) Spot Fleet manages instances. (C) Route 53 does not change the number of tasks."}, {"id": 3216648568, "d": "dep", "t": "ecs", "q": "Which placement strategy spreads ECS tasks evenly across Availability Zones for high availability on the EC2 launch type?", "o": ["`spread` on `attribute:ecs.availability-zone`", "`random` combined with the `distinctInstance` constraint", "`binpack` on `attribute:ecs.availability-zone`", "`spread` on `instanceId` only"], "a": 0, "e": "<b>spread<\/b> distributes tasks evenly over a field (AZ or instance ID); <b>binpack<\/b> packs tasks tightly to minimize instances; <b>random<\/b> places randomly.", "w": "(C) binpack packs tasks tightly. (B) random places tasks without balance, and distinctInstance only limits one task per instance. (D) Spreading by instance ID balances instances, not AZs."}, {"id": 993169125, "d": "dep", "t": "ecs", "q": "Which command logs the Docker client in to a private Amazon ECR registry?", "o": ["`aws ecr get-login-password | docker login --username AWS --password-stdin <registry>`", "`aws ecr login --docker --registry <registry>`", "`docker login --username AWS --password $(aws ecs get-login-password)`", "`aws ecr get-login --no-include-email | docker push <registry>`"], "a": 0, "e": "The CLI generates an authorization token (valid 12 hours) piped to <code>docker login<\/code> as user <code>AWS<\/code>.", "w": "(B) There is no `aws ecr login --docker` command. (C) The command belongs to `ecr`, not `ecs`. (D) The old get-login command is deprecated and does not pipe into push."}, {"id": 3953619697, "d": "dep", "t": "cicd", "q": "Which file defines the commands and phases for an AWS CodeBuild project and where is it placed by default?", "o": ["`appspec.yml` in the root of the source", "`template.yaml` in the root of the source", "`Dockerfile` in the root of the source", "`buildspec.yml` in the root of the source"], "a": 3, "e": "<b>buildspec.yml<\/b> defines <code>env<\/code>, <code>phases<\/code> (install, pre_build, build, post_build), <code>artifacts<\/code> and <code>cache<\/code>. <b>appspec.yml<\/b> belongs to CodeDeploy.", "w": "(A) appspec.yml belongs to CodeDeploy. (B) template.yaml is a CloudFormation or SAM template. (C) A Dockerfile describes an image, not build phases."}, {"id": 3251660965, "d": "dep", "t": "cicd", "q": "How should a CodeBuild project access a database password during the build without exposing it in the console?", "o": ["Reference it in the buildspec `env` section with `secrets-manager` or `parameter-store`", "Store it in the source repository in an encrypted zip file and unzip it during the build", "Define it as a PLAINTEXT environment variable and restrict console access to the project", "Encode it with Base64 and store it in the `variables` section of the buildspec"], "a": 0, "e": "Use <code>secrets-manager<\/code> or <code>parameter-store<\/code> entries under <code>env<\/code> so the value is fetched securely at build time. PLAINTEXT variables are visible.", "w": "(C) PLAINTEXT values are visible in the project and logs. (D) Base64 is not encryption. (B) Secrets in repositories can leak and are hard to rotate."}, {"id": 1001787497, "d": "dep", "t": "cicd", "q": "Which CodeDeploy lifecycle event order is correct for an in-place EC2 deployment?", "o": ["BeforeInstall, ApplicationStop, AfterInstall, ValidateService, ApplicationStart", "ApplicationStop, AfterInstall, BeforeInstall, ApplicationStart, ValidateService", "ApplicationStop, BeforeInstall, AfterInstall, ApplicationStart, ValidateService", "ApplicationStart, BeforeInstall, AfterInstall, ApplicationStop, ValidateService"], "a": 2, "e": "Order: <b>ApplicationStop → DownloadBundle → BeforeInstall → Install → AfterInstall → ApplicationStart → ValidateService<\/b>.", "w": "(A) ApplicationStop runs first, and ApplicationStart comes before ValidateService. (B) BeforeInstall runs before AfterInstall. (D) ApplicationStop runs before the install steps."}, {"id": 1125231142, "d": "dep", "t": "cicd", "q": "For a Lambda deployment, which CodeDeploy configuration shifts 10% of the traffic first and the remaining 90% after 10 minutes in one step?", "o": ["Canary10Percent30Minutes", "AllAtOnce", "Linear10PercentEvery10Minutes", "Canary10Percent10Minutes"], "a": 3, "e": "<b>Canary<\/b> = a small portion first, then the rest at once. <b>Linear<\/b> = equal increments at intervals. <b>HalfAtATime<\/b> is for EC2.", "w": "(C) Linear shifts 10% every 10 minutes until all traffic has moved. (A) That waits 30 minutes before shifting the rest. (B) AllAtOnce shifts all traffic immediately."}, {"id": 51433753, "d": "dep", "t": "cicd", "q": "A CodePipeline must wait for a manager to approve the release before the production deployment starts. What is added?", "o": ["A second pipeline that triggers the first one after an approval", "A manual approval action in a stage before the deploy stage", "A CodeBuild action with an approval step in the buildspec", "A CloudWatch alarm action on the pipeline that pauses it"], "a": 1, "e": "<b>Manual approval<\/b> actions pause the pipeline until an authorized IAM principal approves or rejects it (optionally notified through SNS).", "w": "(C) Buildspecs have no approval step. (D) Alarms cannot pause a pipeline for a human decision. (A) A second pipeline would still need an approval mechanism."}, {"id": 3505933281, "d": "dep", "t": "cicd", "q": "A company must host private npm packages for internal libraries with upstream access to the public npm registry. Which service fits?", "o": ["AWS CodeCommit with a package branch", "Amazon S3 with the npm client pointed at a bucket", "AWS CodeArtifact", "Amazon ECR with an npm repository"], "a": 2, "e": "<b>CodeArtifact<\/b> is a managed package repository (npm, pip, Maven, NuGet) that can proxy public registries through upstream repositories.", "w": "(D) ECR stores container images. (A) CodeCommit stores source code. (B) npm clients need a registry protocol that S3 does not provide."}, {"id": 3988927983, "d": "dep", "t": "elb-asg", "q": "An ASG must always keep the average CPU around 40% without manually defined thresholds. Which scaling policy type fits?", "o": ["Scheduled scaling with a fixed capacity per hour", "Target tracking scaling", "Step scaling with alarms at 30% and 50%", "Predictive scaling with a fixed minimum capacity"], "a": 1, "e": "<b>Target tracking<\/b> works like a thermostat for a metric. Scheduled scaling is time-based; step/simple scaling needs alarms you define.", "w": "(C) Step scaling needs thresholds that you define. (A) Scheduled scaling follows a clock, not the CPU. (D) Predictive scaling forecasts load from history rather than keeping a metric at a target."}, {"id": 946142328, "d": "dep", "t": "ec2", "q": "A fleet of instances must run a bootstrap script at first boot to install software. Where is it provided?", "o": ["An instance tag that holds the script and is executed at start", "An AMI description that is executed when the AMI is first used", "A launch template description field that is run by cloud-init", "EC2 User Data, which runs as root at first launch"], "a": 3, "e": "<b>User Data<\/b> is executed by cloud-init once at first boot (by default) and can be a shell script or cloud-init directives.", "w": "(A) Tags are labels and are not executed. (C) Descriptions are free text. (B) AMI descriptions are not executed."}, {"id": 1770547406, "d": "dep", "t": "lambda", "q": "A Lambda function should be deployed with infrastructure code and updated safely. Which statement about versions and aliases is correct?", "o": ["$LATEST is immutable, and published versions always point to the newest code", "Published versions can be edited until an alias points to them, and then they are locked", "Published versions are immutable, and an alias points to a version and can be re-pointed or weighted", "An alias copies the function code, so changing the alias never affects the version"], "a": 2, "e": "<b>Versions<\/b> are immutable snapshots (<code>$LATEST<\/code> is the only mutable one). An <b>alias<\/b> is a named pointer (can split traffic between two versions).", "w": "(B) Versions are immutable from the moment they are published. (D) An alias is a pointer; it does not copy code. (A) $LATEST is the mutable version."}, {"id": 2614744167, "d": "dep", "t": "ec2", "q": "A batch job is stateless, restartable and must run as cheaply as possible. Which EC2 purchasing option fits best?", "o": ["Dedicated Hosts", "Spot Instances", "Reserved Instances for three years", "On-Demand Instances with a Savings Plan"], "a": 1, "e": "<b>Spot<\/b> offers up to ~90% savings for interruptible, fault-tolerant workloads. Reserved/Savings Plans suit steady usage; Dedicated Hosts are for licensing/compliance.", "w": "(C) Reserved Instances suit steady usage. (A) Dedicated Hosts are for licensing and compliance. (D) A Savings Plan lowers the price but not as much as Spot for interruptible work."}, {"id": 3764117348, "d": "dep", "t": "ec2", "q": "An application needs very low network latency between instances for HPC. Which placement group strategy is best?", "o": ["Partition placement group", "Spread placement group", "A multi-AZ Auto Scaling group", "Cluster placement group"], "a": 3, "e": "<b>Cluster<\/b> packs instances close together in one AZ for low latency and high throughput; <b>Spread<\/b> places each instance on distinct hardware (max 7 per AZ); <b>Partition<\/b> isolates groups for big-data systems.", "w": "(B) Spread separates instances onto different hardware. (A) Partition isolates groups of instances for big-data systems. (C) Multiple AZs add latency between instances."}, {"id": 1398800402, "d": "dep", "t": "ec2", "q": "An instance in a private subnet must call the AWS API without using long-term keys. What provides credentials?", "o": ["An IAM user whose access keys are stored in the instance's user data", "The key pair of the instance, which signs the API requests", "An IAM role attached through an instance profile, with credentials from the metadata service", "A security group rule that identifies the instance to the AWS APIs"], "a": 2, "e": "<b>Instance profile<\/b> + role: the SDK/CLI fetches temporary, auto-rotated credentials from the metadata service (use IMDSv2).", "w": "(A) Keys in user data can leak and do not rotate. (D) Security groups filter traffic; they do not identify callers. (B) Key pairs are for SSH access."}, {"id": 330991681, "d": "dep", "t": "storage", "q": "A volume must survive instance termination and be moved to another Availability Zone. How?", "o": ["Enable Multi-Attach on the volume and attach it to an instance in the other AZ", "Copy the data to the instance store of an instance in the other AZ", "Create a snapshot and restore a volume from it in the other AZ", "Detach the volume and attach it to an instance in the other AZ"], "a": 2, "e": "EBS volumes live in <b>one AZ<\/b>. <b>Snapshots<\/b> (stored in S3) can be restored in any AZ of the region or copied to another region.", "w": "(D) A volume can only attach to instances in its own AZ. (A) Multi-Attach works only within one AZ. (B) Instance store is lost when the instance stops."}, {"id": 4154677661, "d": "dep", "t": "storage", "q": "Which storage is shared by many EC2 instances in different AZs through the NFS protocol and grows automatically?", "o": ["Amazon EBS with Multi-Attach", "Amazon EFS", "Amazon FSx for Lustre", "Amazon S3 with a file gateway"], "a": 1, "e": "<b>EFS<\/b> is a managed, elastic, multi-AZ NFS file system for Linux.", "w": "(A) Multi-Attach works only in one AZ. (C) Lustre uses its own protocol and is built for high-performance computing. (D) A file gateway adds a cache layer and does not provide a native elastic NFS file system."}, {"id": 539791057, "d": "dep", "t": "storage", "q": "A database needs consistent high IOPS (more than 16,000) on an EBS volume. Which volume type fits?", "o": ["Throughput Optimized HDD (st1)", "Provisioned IOPS SSD (io1/io2)", "Cold HDD (sc1)", "General Purpose SSD (gp3) with the default settings"], "a": 1, "e": "<b>io1/io2<\/b> provide provisioned IOPS for critical databases (up to 64,000 IOPS on Nitro). st1 and sc1 are HDD types and cannot be boot volumes.", "w": "(D) gp3 reaches up to 16,000 IOPS only. (A) st1 is optimized for throughput. (C) sc1 is the cheapest HDD for infrequent access."}, {"id": 3213871486, "d": "dep", "t": "storage", "q": "Data on an EC2 instance store volume is lost in which situation?", "o": ["When the instance is rebooted", "When the instance is stopped, terminated or its host fails", "When an AMI is created from the instance", "When an EBS volume is attached to the instance"], "a": 1, "e": "<b>Instance store<\/b> is ephemeral: it is lost on stop, terminate or host failure (survives a simple reboot).", "w": "(A) Instance store data survives a reboot. (C) Creating an AMI does not affect the disks. (D) Attaching EBS volumes does not affect the instance store."}, {"id": 3042836472, "d": "dep", "t": "elb-asg", "q": "Which load balancer routes traffic based on URL path and host header and can route to Lambda functions?", "o": ["Network Load Balancer", "Classic Load Balancer", "Gateway Load Balancer", "Application Load Balancer"], "a": 3, "e": "<b>ALB<\/b> (layer 7) supports path, host, header and query-string routing, and Lambda targets.", "w": ""}, {"id": 1764453510, "d": "dep", "t": "elb-asg", "q": "A legacy client needs a fixed IP address to whitelist for a load-balanced service using TCP. Which load balancer fits?", "o": ["Classic Load Balancer, which provides Elastic IPs that you assign to the listeners", "Network Load Balancer, which provides a static IP address per Availability Zone", "Application Load Balancer, which provides a static IP address per Availability Zone", "Gateway Load Balancer, which provides a static IP address for TCP listeners"], "a": 1, "e": "<b>NLB<\/b> operates at layer 4 and provides a static IP (or Elastic IP) per AZ.", "w": "(C) ALB addresses change; Global Accelerator can provide static IPs. (A) CLB has no static IPs. (D) GWLB forwards traffic to appliances and is not used for client-facing TCP services."}, {"id": 2255067053, "d": "dep", "t": "elb-asg", "q": "An ALB serves HTTPS for several domains with different certificates on one listener. Which feature enables this?", "o": ["Server Name Indication with several certificates on the listener", "Cross-zone load balancing with a certificate per Availability Zone", "Sticky sessions with one certificate per target group", "Connection draining with a certificate per registered target"], "a": 0, "e": "<b>SNI<\/b> lets ALB and NLB (and CloudFront) present the certificate that matches the requested hostname. Classic Load Balancer supports only one certificate.", "w": "(C) Stickiness binds clients to targets. (B) Cross-zone balancing distributes traffic across zones. (D) Connection draining handles deregistering targets."}, {"id": 4221408498, "d": "dep", "t": "elb-asg", "q": "During scale-in, instances should finish in-flight requests before they are removed from an ALB. Which setting controls this?", "o": ["The stickiness duration of the target group", "The deregistration delay of the target group", "The health check interval of the target group", "The cooldown period of the Auto Scaling group"], "a": 1, "e": "<b>Deregistration delay<\/b> (default 300 seconds) keeps existing connections alive while no new requests are sent to the target.", "w": "(C) The health check interval decides how often targets are checked. (D) The cooldown limits scaling activities. (A) Stickiness binds clients to targets."}, {"id": 2822556662, "d": "dev", "t": "rds", "q": "An RDS database must stay available if an Availability Zone fails, with automatic failover. Which feature provides this?", "o": ["Multi-AZ deployment, which keeps a synchronous standby for automatic failover", "A read replica in another AZ, which fails over automatically to the primary", "A larger instance class with Enhanced Monitoring, which prevents AZ failures", "Automated backups with point-in-time recovery, which restore the database automatically"], "a": 0, "e": "<b>Multi-AZ<\/b> keeps a synchronous standby in another AZ and fails over automatically. Read replicas are asynchronous and for read scaling.", "w": "(B) Read replicas need manual promotion. (D) Restoring from backups creates a new instance and takes time. (C) A bigger instance does not protect against AZ failures."}, {"id": 316242202, "d": "dev", "t": "rds", "q": "Reporting queries slow down the primary RDS database. Which solution offloads them with the least change?", "o": ["Enable encryption at rest so that the storage layer handles the reports faster", "Create a read replica and point the reporting queries at its endpoint", "Increase the backup retention period so that reports run on the backups", "Enable Multi-AZ and point the reporting queries at the standby instance"], "a": 1, "e": "<b>Read replicas<\/b> serve read-only queries asynchronously. In classic RDS Multi-AZ the standby cannot be read.", "w": "(D) The standby is not readable. (C) Backups cannot be queried in place. (A) Encryption does not speed up queries."}, {"id": 3021391103, "d": "dev", "t": "rds", "q": "Which statement about Amazon Aurora storage is correct?", "o": ["Data is stored in six copies in a single AZ, and storage grows up to 16 TB", "Data is stored in three copies across three AZs, and storage must be provisioned", "Data is stored in two copies across two AZs, and storage grows up to 64 TB", "Data is stored in six copies across three AZs, and storage grows up to 128 TB"], "a": 3, "e": "<b>Aurora<\/b> has a distributed, self-healing storage layer (6 copies / 3 AZs), auto-growing storage and up to 15 read replicas.", "w": "(B) Aurora stores six copies and grows storage automatically. (A) The copies are spread across three AZs. (C) Aurora uses six copies and supports up to 128 TB."}, {"id": 2282448222, "d": "dev", "t": "rds", "q": "An application caches data in ElastiCache. It reads from the cache first and loads from the database on a miss. Which strategy is this?", "o": ["Write-behind", "Read-through with a read replica", "Lazy loading (cache-aside)", "Write-through"], "a": 2, "e": "<b>Lazy loading<\/b> fills the cache on demand (risk: stale data, cache-miss penalty). <b>Write-through<\/b> updates the cache on every database write.", "w": "(D) Write-through updates the cache on every write. (A) Write-behind writes to the cache first and to the database later. (B) Read replicas serve database reads; they are not a caching strategy."}, {"id": 1827560922, "d": "dev", "t": "rds", "q": "Which ElastiCache engine supports replication, persistence and Multi-AZ failover?", "o": ["Redis, which supports replication groups, persistence and Multi-AZ failover", "Memcached, which supports replication groups and Multi-AZ failover but not persistence", "Memcached, which supports persistence and failover through snapshots", "Both engines, because ElastiCache adds replication to Memcached clusters"], "a": 0, "e": "<b>Redis<\/b> offers replication, Multi-AZ failover, persistence/backup; <b>Memcached<\/b> is simpler, multi-threaded sharding without replication.", "w": "(B) Memcached has no replication. (C) Memcached has no persistence or snapshots. (D) Only Redis supports replication."}, {"id": 1126632842, "d": "dep", "t": "r53", "q": "Which Route 53 record type can point the root domain `example.com` at an Application Load Balancer?", "o": ["A CNAME record that points to the load balancer's DNS name", "An Alias record (A or AAAA)", "A TXT record that contains the load balancer's DNS name", "An NS record that delegates the root domain to the load balancer"], "a": 1, "e": "A <b>CNAME<\/b> cannot exist at the zone apex. <b>Alias<\/b> records can, are free for AWS targets and need no TTL.", "w": "(A) A CNAME cannot be used at the zone apex. (D) NS records delegate zones to name servers. (C) TXT records hold text and do not resolve to addresses."}, {"id": 1015161265, "d": "dep", "t": "r53", "q": "Traffic must go to the primary region and automatically switch to a backup region when the primary is unhealthy. Which routing policy is used?", "o": ["Multi-value answer routing with the backup region as one of the values", "Geolocation routing with the backup region as the default", "Failover routing with a health check on the primary", "Weighted routing with a weight of zero for the backup"], "a": 2, "e": "<b>Failover<\/b> routing uses a Route 53 health check on the primary record and serves the secondary when it fails.", "w": "(A) Multi-value returns several records at once; it is not primary and secondary. (D) A zero weight never sends traffic to the backup, even if the primary fails. (B) Geolocation routes by user location."}, {"id": 3091861967, "d": "dep", "t": "r53", "q": "10% of users must be sent to a new application version and 90% to the old one using DNS. Which routing policy fits?", "o": ["Failover routing with the new version as secondary", "Latency routing with a 10% bias towards the new version", "Geoproximity routing with a bias of 10", "Weighted routing"], "a": 3, "e": "<b>Weighted<\/b> records split traffic by percentage - useful for blue/green and canary at the DNS level.", "w": "(B) Latency routing has no percentage setting. (C) Geoproximity bias shifts traffic by location. (A) Failover only uses the secondary when the primary is unhealthy."}, {"id": 3352096677, "d": "dep", "t": "r53", "q": "Users should be served from the AWS region with the lowest network latency for them. Which policy is used?", "o": ["Latency-based routing", "Simple routing with several region records", "Geolocation routing based on the user's country", "Geoproximity routing with a bias for the nearest region"], "a": 0, "e": "<b>Latency<\/b> routing directs users to the region with the best measured latency; <b>Geolocation<\/b> routes by user location (country/continent) for compliance or localization.", "w": "(C) Geolocation uses location, not latency. (D) Geoproximity uses distance and a bias. (B) Simple routing returns all values in random order."}, {"id": 2855633784, "d": "dep", "t": "vpc", "q": "Instances in a private subnet need outbound internet access for updates but must not be reachable from the internet. What should be deployed?", "o": ["A NAT gateway in a public subnet with a route from the private subnet", "A VPC peering connection to a VPC that has internet access", "An Elastic IP address on each instance in the private subnet", "An internet gateway in the private subnet with a route for the updates"], "a": 0, "e": "A <b>NAT gateway<\/b> (in a public subnet) allows outbound-only internet access for private subnets.", "w": "(D) Instances with private addresses cannot use an internet gateway directly. (B) Peering does not route traffic to the internet through the other VPC. (C) Elastic IPs make instances reachable from the internet."}, {"id": 4196065905, "d": "dep", "t": "vpc", "q": "Which VPC feature gives private access to S3 and DynamoDB at no additional hourly charge using route table entries?", "o": ["A Site-to-Site VPN, which uses route table entries and has no hourly charge", "A gateway VPC endpoint, which uses route table entries and has no hourly charge", "A NAT gateway, which uses route table entries and has no hourly charge", "An interface VPC endpoint, which uses route table entries and has no hourly charge"], "a": 1, "e": "<b>Gateway endpoints<\/b> exist for S3 and DynamoDB only and are free. <b>Interface endpoints<\/b> (ENIs, PrivateLink) serve most other services and have hourly and data charges.", "w": "(D) Interface endpoints use ENIs and charge by the hour. (C) NAT gateways charge by the hour and for data. (A) VPN connections charge by the hour."}, {"id": 3718548265, "d": "dep", "t": "vpc", "q": "Two VPCs with non-overlapping CIDR ranges must communicate privately. A third VPC is peered with the second one only. Can the first and third VPC communicate through the second?", "o": ["Yes, because peering routes are propagated automatically through the middle VPC", "No, because VPC peering is not transitive", "Yes, as long as the security groups allow the traffic", "Yes, when the middle VPC has an internet gateway attached"], "a": 1, "e": "<b>VPC peering is not transitive<\/b>; use a direct peering or AWS Transit Gateway for hub-and-spoke designs.", "w": "(A) Routes are not propagated through peering. (C) Security groups cannot create a path. (D) An internet gateway does not create a private path."}, {"id": 3633852604, "d": "ts", "t": "vpc", "q": "Where can an engineer see which network traffic was accepted or rejected for the ENIs in a VPC?", "o": ["VPC Flow Logs", "X-Ray", "AWS Config", "CloudTrail"], "a": 0, "e": "<b>VPC Flow Logs<\/b> record IP traffic metadata with ACCEPT/REJECT, useful to debug security group and NACL problems.", "w": ""}, {"id": 4189514839, "d": "dev", "t": "cloudfront", "q": "Which CloudFront capability restricts access to an S3 origin so that content can only be fetched through the distribution?", "o": ["Geo restriction on the distribution with the origin's region", "Origin Access Control with a bucket policy that allows the distribution", "A bucket policy that allows requests with a secret `Referer` header", "A bucket ACL that allows the CloudFront IP ranges"], "a": 1, "e": "<b>OAC<\/b> lets CloudFront sign requests to a private S3 bucket; the bucket policy allows only that distribution.", "w": "(D) ACLs do not allow IP ranges, and these ranges change. (A) Geo restriction limits viewers by country. (C) A Referer header can be copied by anyone who finds it."}, {"id": 3755295016, "d": "dev", "t": "cloudfront", "q": "Which statement about CloudFront and ACM certificates is correct?", "o": ["The certificate must be in the region closest to the viewers", "The certificate must be in the region of the origin", "The certificate must be in us-east-1", "The certificate must be exported and uploaded to each edge location"], "a": 2, "e": "For CloudFront the ACM certificate must be in <b>us-east-1 (N. Virginia)<\/b>, regardless of the origin's region.", "w": "(B) CloudFront requires us-east-1 regardless of the origin. (A) Edge locations do not select a certificate region. (D) Certificates are not uploaded to edge locations manually."}, {"id": 620731407, "d": "dev", "t": "s3", "q": "Which S3 storage class offers the lowest cost for rarely accessed data that can be retrieved within hours and has a minimum storage duration of 180 days?", "o": ["S3 Glacier Flexible Retrieval", "S3 Glacier Instant Retrieval", "S3 Standard-Infrequent Access", "S3 Glacier Deep Archive"], "a": 3, "e": "<b>Deep Archive<\/b>: cheapest, retrieval in 12-48 hours, 180-day minimum. Standard-IA and One Zone-IA have a 30-day minimum; Glacier Instant/Flexible have 90 days.", "w": "(A) Flexible Retrieval has a 90-day minimum. (B) Instant Retrieval has a 90-day minimum and retrieves in milliseconds. (C) Standard-IA has a 30-day minimum."}, {"id": 2202019760, "d": "dev", "t": "s3", "q": "Objects with unpredictable access patterns should be placed in the most cost-effective tier automatically with no retrieval fees. Which class fits?", "o": ["S3 One Zone-IA with versioning", "S3 Glacier Flexible Retrieval with expedited retrieval", "S3 Standard-IA with a lifecycle rule to Glacier", "S3 Intelligent-Tiering"], "a": 3, "e": "<b>Intelligent-Tiering<\/b> moves objects between access tiers automatically based on usage patterns, without retrieval charges.", "w": "(C) That fixes the class in advance and charges retrieval fees. (A) One Zone-IA charges retrieval fees. (B) Glacier retrievals take minutes and are not automatic."}, {"id": 49758605, "d": "dev", "t": "s3", "q": "What does enabling versioning on an S3 bucket and then deleting an object (without specifying a version ID) do?", "o": ["S3 deletes all versions of the object after a 30-day waiting period", "S3 deletes the current version and the previous version becomes current", "S3 moves all versions to Glacier and removes them from the bucket listing", "S3 adds a delete marker, and older versions remain and can be restored"], "a": 3, "e": "A simple DELETE inserts a <b>delete marker<\/b>. Deleting a specific <b>version ID<\/b> permanently removes that version.", "w": "(B) A simple delete adds a marker; it does not remove a version. (A) There is no waiting period. (C) Nothing moves to Glacier without lifecycle rules."}, {"id": 224644872, "d": "dev", "t": "s3", "q": "Which requirement must be met before enabling S3 Replication between two buckets?", "o": ["Both buckets must be in the same region", "Both buckets must use SSE-S3 default encryption", "Versioning must be enabled on both buckets", "Both buckets must use the same storage class"], "a": 2, "e": "<b>Replication<\/b> (CRR/SRR) requires versioning on source and destination, an IAM role for S3, and only replicates new objects (use Batch Replication for existing ones).", "w": "(A) Cross-region replication connects different regions. (D) The storage class of the destination can differ. (B) Encryption settings are not a prerequisite."}, {"id": 1928472759, "d": "dev", "t": "cli-sdk", "q": "In which order does the AWS CLI/SDK typically look for credentials?", "o": ["Environment variables, command-line options, instance profile, container credentials, then shared credentials files", "Shared credentials files, environment variables, command-line options, instance profile, then container credentials", "Instance profile, container credentials, shared credentials files, environment variables, then command-line options", "Command-line options, environment variables, shared credentials files, container credentials, then the instance profile"], "a": 3, "e": "Explicit settings win over environment variables, then profile files, then container/instance role credentials - the same code works locally and on AWS.", "w": "(C) That is the reverse order. (A) Command-line options come first and the instance profile last. (B) Command-line options come first, then environment variables."}, {"id": 2573832099, "d": "sec", "t": "iam", "q": "What is the correct description of IAM policy evaluation when two policies conflict?", "o": ["The policy with the longest list of actions decides the result", "The policy that was attached last decides the result", "An Allow in an identity policy overrides a Deny in a resource policy", "An explicit Deny overrides every Allow; without an Allow the request is denied"], "a": 3, "e": "Default is <b>implicit deny<\/b>; an <b>explicit Deny<\/b> beats everything; an Allow is needed (and not overridden) for access.", "w": "(B) Attachment order does not matter. (C) A Deny wins in every case. (A) The number of actions has no effect."}, {"id": 2093804509, "d": "sec", "t": "iam", "q": "Which identity should be used to give an application running on EC2 access to AWS services?", "o": ["The access keys of the root user stored in the AWS CLI profile", "The access keys of an IAM user stored in an environment file on the instance", "An IAM role attached to the instance through an instance profile", "A security group that allows the instance to call AWS services"], "a": 2, "e": "Roles give <b>temporary credentials<\/b> that rotate automatically. Never embed long-term keys.", "w": "(B) Long-term keys can leak. (A) The root user must not be used for applications. (D) Security groups filter network traffic; they do not authorize API calls."}], "C": [{"id": 1994124408, "t": "lambda", "f": "Lambda: how does CPU power scale?", "b": "With the memory setting: about 1 vCPU at 1,769 MB, up to 6 vCPUs at 10 GB."}, {"id": 2588913219, "t": "lambda", "f": "Lambda: where do you create SDK clients and DB connections?", "b": "Outside the handler, so warm invocations reuse them."}, {"id": 2280229613, "t": "lambda", "f": "Lambda: what happens on errors for sync vs async invocations?", "b": "Sync: the error goes back to the caller. Async: Lambda retries twice, then sends the event to a DLQ or destination."}, {"id": 212337492, "t": "lambda", "f": "Lambda: what blocks a Kinesis shard, and what helps?", "b": "A failing batch is retried until it succeeds or expires. Use bisect on error, max retries and an on-failure destination."}, {"id": 2730938635, "t": "lambda", "f": "Lambda with SQS: how long should the visibility timeout be?", "b": "At least 6 times the function timeout."}, {"id": 1829203730, "t": "lambda", "f": "Lambda: reserved vs provisioned concurrency", "b": "Reserved guarantees and caps capacity. Provisioned pre-warms environments to avoid cold starts (and costs money)."}, {"id": 351727801, "t": "lambda", "f": "Lambda: how do you shift traffic between two versions?", "b": "An alias with a weighted routing configuration (CodeDeploy can automate canary or linear shifts)."}, {"id": 1227796221, "t": "lambda", "f": "Lambda in a VPC: how does it reach the internet or AWS APIs?", "b": "Through a NAT gateway, or VPC endpoints for AWS services."}, {"id": 3934468324, "t": "dynamodb", "f": "DynamoDB: RCU for strongly consistent reads of 6 KB items, 10 per second?", "b": "20 RCU: 6 KB rounds up to 8 KB = 2 units per read."}, {"id": 3957843869, "t": "dynamodb", "f": "DynamoDB: WCU for 2.5 KB writes, 5 per second?", "b": "15 WCU: 2.5 KB rounds up to 3 KB = 3 units per write."}, {"id": 3309931713, "t": "dynamodb", "f": "DynamoDB: how much does an eventually consistent read cost?", "b": "Half of a strongly consistent read: one RCU reads 8 KB per second."}, {"id": 1563520057, "t": "dynamodb", "f": "DynamoDB: Query vs Scan", "b": "Query reads one partition key (cheap). Scan reads the whole table (expensive, filters apply after reading)."}, {"id": 3226522159, "t": "dynamodb", "f": "DynamoDB: does FilterExpression reduce consumed RCUs?", "b": "No. It filters after the items are read."}, {"id": 2714313404, "t": "dynamodb", "f": "DynamoDB: effect of a throttled GSI", "b": "It also throttles writes to the base table."}, {"id": 3886187666, "t": "dynamodb", "f": "DynamoDB: when can an LSI be created?", "b": "Only together with the table. A GSI can be added any time."}, {"id": 837735837, "t": "dynamodb", "f": "DynamoDB: how to do optimistic locking?", "b": "A version attribute plus a ConditionExpression that checks it."}, {"id": 2576495815, "t": "s3", "f": "S3: how do you enforce HTTPS?", "b": "A bucket policy that denies requests when aws:SecureTransport is false."}, {"id": 1064304173, "t": "s3", "f": "S3: who can enable MFA Delete?", "b": "Only the root user, on a versioned bucket."}, {"id": 866873627, "t": "s3", "f": "S3: what does replication require, and what does it copy?", "b": "Versioning on both buckets; only new objects (Batch Replication copies existing ones)."}, {"id": 96563812, "t": "s3", "f": "S3: how do you avoid hitting KMS limits with SSE-KMS?", "b": "Enable S3 Bucket Keys."}, {"id": 179442886, "t": "iam", "f": "IAM: Deny vs Allow", "b": "An explicit Deny always wins; without an Allow the default is deny."}, {"id": 2973277276, "t": "iam", "f": "IAM: what does iam:PassRole control?", "b": "Who may hand a role to a service such as Lambda or EC2. Scope it to specific role ARNs."}, {"id": 3255385519, "t": "iam", "f": "IAM: permissions boundary vs SCP", "b": "A boundary limits one user or role. An SCP limits whole accounts. Neither grants permissions."}, {"id": 3283716741, "t": "security", "f": "KMS: how much data can Encrypt handle?", "b": "4 KB. Larger data uses envelope encryption with GenerateDataKey."}, {"id": 2617979442, "t": "security", "f": "KMS: does key rotation change the key ID?", "b": "No. The ID and ARN stay, and old key material is kept to decrypt old data."}, {"id": 54832273, "t": "security", "f": "Parameter Store vs Secrets Manager", "b": "Secrets Manager rotates secrets natively and integrates with RDS. Parameter Store is cheap configuration storage."}, {"id": 1179418119, "t": "security", "f": "SSM SecureString: which permissions does a reader need?", "b": "ssm:GetParameter and kms:Decrypt on the key."}, {"id": 873544075, "t": "apigw", "f": "API Gateway: what does 'Missing Authentication Token' usually mean?", "b": "A wrong path or method, so no route exists."}, {"id": 1085627642, "t": "apigw", "f": "API Gateway: are API keys authentication?", "b": "No. They meter and throttle clients via usage plans."}, {"id": 3827667462, "t": "apigw", "f": "API Gateway: what does 502 usually mean for a Lambda proxy?", "b": "The function returned an invalid response (needs statusCode, headers, string body)."}, {"id": 3055597167, "t": "cicd", "f": "Which file belongs to CodeBuild and which to CodeDeploy?", "b": "buildspec.yml is CodeBuild. appspec.yml is CodeDeploy."}, {"id": 3617724060, "t": "cicd", "f": "CodeBuild: what do Docker builds need?", "b": "Privileged mode."}, {"id": 3148890714, "t": "cicd", "f": "CodeDeploy in-place hook order", "b": "ApplicationStop, DownloadBundle, BeforeInstall, Install, AfterInstall, ApplicationStart, ValidateService."}, {"id": 1523966973, "t": "messaging", "f": "SQS DLQ: what rules apply?", "b": "Same queue type as the source, and maxReceiveCount decides when messages move."}, {"id": 2100239958, "t": "messaging", "f": "SQS FIFO: what does MessageGroupId do?", "b": "Gives strict order inside a group; different groups run in parallel."}, {"id": 2086480671, "t": "messaging", "f": "Kinesis: what is ordered?", "b": "Records within a shard, which means per partition key."}, {"id": 2646127889, "t": "cfn", "f": "CloudFormation: what can you do with ROLLBACK_COMPLETE?", "b": "Only delete the stack and create it again."}, {"id": 1123904602, "t": "cfn", "f": "CloudFormation: Ref vs GetAtt", "b": "Ref returns the primary identifier (often name or ID); GetAtt returns other attributes such as Arn."}, {"id": 3556887564, "t": "cfn", "f": "CloudFormation: which capability do custom IAM names need?", "b": "CAPABILITY_NAMED_IAM."}, {"id": 443623772, "t": "ecs", "f": "ECS: task role vs execution role", "b": "Task role = your application code. Execution role = the ECS agent pulling images, writing logs, reading secrets."}, {"id": 2984728044, "t": "elb-asg", "f": "Load balancer with a static IP?", "b": "Network Load Balancer (one static or Elastic IP per AZ)."}, {"id": 1192491140, "t": "elb-asg", "f": "Cross-zone load balancing defaults", "b": "ALB: on (free). NLB and GWLB: off (inter-AZ charges when enabled)."}, {"id": 4059419533, "t": "rds", "f": "RDS Multi-AZ: what is it for?", "b": "Availability and failover, not read scaling."}, {"id": 1673840806, "t": "rds", "f": "RDS Proxy: why use it with Lambda?", "b": "It pools connections so many short-lived functions do not exhaust the database."}, {"id": 2444145294, "t": "vpc", "f": "Where does a NAT gateway live?", "b": "In a public subnet, with a route from the private subnets."}, {"id": 988130350, "t": "vpc", "f": "Which services have gateway VPC endpoints?", "b": "S3 and DynamoDB (free)."}, {"id": 3535938318, "t": "cloudfront", "f": "In which region must a CloudFront certificate be?", "b": "us-east-1."}, {"id": 433040094, "t": "cognito", "f": "Which Cognito token is never sent to your API?", "b": "The refresh token."}, {"id": 2985122188, "t": "stepfunctions", "f": "Step Functions: how to pause for a human approval?", "b": "Wait for a callback with a task token (.waitForTaskToken)."}, {"id": 933494796, "t": "monitoring", "f": "X-Ray: annotations vs metadata", "b": "Annotations are indexed and searchable; metadata is not."}, {"id": 2162311789, "t": "monitoring", "f": "X-Ray: default sampling rule", "b": "One request per second plus 5% of additional requests."}, {"id": 2496965573, "t": "beanstalk", "f": "Where do .ebextensions files live?", "b": "In the source bundle, in a .ebextensions folder."}, {"id": 2945299325, "t": "cdk", "f": "CDK: what does cdk bootstrap do?", "b": "Prepares an account and region once with the CDKToolkit stack (S3 bucket, ECR repository, roles)."}, {"id": 1042157142, "t": "sam", "f": "SAM: what does the Transform line do?", "b": "Marks the template as SAM, which CloudFormation expands into standard resources."}, {"id": 1942369595, "t": "exam", "f": "Keyword to service: reduce read latency / cache", "b": "DAX, ElastiCache, CloudFront, API Gateway cache"}, {"id": 2106838823, "t": "exam", "f": "Keyword to service: decouple, buffer spikes", "b": "SQS"}, {"id": 3563934474, "t": "exam", "f": "Keyword to service: fan-out to many consumers", "b": "SNS (+ SQS queues)"}, {"id": 1803643157, "t": "exam", "f": "Keyword to service: ordering", "b": "SQS FIFO, Kinesis (per shard)"}, {"id": 72716224, "t": "exam", "f": "Keyword to service: replay events, many consumers", "b": "Kinesis Data Streams"}, {"id": 3442873764, "t": "exam", "f": "Keyword to service: rotate secrets", "b": "Secrets Manager"}, {"id": 479930810, "t": "exam", "f": "Keyword to service: config values, free", "b"
