ields, wrong types) before invoking the backend Lambda, to save invocation cost. What feature accomplishes this?", "o": ["A usage plan with a request quota that rejects calls once the number of invalid requests grows", "A request validator with a JSON Schema model on the method, so invalid calls get a 400 before the backend runs", "A Lambda authorizer that checks the request body and returns a deny policy for malformed payloads", "A mapping template on the integration request that throws an error whenever a required field is missing"], "a": 1, "e": "API Gateway supports built-in <b>Request Validators<\/b>: attach a JSON Schema model to a method and set validation to check the body, required parameters, or both. Invalid requests are rejected with a 400 response before the Lambda integration is ever invoked, saving cost and simplifying the backend code.", "w": "(C) Authorizers decide access; validating payload shape is the job of request validators. (A) Usage plans limit rates and quotas, not content. (D) Mapping templates transform data; validation uses models and validators."}, {"id": 2846455174, "d": "dev", "t": null, "q": "A Lambda function suddenly starts throwing `TooManyRequestsException` under load, even though the account-level concurrency limit has not been reached. What is a likely cause?", "o": ["The function has reserved concurrency, which caps it, and that cap is reached", "The function has provisioned concurrency, which stops accepting new requests once it is fully used", "The event source mapping batch size is too large, so Lambda rejects the extra records", "Lambda throttles each function to 1,000 requests per second regardless of the account limit"], "a": 0, "e": "Setting <b>Reserved Concurrency<\/b> on a function both guarantees it a slice of the account's concurrency pool and caps it at that same number — once that cap is hit, further invocations are throttled with `TooManyRequestsException`, independent of the account-wide unreserved pool.", "w": "(B) Provisioned concurrency pre-warms environments; excess requests use on-demand capacity. (D) Lambda scales by concurrency, not by a fixed per-function request rate of that size. (C) Batch size changes how many records are passed per invocation, not whether it is throttled."}, {"id": 3134909148, "d": "dev", "t": null, "q": "What is the purpose of Lambda Destinations, introduced as an alternative to handling errors manually inside asynchronous invocations?", "o": ["They send the result of an asynchronous invocation, success or failure, to SQS, SNS, Lambda or EventBridge", "They send the response of a synchronous invocation to a second function to be post-processed", "They retry failed asynchronous invocations until they succeed and then discard the event", "They configure which other functions may invoke this function, replacing the resource-based policy"], "a": 0, "e": "<b>Destinations<\/b> can be configured separately for the OnSuccess and OnFailure outcomes of an asynchronous invocation, automatically sending the invocation record (including payload and error info) to SQS, SNS, another Lambda function, or EventBridge — removing the need to build custom dead-letter handling logic inside the function.", "w": "(B) Synchronous responses go back to the caller; destinations apply to asynchronous invocations. (D) Who may invoke a function is set in its resource-based policy. (C) Lambda retries a limited number of times, then sends the event to the destination."}, {"id": 2000404509, "d": "dev", "t": null, "q": "A Step Functions workflow needs to run for a few seconds, at very high volume (thousands of executions per second), primarily to orchestrate a short data-processing pipeline. Which Step Functions workflow type is most appropriate?", "o": ["Express: it is the only type that can run for up to one year without extra configuration", "Express: it suits short, high-volume workloads and is billed by executions and duration", "Standard: it supports up to 100,000 executions per second and is billed by state transitions", "Standard: it offers at-least-once execution, which is required for very high throughput"], "a": 1, "e": "<b>Express workflows<\/b> are designed for high-volume, short-duration (up to 5 minutes) executions, billed by number of executions, duration, and memory, with at-least-once execution semantics — ideal for high-throughput event-processing pipelines. <b>Standard workflows<\/b> support long-running (up to 1 year), exactly-once executions with a visual execution history, but at higher cost for high-volume scenarios.", "w": "(C) Standard has lower start rates and is billed per transition, so it costs more at this volume. (D) Standard offers exactly-once execution. (A) Express runs for at most 5 minutes; Standard can run for a year."}, {"id": 872303032, "d": "dev", "t": null, "q": "In a Step Functions state machine definition (Amazon States Language), which fields let you handle a Lambda invocation failure by retrying with backoff and then falling back to an alternate state?", "o": ["`ResultPath` with `OutputPath` to retry the task and route the output to a fallback state", "`Choice` with `Wait` to loop back to the task and eventually continue with another branch", "`TimeoutSeconds` with `HeartbeatSeconds` to retry and then switch to the fallback state automatically", "`Retry` with `IntervalSeconds`, `BackoffRate` and `MaxAttempts`, followed by `Catch` with `Next` for the fallback state"], "a": 3, "e": "A Task state supports a `Retry` array to automatically retry on specific errors with exponential backoff, and a `Catch` array to route execution to a designated fallback state after all retries are exhausted (or immediately, if configured) — this is the standard way to build resilient error handling directly into a state machine.", "w": "(A) Those fields shape input and output. (C) Timeouts detect a stuck task but do not retry or fall back. (B) A Choice loop can work but is not the built-in error handling that Retry and Catch provide."}, {"id": 4173876844, "d": "dev", "t": null, "q": "An SQS consumer uses short polling by default and observes high empty-response rates along with unnecessary cost. What change reduces this?", "o": ["Increase the `DelaySeconds` of the queue so that messages are available when the consumer polls", "Convert the standard queue to a FIFO queue, which always uses long polling", "Reduce `VisibilityTimeout` to 0 so that messages are returned immediately instead of empty responses", "Set `ReceiveMessageWaitTimeSeconds` to a value up to 20, so a receive call waits for messages"], "a": 3, "e": "<b>Long polling<\/b> (`ReceiveMessageWaitTimeSeconds` > 0, up to 20s) makes `ReceiveMessage` wait for a message to become available (or until the wait time elapses) instead of returning immediately with an empty result — this reduces the number of empty responses and lowers the number of billed requests compared to short polling.", "w": "(C) Visibility timeout controls how long a received message stays hidden. (A) Delay hides new messages from consumers, which creates more empty responses. (B) Polling mode is independent of the queue type."}, {"id": 2830229617, "d": "dev", "t": null, "q": "An SNS topic needs to deliver only messages with a `orderType` attribute equal to `\"priority\"` to a specific SQS subscriber, while other subscribers should still receive every message. What SNS feature enables this?", "o": ["A topic access policy with a condition that allows delivery only for `orderType` equal to `priority`", "A subscription filter policy on that subscription that matches `orderType` equal to `priority`", "A FIFO topic with the order type as its message group, so the queue receives only that group", "A delivery policy on the SQS subscription that retries only messages with the `priority` attribute"], "a": 1, "e": "SNS <b>subscription filter policies<\/b> are attached to an individual subscription and are evaluated against message attributes (or optionally the message body). Only messages that match the policy are delivered to that subscriber, while other subscribers without a filter policy (or with a different one) continue to receive messages according to their own configuration.", "w": "(A) Topic policies control who may publish or subscribe, not which messages a subscriber receives. (D) Delivery policies control retries, not selection. (C) Message groups give ordering; they do not filter subscribers."}, {"id": 3431265785, "d": "dev", "t": null, "q": "A serverless application needs sub-millisecond read latency for a DynamoDB table that is read far more often than it is written. Which AWS service is purpose-built to add this caching layer with minimal code changes?", "o": ["Amazon DynamoDB Accelerator (DAX), an in-memory cache that works with the DynamoDB API through its client", "A global secondary index on the most frequently read attributes to reach microsecond reads", "Amazon ElastiCache for Redis, which DynamoDB uses automatically as a transparent read cache", "DynamoDB on-demand mode, which caches recently read items to reduce read latency"], "a": 0, "e": "<b>DAX<\/b> is a fully managed, in-memory caching layer specifically designed for DynamoDB, delivering microsecond latency for cached reads. It's API-compatible with DynamoDB, so applications typically only need to swap the client (DAX client) rather than rewrite data-access logic.", "w": "(C) DynamoDB has no built-in connection to ElastiCache; applications add that cache themselves. (B) Indexes provide other access patterns, not microsecond latency. (D) On-demand mode changes billing and scaling, not latency."}, {"id": 3117129210, "d": "dev", "t": null, "q": "What is the primary benefit of AWS Lambda SnapStart for supported runtimes (e.g. Java)?", "o": ["It caches function results between invocations, so repeated requests skip the handler completely", "It raises the timeout above 15 minutes for functions that are restored from a snapshot", "It keeps a set number of environments initialized at all times, which you pay for while they idle", "It restores new execution environments from an initialized snapshot, which shortens cold starts"], "a": 3, "e": "<b>SnapStart<\/b> initializes the function once at publish time, takes an encrypted snapshot of the initialized execution environment (memory and disk state), and reuses that snapshot to resume new execution environments on cold start — this can dramatically cut cold-start latency for runtimes with heavy initialization (e.g. JVM startup), without the ongoing cost of Provisioned Concurrency.", "w": "(C) That describes provisioned concurrency. (A) SnapStart does not cache results. (B) The 15-minute limit does not change."}, {"id": 1189449899, "d": "dev", "t": null, "q": "An EventBridge rule needs to invoke a target Lambda function every day at 6:00 AM UTC. Which rule configuration is correct?", "o": ["A CloudWatch alarm on the function's `Invocations` metric that starts the function at 06:00 UTC", "An event pattern rule that matches `detail-type` `Scheduled Event` and sets a daily time in the pattern", "A scheduled rule with the expression `cron(0 6 * * ? *)` and the Lambda function as target", "A rule with the schedule expression `rate(6 hours)`, which runs at 06:00 UTC each day"], "a": 2, "e": "EventBridge (and CloudWatch Events before it) supports <b>schedule expressions<\/b>: either `rate(...)` for fixed intervals or `cron(...)` for calendar-based schedules, such as `cron(0 6 * * ? *)` for daily at 06:00 UTC. The rule's target is set to the Lambda function, and EventBridge needs permission (resource policy) to invoke it.", "w": "(B) Time-based triggers use schedule expressions; patterns match events, not clock times. (D) A rate expression runs at fixed intervals from when the rule is created, not at a clock time. (A) Alarms react to metrics; they do not run on a schedule."}, {"id": 177064079, "d": "dev", "t": null, "q": "When configuring a Lambda event source mapping for a Kinesis Data Stream, which setting controls how a batch of records is grouped based on time before invoking the function, even if the batch size hasn't been reached?", "o": ["`MaximumBatchingWindowInSeconds`, which sets how long Lambda collects records before invoking", "`StartingPosition`, which sets how many seconds of records Lambda accumulates before it invokes", "`MaximumRecordAgeInSeconds`, which sets how long Lambda waits to fill a batch before invoking", "`ParallelizationFactor`, which sets how long Lambda waits to collect records from each shard"], "a": 0, "e": "`MaximumBatchingWindowInSeconds` sets an upper bound on how long the event source mapping waits to accumulate records up to `BatchSize` before invoking the function anyway — useful for balancing latency versus batch efficiency when record arrival is sporadic.", "w": "(D) ParallelizationFactor controls concurrent batches per shard. (C) Maximum record age discards records that are too old. (B) StartingPosition chooses where reading begins."}, {"id": 155452316, "d": "dev", "t": null, "q": "A team wants to break a large CloudFormation template into reusable, independently versioned components (e.g. a shared networking stack referenced by multiple application stacks). What CloudFormation feature supports this?", "o": ["Change sets: a template is divided into reviewable parts, each applied independently to the stack", "StackSets: one template is split into several stack instances, each with its own part of the resources", "Macros: a template is split into snippets that are merged into one stack by the Transform section", "Nested stacks: a parent template includes child stacks with `AWS::CloudFormation::Stack` and passes outputs on"], "a": 3, "e": "<b>Nested stacks<\/b> let a parent template include child stacks via `AWS::CloudFormation::Stack` resources, pointing at child template URLs. Outputs from a child stack (e.g. a VPC ID from a shared networking stack) can be passed as parameters into sibling stacks, enabling reuse and separation of concerns across a large infrastructure.", "w": "(B) StackSets deploy the same template to many accounts and regions. (A) Change sets preview updates to one stack. (C) Macros transform template syntax; they are not a way to compose independent stacks."}, {"id": 3481379035, "d": "dev", "t": null, "q": "A developer is iterating locally on a SAM-based Lambda function and wants to invoke it with a test event without deploying to AWS each time. Which SAM CLI command supports this?", "o": ["`sam validate`, which runs the function once with the event file to check the template", "`sam sync --watch`, which runs the function locally and updates it whenever the code changes", "`sam local invoke` with an event file, which runs the function in a local Docker container", "`sam logs`, which replays an event file against the local copy of the function"], "a": 2, "e": "`sam local invoke` runs the function code inside a Docker container that emulates the actual Lambda runtime, accepting a JSON event file (`--event`) as input — this allows fast local iteration and debugging without deploying, and also supports `sam local start-api` for emulating an API Gateway-backed function locally.", "w": "(B) sam sync deploys changes to AWS. (A) sam validate only checks the template syntax. (D) sam logs reads CloudWatch Logs from a deployed function."}, {"id": 1700495393, "d": "dev", "t": null, "q": "An application needs to let end users upload large files (several GB) directly to S3 from a browser, without routing the file bytes through the application's backend servers. Which combination achieves this securely?", "o": ["Give the browser the backend's long-term IAM access keys and let the AWS SDK upload the file directly", "Create a presigned URL on the backend and let the browser upload directly, using multipart for very large files", "Make the bucket publicly writable for a short time and have the browser upload the file with a plain PUT", "Send the file through API Gateway to a Lambda function that writes it to S3 in one request"], "a": 1, "e": "A <b>presigned URL<\/b> (generated server-side using the backend's own credentials, but scoped and time-limited) grants the browser temporary permission to perform a specific S3 operation like PutObject, without exposing any real AWS credentials to the client. For very large uploads, the <b>multipart upload API<\/b> lets the browser upload the file in parts (each part can even get its own presigned URL), improving reliability and throughput.", "w": "(D) API Gateway and Lambda payload limits make this unsuitable for several GB, and it routes the bytes through your backend. (A) Long-term keys in a browser can be stolen. (C) A public bucket exposes it to anyone, not only your user."}, {"id": 3464449651, "d": "dev", "t": null, "q": "An API Gateway usage plan is configured with a rate of 100 requests/second and a burst of 200. What do these two numbers represent, based on the token bucket algorithm API Gateway uses for throttling?", "o": ["Rate limits the steady backend load; burst is the number of retries the client may send after a 429", "Rate applies per client IP address; burst applies to the whole account across every API in the region", "Rate is the steady requests per second; burst is the bucket size for short spikes above that rate", "Rate is the maximum per minute; burst is the number of requests queued while API Gateway waits for capacity"], "a": 2, "e": "API Gateway throttling is implemented with a <b>token bucket<\/b>: the steady-state <b>rate<\/b> defines how fast tokens (permits to make a request) refill per second, while the <b>burst<\/b> defines the bucket's capacity — how many requests can be made in a quick spike, consuming banked tokens, before subsequent requests are throttled with HTTP 429.", "w": "(D) Requests beyond the bucket are throttled with 429, not queued. (B) Both values apply to the usage plan or stage they are set on. (A) Burst is the capacity for concurrent requests, not a retry count."}, {"id": 3363853348, "d": "sec", "t": null, "q": "A Lambda function in Account A needs to read objects from an S3 bucket owned by Account B. What is the standard secure pattern for this cross-account access?", "o": ["Add the Lambda role to the bucket's ACL as a grantee and remove all IAM policies from the role", "Allow the Lambda's role in the bucket policy of Account B and in the role's own policy in Account A", "Allow the Lambda's role in the bucket policy of Account B only; the role in Account A needs no S3 permissions", "Share the bucket through AWS Resource Access Manager so that Account A sees it as its own bucket"], "a": 1, "e": "Cross-account resource access in AWS generally requires permission on <b>both<\/b> sides: the resource-based policy (the S3 bucket policy in Account B) must explicitly allow the principal from Account A, and the identity-based policy attached to that principal (the Lambda's role in Account A) must also allow the action. Missing either side results in access denial.", "w": "(C) For a principal in another account, both the bucket policy and the role's identity policy must allow access. (A) ACLs are legacy and the role would still need an identity policy. (D) Resource Access Manager does not share S3 buckets."}, {"id": 1608756701, "d": "sec", "t": null, "q": "What is the difference between a KMS key policy and an IAM policy when controlling access to a KMS customer managed key (CMK)?", "o": ["The key policy is always required; IAM policies only work if the key policy delegates to IAM", "The key policy applies only to AWS managed keys; customer managed keys are controlled only by IAM", "IAM policies always override the key policy for principals in the same account", "IAM policies are always sufficient; the key policy only matters for cross-account access"], "a": 0, "e": "Every KMS CMK has a resource-based <b>key policy<\/b> that is always evaluated for any access attempt. A common pattern is for the key policy to include a statement enabling IAM policies to also grant permissions (`Enable IAM User Permissions`), letting administrators manage day-to-day access via IAM instead of editing the key policy directly — but without that delegation statement, IAM policies alone are not sufficient.", "w": "(D) The key policy applies to same-account access too. (B) Key policies exist on customer managed keys; AWS managed key policies cannot be edited. (C) IAM cannot override the key policy; the key policy must allow access directly or by enabling IAM."}, {"id": 900612595, "d": "sec", "t": null, "q": "A Secrets Manager secret for an RDS MySQL database needs to rotate its password automatically every 30 days without any application downtime. What AWS-provided mechanism supports this?", "o": ["Enable rotation on the secret with a rotation Lambda function and a 30-day schedule", "Enable automatic key rotation on the KMS key that encrypts the secret, which changes the database password", "Store the password in Parameter Store and add an EventBridge rule that calls `ssm:PutParameter` monthly", "Enable rotation on the secret and attach an Auto Scaling policy that replaces the database password"], "a": 0, "e": "Secrets Manager supports <b>automatic rotation<\/b>: you enable a rotation schedule and attach a rotation Lambda function (AWS provides ready-made templates for RDS, Redshift, DocumentDB, etc.) that performs the standard four-step rotation (createSecret, setSecret, testSecret, finishSecret), updating the database password and the secret value together without requiring application downtime, since the app always fetches the current secret value at runtime.", "w": "(D) Auto Scaling does not manage passwords. (C) That needs custom code to change the database password too, which Secrets Manager rotation provides. (B) KMS rotation changes the encryption key material; it does not change the database password."}, {"id": 1426998838, "d": "sec", "t": null, "q": "Amazon GuardDuty is enabled in an AWS account. What is its primary function?", "o": ["It discovers sensitive data such as personal information in S3 buckets using pattern matching", "It scans EC2 instances and container images for software vulnerabilities and missing patches", "It records configuration changes of resources and checks them against compliance rules", "It analyzes CloudTrail, VPC Flow Logs and DNS logs to detect suspicious activity such as unusual API calls"], "a": 3, "e": "<b>GuardDuty<\/b> is a managed threat-detection service that continuously analyzes multiple data sources (VPC Flow Logs, DNS query logs, CloudTrail management and S3 data events, and optionally EKS audit logs) using threat intelligence and machine learning to generate findings about suspicious activity, such as compromised credentials or communication with known command-and-control servers.", "w": "(B) That is Amazon Inspector. (A) That is Amazon Macie. (C) That is AWS Config."}, {"id": 1446035917, "d": "sec", "t": null, "q": "IAM Access Analyzer flags an S3 bucket policy as granting access to an external entity. What is the primary purpose of this tool?", "o": ["It checks IAM users for missing MFA and unused access keys and rotates the keys automatically", "It scans S3 objects for sensitive data and blocks public access when it finds any", "It finds resources shared with principals outside your account or organization, such as buckets and roles", "It analyzes network paths between VPC resources to find unintended connectivity"], "a": 2, "e": "IAM <b>Access Analyzer<\/b> uses mathematical (automated reasoning) analysis of resource policies to identify resources accessible from outside a defined zone of trust (an account or organization), surfacing findings so administrators can review and, if unintended, remediate overly permissive access — it does not take destructive action automatically.", "w": "(A) Credential reports and access advisor cover unused keys; Access Analyzer does not rotate keys. (D) That describes VPC Reachability Analyzer. (B) That is Macie; Access Analyzer evaluates policies, not object contents."}, {"id": 150690915, "d": "sec", "t": null, "q": "An S3 bucket policy needs to deny any request that is not made over HTTPS, to enforce encryption in transit. Which policy condition achieves this?", "o": ["Allow `s3:*` only when the request header `x-amz-protocol` equals `https`", "Deny `s3:*` when the condition `aws:SecureTransport` is `false`", "Deny `s3:*` when `s3:x-amz-server-side-encryption` is missing, which forces clients to use TLS", "Enable Block Public Access, which rejects every request that is not sent over HTTPS"], "a": 1, "e": "A standard pattern to enforce encryption in transit is a bucket policy statement that explicitly <b>denies<\/b> access when `aws:SecureTransport` is `false` — meaning the request was not made over HTTPS. This is enforced at the S3 service level regardless of how clients connect.", "w": "(A) There is no such header condition; use aws:SecureTransport. (C) The encryption header relates to encryption at rest, not to the transport. (D) Block Public Access controls public access, not the protocol."}, {"id": 2043140383, "d": "sec", "t": null, "q": "A company wants centralized, federated sign-in for AWS accounts across an entire AWS Organization, using their existing corporate identity provider (e.g. Azure AD or Okta), with users assuming roles in multiple accounts without separate IAM users in each. What service is designed for this?", "o": ["Cognito Identity Pools, which exchange the corporate tokens for roles in each member account", "AWS Directory Service for Microsoft AD, which creates one IAM user per directory user in each account", "IAM Identity Center, which connects to the corporate identity provider and assigns permission sets to accounts", "AWS Organizations with an SCP that enables sign-in with the corporate identity provider in each account"], "a": 2, "e": "<b>IAM Identity Center<\/b> is purpose-built for centralized workforce identity: it connects to an external IdP (via SAML 2.0 and optionally SCIM for user/group provisioning), and administrators define permission sets that map to IAM roles automatically created in each member account of the Organization — users sign in once and can switch between authorized accounts/roles.", "w": "(A) Identity Pools are for application users, not for workforce access to AWS accounts. (B) Directory Service provides a directory but does not create IAM users. (D) SCPs restrict permissions; they do not configure sign-in."}, {"id": 915588871, "d": "sec", "t": null, "q": "A Lambda function needs temporary access to resources in a different AWS account by assuming a role there. Which AWS STS API call is used, and what must be configured on the target role?", "o": ["`sts:AssumeRole`, with a resource policy on the Lambda function that names the target account", "`sts:GetSessionToken`, with a trust policy on the target role that names the calling role or account", "`sts:AssumeRole`, with a trust policy on the target role that names the calling role or account", "`sts:AssumeRoleWithWebIdentity`, with a trust policy on the target role that names the Lambda service"], "a": 2, "e": "Cross-account role assumption uses `sts:AssumeRole`. The target role must have a <b>trust policy<\/b> (its resource-based policy) that lists the calling account or specific principal as a trusted entity allowed to assume it; the calling principal also needs `sts:AssumeRole` permission on that role's ARN in its own identity policy.", "w": "(B) GetSessionToken returns credentials for the same identity, not for a different role. (D) Web identity is for tokens from external identity providers. (A) The trust policy belongs to the target role; a Lambda resource policy controls who may invoke the function."}, {"id": 15360116, "d": "sec", "t": null, "q": "What is the main security benefit of using a VPC endpoint (interface or gateway) for services like S3, DynamoDB, or Secrets Manager, compared to accessing them over the public internet?", "o": ["IAM policies are no longer evaluated for requests that arrive through the endpoint", "Traffic is encrypted end to end with keys managed by the endpoint, even if the service uses plain HTTP", "Traffic stays on the AWS network, and an endpoint policy can limit which resources and actions are allowed", "The endpoint gives instances a public IP address, which they use to reach the service from the private subnet"], "a": 2, "e": "A VPC endpoint provides private connectivity between a VPC and a supported AWS service, keeping traffic off the public internet (improving both security posture and, for gateway endpoints, avoiding NAT Gateway data-processing charges). An <b>endpoint policy<\/b> can further restrict which resources or actions are permitted through that specific endpoint, adding a layer of defense in depth beyond regular IAM policies.", "w": "(B) Endpoints keep traffic private; encryption depends on the protocol (TLS) the client uses. (A) IAM is still evaluated, together with the endpoint policy. (D) Endpoints use private addresses, route table entries or ENIs; no public IP is involved."}, {"id": 3697436410, "d": "sec", "t": null, "q": "An application stores non-sensitive configuration values (like a feature flag) as well as a database password. Which combination of Parameter Store and Secrets Manager usage best matches AWS guidance and cost efficiency?", "o": ["Use AppConfig for both, because it stores secrets and rotates them with deployment strategies", "Use Parameter Store for configuration values and Secrets Manager for the password that needs rotation", "Use Parameter Store for both, because it supports rotation with SecureString parameters", "Use Secrets Manager for both, because Parameter Store cannot encrypt values"], "a": 1, "e": "Parameter Store's Standard tier is free and well suited to general configuration data (including `SecureString` values for lighter secrets), while Secrets Manager adds built-in automatic rotation workflows, cross-account resource policies, and tighter integration with rotation Lambda templates — making it the better fit specifically for credentials like database passwords, at a per-secret cost.", "w": "(D) Parameter Store supports SecureString encryption with KMS. (C) Parameter Store has no built-in rotation. (A) AppConfig manages configuration and feature flags; it does not rotate secrets."}, {"id": 979573469, "d": "sec", "t": null, "q": "A DynamoDB table stores sensitive customer data and must be encrypted at rest with a customer-managed KMS key (not the AWS owned default key), so the security team can audit key usage and control access via key policy. What setting achieves this?", "o": ["Encrypt items in the application with the AWS Encryption SDK, because tables support only the AWS owned key", "Enable default SSE-KMS encryption on the S3 bucket that DynamoDB uses to store the table", "Create a KMS grant for DynamoDB and enable encryption in transit, which switches the table to your key", "Choose a customer managed KMS key in the table's encryption settings instead of the AWS owned key"], "a": 3, "e": "DynamoDB encryption at rest can use the AWS owned key (default, no cost, no visibility into key usage), an AWS managed key (`aws/dynamodb`, visible in KMS, no cost for key usage within limits), or a <b>customer managed key<\/b> (full control over key policy, rotation, and detailed CloudTrail auditing of every key usage) — table-level setting chosen at creation or via encryption update.", "w": "(B) DynamoDB does not store tables in an S3 bucket that you manage. (A) Tables support AWS owned, AWS managed and customer managed keys. (C) Encryption in transit does not change the at-rest key."}, {"id": 1606928491, "d": "sec", "t": null, "q": "What is the difference in how Security Groups and Network ACLs (NACLs) evaluate rules, and why does this matter when troubleshooting connectivity in a VPC?", "o": ["Security groups only allow and evaluate all rules; NACLs allow or deny and stop at the first matching rule number", "Security groups evaluate rules by number and stop at the first match; NACLs evaluate all rules together", "Security groups allow or deny and are stateless; NACLs only allow and are stateful", "Both evaluate all rules together; only NACLs are stateful, so return traffic needs no rule"], "a": 0, "e": "Security Groups only allow (never deny) and are stateful, evaluating all attached rules together. NACLs support explicit Allow AND Deny rules, are stateless (so both inbound and outbound rules are needed for a full round trip), and are evaluated in ascending rule-number order, stopping at the first match — a lower-numbered Deny rule can block traffic even if a higher-numbered rule would have allowed it, a common source of subtle connectivity bugs.", "w": "(B) It is the reverse. (C) Security groups only allow and are stateful; NACLs allow and deny and are stateless. (D) NACLs are stateless; return traffic needs an explicit rule."}, {"id": 3263297861, "d": "sec", "t": null, "q": "A web application behind an Application Load Balancer needs protection against common web exploits like SQL injection and cross-site scripting, as well as basic rate limiting for specific URLs. Which AWS service is purpose-built for this?", "o": ["AWS Shield Advanced on the ALB, which inspects requests for SQL injection and cross-site scripting", "AWS WAF on the ALB with managed rule groups and a rate-based rule", "A network ACL on the ALB subnets with deny rules for known attack patterns and a connection limit", "Amazon GuardDuty with an automatic response that blocks IP addresses that send malicious requests"], "a": 1, "e": "<b>AWS WAF<\/b> operates at the application layer and can be attached to an ALB, CloudFront distribution, or API Gateway, inspecting HTTP(S) requests against rules — including AWS Managed Rule Groups for common exploits (SQLi, XSS) and rate-based rules to throttle abusive clients by IP within a time window.", "w": "(A) Shield protects against DDoS; request inspection and rate rules are WAF features. (C) NACLs filter by IP, protocol and port, not by request content. (D) GuardDuty detects threats from logs; it does not filter requests."}, {"id": 2816439692, "d": "sec", "t": null, "q": "An IAM policy uses the condition key `aws:MultiFactorAuthPresent` set to `true` on a Deny statement combined with `Bool` and negation, to require MFA for sensitive actions like deleting an S3 bucket. What does this pattern typically enforce?", "o": ["It denies the sensitive actions to every user who has an MFA device registered", "It denies the sensitive actions unless the session was authenticated with MFA", "It forces every IAM user in the account to register an MFA device before they can sign in", "It allows the sensitive actions only for the root user, because root always uses MFA"], "a": 1, "e": "A common security pattern is: `\"Effect\": \"Deny\"`, target the sensitive actions, with condition `\"BoolIfExists\": {\"aws:MultiFactorAuthPresent\": \"false\"}` (or `Null` check for the condition key's absence) — this denies the action unless the caller's session was authenticated with MFA, effectively requiring MFA for that specific set of sensitive operations without disabling them for everyone.", "w": "(C) The condition checks the current session; it does not enforce registration. (A) Users with MFA can perform the actions once they sign in with it. (D) The policy applies to the principals it is attached to; root is not special here."}, {"id": 2688748561, "d": "dep", "t": null, "q": "A CodePipeline needs a manual gate before deploying to production, where a designated approver reviews the build and explicitly approves or rejects the deployment. Which CodePipeline feature provides this?", "o": ["A CodeBuild phase named `approval` in the buildspec that waits for a reviewer to answer", "A manual approval action placed before the deploy stage, optionally notifying reviewers through SNS", "A CloudWatch alarm action that pauses the pipeline until a reviewer resets the alarm", "A CodeDeploy deployment group setting that holds the deployment until an administrator confirms it"], "a": 1, "e": "CodePipeline supports a built-in <b>Manual Approval<\/b> action type that can be placed in any stage. When execution reaches it, the pipeline pauses and (optionally, via an SNS topic) notifies reviewers; an authorized principal must explicitly approve or reject the transition via the console or API before the pipeline proceeds or stops.", "w": "(A) Buildspec phases are install, pre_build, build and post_build. (C) Alarms can roll back deployments but do not pause pipelines for a human decision. (D) CodeDeploy has no manual confirmation setting; approvals belong to CodePipeline."}, {"id": 3036342608, "d": "dep", "t": null, "q": "A CodeBuild project frequently rebuilds the same dependencies (e.g. npm packages) from scratch on every build, slowing down builds significantly. What CodeBuild feature reduces this?", "o": ["Enable artifact encryption, which stores intermediate build files and reuses them next time", "Enable caching and list the dependency folder under `cache` paths in the buildspec", "Increase the build timeout, because dependency installs that run longer are cached afterward", "Increase the compute type, because larger build environments keep dependencies between builds"], "a": 1, "e": "CodeBuild supports <b>caching<\/b>: either S3-based caching that persists specified paths (declared under `cache` in the buildspec) between build runs, or local caching (source cache, Docker layer cache, or custom cache) stored directly on the build host for faster access — both significantly reduce redundant dependency downloads/installs across builds.", "w": "(D) Build environments are fresh for every build; bigger ones are faster but keep nothing. (C) A longer timeout only allows more time; nothing is cached. (A) Encryption protects artifacts and has nothing to do with reuse."}, {"id": 2600872641, "d": "dep", "t": null, "q": "A team wants to host private, versioned npm and Maven packages that their CI/CD pipeline can consume, similar to a private package registry, fully managed by AWS. Which service fits this need?", "o": ["Amazon S3 with versioning, which npm and Maven clients can use directly as a package registry", "Amazon ECR, which stores npm and Maven packages in repositories next to container images", "AWS CodeCommit, which stores built packages as versioned files in a Git repository", "AWS CodeArtifact, which hosts npm and Maven packages and can proxy public registries"], "a": 3, "e": "<b>CodeArtifact<\/b> is a managed artifact repository supporting standard package manager formats (npm, pip, Maven/Gradle, NuGet), integrating directly with those tools' native clients. It also supports configuring upstream repositories, effectively proxying and caching packages from public registries like npmjs or Maven Central.", "w": "(B) ECR stores container images, not npm or Maven packages. (C) CodeCommit stores source code, not packages that package managers can install. (A) Package managers need a registry protocol that S3 does not provide."}, {"id": 4126414004, "d": "dep", "t": null, "q": "A CodePipeline source stage needs to trigger automatically whenever code is pushed to a GitHub repository (not CodeCommit). What is the recommended modern way to connect CodePipeline to GitHub?", "o": ["A CodeCommit repository mirror created with `git clone --mirror` that CodePipeline reads instead", "An S3 source action that polls a bucket where a GitHub Action uploads the repository as a zip file", "An AWS CodeConnections (CodeStar) connection that installs the GitHub app and starts the pipeline on pushes", "A personal access token in the pipeline definition with a `cron` expression that polls GitHub hourly"], "a": 2, "e": "The modern, recommended approach is an AWS <b>Connection<\/b> (via CodeStar Connections), which installs a GitHub App granting CodePipeline secure, scoped access to specified repositories without managing long-lived personal access tokens directly, and supports triggering pipeline executions on push/PR events.", "w": "(B) That is a workaround and not the recommended way. (A) Mirroring must be repeated manually; connections are the supported way. (D) Tokens in definitions are a security risk, and polling delays the trigger."}, {"id": 3222462324, "d": "dep", "t": null, "q": "An ECS service running on Fargate needs to automatically scale the number of tasks based on average CPU utilization. Which AWS feature provides this?", "o": ["Fargate scales the number of tasks automatically; no configuration is needed beyond the task size", "An EC2 Auto Scaling group with a CPU target tracking policy attached to the Fargate tasks", "A CloudWatch alarm that calls `ecs:RunTask` whenever the cluster CPU rises above a threshold", "Application Auto Scaling with target tracking on `ECSServiceAverageCPUUtilization`"], "a": 3, "e": "<b>Application Auto Scaling<\/b> integrates with ECS services (regardless of launch type — EC2 or Fargate) to scale the desired task count using target-tracking, step, or scheduled scaling policies. A common target-tracking setup uses the `ECSServiceAverageCPUUtilization` (or memory) predefined metric to maintain a target utilization automatically.", "w": "(B) Fargate has no instances for an EC2 Auto Scaling group. (C) RunTask starts one-off tasks; service scaling uses Application Auto Scaling. (A) Fargate does not change the desired task count by itself."}, {"id": 3403362192, "d": "dep", "t": null, "q": "In an ECS task definition, what is the difference between the `taskRoleArn` and `executionRoleArn` properties?", "o": ["`taskRoleArn` lets ECS pull images and write logs; `executionRoleArn` gives permissions to your application code", "`taskRoleArn` gives permissions to your application code; `executionRoleArn` lets ECS pull images and write logs", "`taskRoleArn` is used by the EC2 instance running the task; `executionRoleArn` is used by the cluster's service", "`taskRoleArn` is only for Fargate tasks; `executionRoleArn` is only for tasks on the EC2 launch type"], "a": 1, "e": "The <b>execution role<\/b> is used by the ECS agent/infrastructure to perform actions needed to run the task — pulling the container image from ECR, writing logs to CloudWatch Logs, and retrieving secrets referenced in the task definition. The <b>task role<\/b> is assumed by the application code running inside the container to make its own AWS API calls (e.g. accessing S3 or DynamoDB), following least privilege scoped to what the application actually needs.", "w": "(A) The roles are reversed. (C) The EC2 host uses its instance profile; neither field describes a host or service role. (D) Both fields apply to both launch types."}, {"id": 3431698610, "d": "dep", "t": null, "q": "A Lambda function has two published versions, and traffic needs to shift gradually from v1 to v2 using a Lambda alias, without necessarily involving CodeDeploy. Which native Lambda alias feature supports this?", "o": ["An alias routing configuration that sends a weighted share of traffic to a second version", "A provisioned concurrency setting on the alias that gradually moves traffic to the new version", "A function URL for each version, with Route 53 weighted records pointing at both URLs", "An event source mapping on each version that splits the incoming events by percentage"], "a": 0, "e": "A Lambda <b>alias<\/b> can be configured with a routing configuration that splits invocation traffic between two versions by a specified weight — e.g. sending a small percentage to a new version for canary testing — independent of CodeDeploy, directly through the alias's `RoutingConfig`. CodeDeploy provides an additional layer for automated, alarm-driven canary/linear shifts, but basic weighted routing is a native alias capability.", "w": "(B) Provisioned concurrency pre-warms environments and does not route traffic. (D) Mappings read from event sources; they do not split traffic between versions. (C) That is a workaround; aliases provide weighted routing natively."}, {"id": 1637039274, "d": "dep", "t": null, "q": "A CloudFormation stack update is stuck in the `UPDATE_ROLLBACK_FAILED` state, and further updates are being rejected. What is the correct way to recover?", "o": ["Fix the cause or skip the failing resources and run `ContinueUpdateRollback`", "Delete the stack and import the existing resources into a new stack with the previous template", "Cancel the update with `CancelUpdateStack`, which restores the previous state of all resources", "Run a new update with the previous template, which overwrites the failed rollback"], "a": 0, "e": "When a rollback itself fails, CloudFormation exposes `ContinueUpdateRollback`, which resumes the rollback process — optionally skipping resources that cannot be rolled back automatically (for example, because they were manually modified outside CloudFormation), after which those specific resources may need manual reconciliation. Once the stack reaches `UPDATE_ROLLBACK_COMPLETE`, normal updates can be attempted again.", "w": "(C) CancelUpdateStack works only while an update is in progress. (D) Updates are rejected while the stack is in UPDATE_ROLLBACK_FAILED. (B) That is destructive and unnecessary when the rollback can be continued."}, {"id": 1549389198, "d": "dep", "t": null, "q": "A CloudFormation template needs to perform an action that has no native CloudFormation resource type, such as calling a third-party API during stack creation. What CloudFormation feature supports this?", "o": ["A `DependsOn` attribute on the resource that points to a Lambda function that makes the call", "A `WaitCondition` that pauses the stack until the third-party API reports success", "A custom resource backed by a Lambda function that handles create, update and delete requests", "A `Metadata` section with `AWS::CloudFormation::Init` commands that call the third-party API"], "a": 2, "e": "<b>Custom Resources<\/b> let a template delegate provisioning logic to a Lambda function (most commonly) or SNS-backed handler. CloudFormation invokes the function on Create/Update/Delete stack events, and the function must send a response (success/failure and any output data) back to a pre-signed S3 URL that CloudFormation provides, allowing the stack to proceed or roll back accordingly.", "w": "(A) DependsOn only orders resources. (B) A WaitCondition waits for a signal; it does not make the call. (D) cfn-init configures EC2 instances; it cannot run outside an instance."}, {"id": 2549008943, "d": "dep", "t": null, "q": "A CodeDeploy deployment to an ECS service needs to shift traffic between a 'blue' (current) and 'green' (new) task set using an Application Load Balancer, with automatic rollback if CloudWatch alarms trigger. What does the ECS-specific `appspec.yaml` primarily define?", "o": ["The new task definition, the container name and port for the load balancer, and optional lifecycle hooks", "The Docker build instructions and the registry where the new image is pushed", "The EC2 instance IDs to update and the scripts that run on them at each lifecycle event", "The listener rules and target groups that CodeDeploy creates for the green task set"], "a": 0, "e": "For ECS deployments, the appspec defines the target `TaskDefinition`, the container name and port to register with the load balancer, and can specify `Hooks` — Lambda functions invoked at specific points in the Blue/Green lifecycle (e.g. `BeforeInstall`, `AfterInstall`, `AfterAllowTestTraffic`, `BeforeAllowTraffic`, `AfterAllowTraffic`) — commonly used to run validation checks before shifting production traffic.", "w": "(C) That describes the EC2/on-premises appspec. (B) Images are built earlier in the pipeline, for example by CodeBuild. (D) The load balancer, listeners and target groups must exist already; the appspec only references the container and port."}, {"id": 3212222981, "d": "dep", "t": null, "q": "A CodeBuild project needs GPU acceleration or a very large amount of memory/CPU for a specialized build task. What determines the available compute resources for a build?", "o": ["The size of the source repository, because CodeBuild scales the environment to the code size", "The compute type chosen in the project environment, such as small, large or a GPU type", "The account's Lambda concurrency limit, because CodeBuild runs builds as Lambda functions", "The `phases` section of the buildspec, where each phase can request vCPUs and memory"], "a": 1, "e": "A CodeBuild project's <b>compute type<\/b> setting determines the vCPU, memory, and (for certain types) GPU resources allocated to the build environment — ranging from small general-purpose instances up to large and GPU-enabled types for specialized workloads like ML training or media processing.", "w": "(D) The buildspec defines commands, not resources. (A) The environment size is configured, not inferred from the repository size. (C) CodeBuild runs on its own managed build hosts."}, {"id": 1542100563, "d": "dep", "t": null, "q": "An ECR repository is used to store container images built by CI/CD. What ECR feature helps catch known vulnerabilities in image layers before deployment?", "o": ["A lifecycle policy that removes images with known vulnerabilities after a given number of days", "Cross-region replication, which scans the image once in each destination region", "Image scanning on push, basic or enhanced with Amazon Inspector, which reports known CVEs", "Tag immutability, which prevents vulnerable image layers from being pushed to the repository"], "a": 2, "e": "ECR supports <b>image scanning<\/b> — basic scanning on push (or manually triggered) checks for known OS package vulnerabilities, while enhanced scanning (powered by Amazon Inspector) provides continuous, deeper scanning covering both OS and application-level (language package) vulnerabilities, generating findings that can be reviewed before promoting an image to production.", "w": "(A) Lifecycle policies expire images by age or count; they do not detect vulnerabilities. (D) Tag immutability prevents tags from being overwritten. (B) Replication copies images; scanning is a separate setting."}, {"id": 2569966024, "d": "dep", "t": null, "q": "A team wants the exact same CloudFormation template deployed consistently across dozens of AWS accounts and multiple regions within an AWS Organization, with centralized management of drift and updates. What feature is designed for this?", "o": ["CloudFormation macros, which expand one template into a stack per account and region", "Nested stacks, which deploy one parent template into several accounts through child stacks", "AWS Service Catalog portfolios, which share templates and apply drift detection across accounts", "CloudFormation StackSets, which deploy and update one template across accounts and regions"], "a": 3, "e": "<b>StackSets<\/b> extend CloudFormation to manage stacks as a single operation across many target accounts and regions. With AWS Organizations integration, StackSets can even auto-deploy to accounts as they're added to specified organizational units, and centrally track drift and update status across all stack instances.", "w": "(B) Nested stacks compose one stack in a single account and region. (A) Macros transform template syntax; they do not deploy stacks. (C) Service Catalog shares products for launching, but centralized stack updates and drift management are StackSets features."}, {"id": 3987481981, "d": "ts", "t": null, "q": "An ECS task on Fargate is stuck in the `PENDING` state and never transitions to `RUNNING`. Which of the following is a common root cause worth investigating first?", "o": ["The task cannot reach ECR or CloudWatch from its subnet, or the subnet has no free IP addresses", "The cluster uses the EC2 launch type, which cannot start tasks that request Fargate capacity", "The task definition's `essential` flag is false, so ECS keeps the task pending until it is changed", "The task role lacks `ecs:RunTask`, so ECS cannot move the task to the running state"], "a": 0, "e": "A Fargate task typically stays in `PENDING` when the underlying infrastructure can't be provisioned or the image can't be pulled — common causes include a private subnet lacking a route to a NAT Gateway or VPC endpoint (blocking ECR/CloudWatch access), a security group blocking required outbound traffic, or exhausted subnet IP addresses for the ENI. Checking the task's `stoppedReason` (if it stops) or its networking configuration is the right first step.", "w": "(C) The essential flag decides whether the task stops when that container exits. (D) The task role is for your application's own calls; it does not start the task. (B) A cluster can run tasks of both launch types."}, {"id": 3625491255, "d": "ts", "t": null, "q": "A Lambda function connected to RDS via a connection pool intermittently fails with `too many connections` errors under moderate concurrent load. What is the most likely underlying cause?", "o": ["The function's memory is too low, so connections are dropped and reopened until the limit is reached", "RDS limits connections per IAM role, so several functions that share a role hit the limit quickly", "The connection pool inside the function is too small, so each request opens an extra connection", "Every concurrent execution environment opens its own connection, which can exceed the database limit; use RDS Proxy"], "a": 3, "e": "Because each concurrent Lambda execution environment is a separate process, a traditional in-Lambda connection pool doesn't actually pool connections across concurrent invocations the way a long-running server would — under bursty, high-concurrency load, the total number of simultaneous connections can exceed the database's connection limit. <b>RDS Proxy<\/b> is the AWS-recommended solution: it pools and multiplexes connections centrally between Lambda and the database, decoupling Lambda concurrency from the database's actual connection count.", "w": "(A) Memory does not cause dropped connections. (B) Connection limits are set per database instance, not per role. (C) Each environment has its own pool, and more environments mean more connections regardless of pool size."}, {"id": 4017218547, "d": "ts", "t": null, "q": "A Kinesis Data Streams consumer using the classic (shared-throughput) `GetRecords` API is experiencing `ProvisionedThroughputExceededException` even though only one consumer application is reading from the stream. What is a likely cause and remediation?", "o": ["The consumer must switch to the `GetShardIterator` API, which has a higher per-shard limit", "The partition key is not random enough, which limits how many records a consumer can read", "Shared read throughput per shard is exceeded; reduce polling, add shards or use Enhanced Fan-Out", "The stream's retention period is too long, so reading old records exceeds the shard's quota"], "a": 2, "e": "In the classic Kinesis consumer model, each shard supports up to 5 GetRecords calls per second and 2 MB/sec of read throughput, shared across whatever is polling that shard. Polling too frequently, running multiple consumer processes against the same shards, or having many downstream consumers can hit this ceiling. Solutions include resharding to increase per-shard-equivalent capacity, spacing out GetRecords calls, or adopting <b>Enhanced Fan-Out<\/b>, which gives each registered consumer a dedicated 2 MB/sec pipe per shard independent of others.", "w": "(D) Retention does not affect read throughput. (B) Partition keys matter for writes and hot shards, not read quotas. (A) GetShardIterator only creates an iterator; reads still use GetRecords."}, {"id": 1238139333, "d": "ts", "t": null, "q": "An Application Load Balancer returns `502 Bad Gateway` errors for requests routed to a target group backed by an EC2 Auto Scaling Group. What is a common cause to investigate first?", "o": ["A target closes the connection early or sends a response the load balancer cannot parse", "The listener's certificate expired, so the TLS handshake with the targets failed", "The load balancer's idle timeout expired while the target was still processing the request", "The client sent an HTTP request that is larger than the load balancer allows"], "a": 0, "e": "A 502 from an ALB typically means the ALB could not get a valid response from a target — often because the target is unhealthy (failing health checks so no target is available), the application closed the connection prematurely, or it returned a response the ALB couldn't parse. Checking the target group's health check configuration/status and the application logs on the instances is the standard first troubleshooting step.", "w": "(D) Oversized requests give 4xx errors. (C) An expired idle timeout results in 504. (B) An expired listener certificate affects the clients' handshake, not responses from targets."}, {"id": 2857641619, "d": "ts", "t": null, "q": "A CodeBuild build fails during the `install` phase with a permissions error trying to access a private CodeArtifact repository. What is the most likely cause?", "o": ["The CodeBuild project must run in privileged mode to authenticate against package repositories", "The CodeArtifact domain is in a different region, so the build cannot resolve its endpoint", "The buildspec uses `version: 0.2`, which does not support private package repositories", "The build's service role lacks `codeartifact:GetAuthorizationToken` or `sts:GetServiceBearerToken`"], "a": 3, "e": "To pull packages from a private CodeArtifact repository, the build must first obtain an authorization token, which requires the CodeBuild project's service role to have permissions such as `codeartifact:GetAuthorizationToken`, `sts:GetServiceBearerToken`, and read access (e.g. `codeartifact:ReadFromRepository`) on the specific domain/repository — missing any of these results in an authentication or authorization failure during the install phase.", "w": "(C) Both buildspec versions can authenticate to CodeArtifact. (B) Cross-region access is possible; the endpoint includes the region. (A) Privileged mode is for Docker builds."}, {"id": 2111659223, "d": "ts", "t": null, "q": "A DynamoDB `UpdateItem` call intermittently fails with `ConditionalCheckFailedException` even though the application logic appears correct. What does this exception generally indicate, and how should it typically be handled?", "o": ["The item no longer matched the condition, for example after another writer changed it; re-read and retry", "The table ran out of write capacity, so DynamoDB rejected the update; retry with exponential backoff", "The item is larger than 400 KB after the update; split the attributes into a second item", "The IAM role lacks `dynamodb:UpdateItem`; add the permission and retry the update"], "a": 0, "e": "`ConditionalCheckFailedException` is a normal, expected outcome when a `ConditionExpression` (commonly used for optimistic locking or conditional writes, e.g. 'update only if version matches' or 'insert only if item doesn't already exist') evaluates to false against the item's current state — often because a concurrent write already changed it. Well-designed applications treat this as an expected condition to catch and react to (retry with fresh data, merge, or surface a conflict to the user), not as an unexpected system error.", "w": "(B) Throttling returns ProvisionedThroughputExceededException. (D) Missing permissions return AccessDeniedException. (C) Oversized items return a ValidationException."}, {"id": 2878375703, "d": "ts", "t": null, "q": "An EC2 instance fails its 'Instance Status Check' (as opposed to the 'System Status Check') in the EC2 console. What does this specifically indicate, and what is a typical remediation?", "o": ["A problem with the physical host; stop and start the instance so it moves to other hardware", "An EBS volume problem; replace the volume with one restored from a snapshot before starting the instance", "A security group or route problem; open the required ports so the checks can reach the instance", "A problem inside the instance, such as a kernel panic or full disk; reboot or fix the operating system"], "a": 3, "e": "AWS EC2 exposes two status checks: the <b>system status check<\/b> reflects problems with the underlying AWS infrastructure (host hardware, network, power) that generally require AWS intervention or simply stopping/starting the instance to move it to healthy hardware; the <b>instance status check<\/b> reflects problems within the guest OS/software on that specific instance, which the customer is responsible for diagnosing and fixing (e.g. via reboot, checking system logs, or using EC2 Serial Console access for instances that are otherwise unreachable via SSH).", "w": "(A) That is a system status check failure. (C) Status checks run from AWS and do not depend on your security groups. (B) A volume problem shows up as a storage impairment, not as an instance status check failure."}, {"id": 3418932142, "d": "dep", "t": "ec2", "q": "An EC2 instance needs to run a setup script automatically the first time it boots (installing packages, starting a web server), without any manual login. Which feature is used?", "o": ["EC2 User Data, which runs your script as root through cloud-init at first boot", "Instance metadata tags, which the instance runs as commands when it starts for the first time", "An SSM Run Command document that AWS sends to the instance automatically when it launches", "A security group startup rule that executes the script when the first connection arrives"], "a": 0, "e": "<b>User Data<\/b> is a block of commands or a cloud-init directive passed to an EC2 instance at launch. By default, it runs once as root the first time the instance boots — commonly used to bootstrap software installation and configuration without manual intervention.", "w": "(B) Tags are labels and are not executed. (C) Run Command must be started separately and needs the SSM agent; it does not run automatically at launch. (D) Security groups only filter traffic."}, {"id": 2334208691, "d": "dep", "t": "ec2", "q": "What is the key difference between an On-Demand EC2 instance and a Spot Instance in terms of pricing and availability guarantees?", "o": ["Spot is cheaper and guarantees capacity for the chosen duration; On-Demand can be reclaimed at any time", "On-Demand is cheaper for short jobs; Spot is cheaper only when reserved for a year or longer", "Spot is much cheaper but can be reclaimed with a two-minute warning; On-Demand is not reclaimed", "Spot and On-Demand cost the same, but Spot can only run in one Availability Zone"], "a": 2, "e": "<b>On-Demand<\/b> instances are billed per second/hour with no long-term commitment and are not subject to reclamation. <b>Spot Instances<\/b> use spare EC2 capacity at a steep discount, but AWS can interrupt (terminate/stop/hibernate) them with a two-minute notice when the capacity is needed — making them well suited for fault-tolerant, flexible workloads like batch processing.", "w": "(A) The guarantees are reversed. (B) Spot does not require a reservation. (D) Spot has a discount and can run in any AZ."}, {"id": 2934608726, "d": "dep", "t": "storage", "q": "An application needs a network file system that can be mounted concurrently by many EC2 instances across multiple Availability Zones, supporting the NFS protocol. Which storage service fits this need?", "o": ["Amazon S3 mounted through a file gateway on every instance, which provides POSIX semantics", "Amazon EBS Multi-Attach, which attaches one volume to instances in several AZs", "Amazon EFS, a managed NFS file system that many instances in several AZs can mount", "Amazon FSx for Lustre, which exposes the NFS protocol and spans several Availability Zones"], "a": 2, "e": "<b>EFS<\/b> is a fully managed, elastic NFS file system designed for concurrent access from many EC2 instances (or containers, Lambda) across multiple Availability Zones, automatically scaling storage capacity up and down as files are added or removed.", "w": "(B) Multi-Attach works only inside a single AZ. (D) Lustre uses its own client, not NFS, and is built for high-performance computing. (A) S3 is object storage and does not provide POSIX semantics."}, {"id": 2062187655, "d": "dep", "t": "storage", "q": "What happens to the data on an EC2 Instance Store volume when the underlying instance is stopped (not terminated, but stopped and later started again)?", "o": ["The data is kept, because instance store volumes are snapshotted to S3 when the instance stops", "The data is kept only if the instance is stopped from the console and not through the API", "The data is lost, because instance store volumes belong to the host hardware", "The data is kept on the host, but only for the first 24 hours after the instance stops"], "a": 2, "e": "<b>Instance Store<\/b> volumes are physically attached to the specific host machine running the instance. Stopping and starting an instance (as opposed to a simple reboot) can relocate it to different underlying hardware, and data on instance store is lost on stop, terminate, or underlying hardware failure — it should only be used for temporary/ephemeral data or data replicated elsewhere.", "w": "(A) Instance store volumes are not backed up. (B) How the instance is stopped does not matter. (D) There is no retention window; the data is lost when the instance stops."}, {"id": 351120479, "d": "dep", "t": "elb-asg", "q": "Which AWS load balancer type operates at Layer 4 (transport layer), is capable of handling millions of requests per second with ultra-low latency, and supports a static IP address per Availability Zone?", "o": ["Classic Load Balancer (CLB)", "Gateway Load Balancer (GWLB)", "Application Load Balancer (ALB)", "Network Load Balancer (NLB)"], "a": 3, "e": "The <b>Network Load Balancer<\/b> operates at Layer 4 (TCP/UDP/TLS), designed for extreme performance and ultra-low latency. It supports assigning a static (Elastic) IP address per subnet/AZ, which is useful for applications that require a fixed IP for allowlisting.", "w": "ALB (C) operates at Layer 7 (HTTP/HTTPS) and is designed for content-based routing, not raw Layer-4 throughput/static IPs. Gateway Load Balancer (B) operates at Layer 3/4 specifically for transparently inserting third-party virtual appliances (firewalls, IDS/IPS) into the traffic path. Classic Load Balancer (A) is the legacy load balancer type, being phased out in favor of ALB/NLB/GWLB."}, {"id": 577884510, "d": "dep", "t": "elb-asg", "q": "An Auto Scaling Group uses a target-tracking scaling policy on average CPU utilization set to 50%. What does this configuration do?", "o": ["It adds instances only on a schedule and uses the 50% value to decide how many to add", "It keeps the instance count fixed and only replaces instances whose CPU stays above 50%", "It adds one instance whenever any single instance exceeds 50% CPU and removes one when it drops below", "It adds or removes instances to keep the group's average CPU close to 50%, like a thermostat"], "a": 3, "e": "A <b>target-tracking<\/b> scaling policy works like a thermostat: it continuously monitors the chosen metric (here, average CPU across the group) and automatically adds or removes instances to keep that metric close to the target value, without requiring manually defined step adjustments or thresholds.", "w": "(C) Target tracking reacts to the group average and calculates the capacity needed. (A) Schedules are a separate policy type. (B) The policy changes the desired capacity; replacing unhealthy instances is a health-check function."}, {"id": 3693849201, "d": "dep", "t": "elb-asg", "q": "What is the purpose of 'connection draining' (also called deregistration delay) on a load balancer target group?", "o": ["The load balancer keeps sending new requests to the target until its health check fails twice", "The load balancer holds new requests in a queue until the deregistering target is replaced", "The load balancer stops sending new requests to a deregistering target but lets in-flight requests finish", "The load balancer copies in-flight requests to the remaining targets and closes the connection at once"], "a": 2, "e": "<b>Connection draining / deregistration delay<\/b> gives in-flight requests time to complete gracefully when an instance is being removed from a target group (due to scale-in, health check failure, or manual deregistration), instead of abruptly cutting off active users — the default is 300 seconds but it's configurable.", "w": "(D) Existing requests are allowed to complete; they are not moved. (B) New requests go to healthy targets; nothing is queued. (A) A deregistering target gets no new requests."}, {"id": 1572854091, "d": "dep", "t": "elb-asg", "q": "An Auto Scaling Group needs to replace all running instances with new ones based on an updated launch template, while maintaining a minimum healthy percentage and controlling the pace of replacement. Which ASG feature is designed for this?", "o": ["A lifecycle hook on the terminating state that launches a replacement from the new template", "Instance Refresh, which replaces instances in batches while keeping a minimum healthy percentage", "A target tracking policy that replaces instances whose launch template version is out of date", "A scheduled action that sets the desired capacity to zero and then back to the previous value"], "a": 1, "e": "<b>Instance Refresh<\/b> lets you trigger a controlled, gradual replacement of instances in an ASG (e.g. to roll out a new AMI or launch template version), respecting a configured minimum healthy percentage and an instance warm-up time, avoiding a full, disruptive all-at-once termination.", "w": "(D) That causes an outage and ignores the healthy percentage. (A) Lifecycle hooks pause instances for custom actions; they do not roll out template changes. (C) Scaling policies adjust capacity, not template versions."}, {"id": 3936350719, "d": "dev", "t": "rds", "q": "An application currently reads and writes to a single RDS MySQL instance, and read-heavy reporting queries are starting to impact write performance. What RDS feature offloads read traffic without impacting the primary's write capacity?", "o": ["Multi-AZ, whose standby instance serves read-only queries in a second Availability Zone", "Read replicas, which are asynchronous copies that serve read-only queries", "Automated backups, which can be mounted as read-only databases for reporting", "A larger instance class, since read throughput always grows linearly with the instance size"], "a": 1, "e": "<b>Read Replicas<\/b> are asynchronously replicated, read-only copies of an RDS database (up to several per source, potentially cross-region) that applications can direct read-heavy queries to, reducing load on the primary instance which continues to handle all writes.", "w": "(A) A standard Multi-AZ standby cannot serve queries; it exists for failover. (D) A bigger instance helps but does not separate reporting from writes. (C) Backups must be restored into a new instance before they can be queried."}, {"id": 2840614735, "d": "dev", "t": "rds", "q": "What is the primary difference between RDS Multi-AZ deployments and RDS Read Replicas in terms of purpose?", "o": ["Multi-AZ keeps a synchronous standby for failover; read replicas are asynchronous and serve reads", "Multi-AZ replicates asynchronously to scale reads; read replicas replicate synchronously for failover", "Both keep a synchronous copy, but read replicas can only be placed in the primary's Availability Zone", "Multi-AZ is only for Aurora; read replicas can only be created for non-Aurora engines"], "a": 0, "e": "<b>Multi-AZ<\/b> deployments maintain a synchronous standby replica in another AZ purely for durability and automatic failover during outages — the standby is not intended for serving read traffic in classic (non-Aurora) Multi-AZ. <b>Read Replicas<\/b> use asynchronous replication and are intended to horizontally scale read capacity; they can be promoted to a standalone writable database if needed, and can even be Multi-AZ themselves for added resilience.", "w": "(B) The replication modes are swapped. (D) Both exist for RDS engines and Aurora. (C) Read replicas are asynchronous and can be in other AZs or regions."}, {"id": 1957080291, "d": "dev", "t": "rds", "q": "An application experiences connection storms against an RDS database during traffic spikes, particularly from many short-lived Lambda invocations. Which AWS feature is designed to pool and manage these connections efficiently?", "o": ["An ElastiCache cluster in front of the database, which pools connections for every client", "A larger instance class together with a higher `max_connections` parameter in every client", "Read replicas, which absorb connection storms by spreading connections across several writers", "RDS Proxy, which pools and shares database connections between many short-lived clients"], "a": 3, "e": "<b>RDS Proxy<\/b> sits between the application (very commonly Lambda) and the database, maintaining a pool of established connections that it multiplexes across many client requests — this reduces the connection overhead and CPU/memory strain on the database from a large number of short-lived, bursty client connections, and also improves failover time transparently for the application.", "w": "(C) Read replicas serve reads and do not multiply writers. (A) A cache reduces queries but does not pool database connections. (B) That raises the limit but does not remove the overhead of many connections."}, {"id": 865766566, "d": "dev", "t": "rds", "q": "What is a key architectural advantage of Amazon Aurora over standard RDS MySQL/PostgreSQL in terms of storage and replication?", "o": ["Aurora requires you to provision the storage size in advance, with a maximum of 16 TB", "Aurora stores data in a single AZ and relies on snapshots to S3 for durability", "Aurora stores six copies of data across three AZs in storage separate from compute, with up to 15 replicas", "Aurora uses Multi-AZ standbys that serve reads, limited to five replicas like other engines"], "a": 2, "e": "<b>Aurora<\/b>'s storage engine is a distributed system that automatically replicates data six ways across three Availability Zones, decoupled from the compute (database engine) layer. This enables very fast crash recovery, storage that auto-scales up to 128 TiB, and support for up to 15 Aurora Replicas with sub-10ms replica lag, versus the 5-replica limit and different replication model of standard RDS.", "w": "(B) Aurora storage is replicated across three AZs. (D) Aurora supports up to 15 replicas that serve reads. (A) Aurora storage grows automatically up to 128 TB."}, {"id": 1221947785, "d": "dep", "t": "r53", "q": "An application needs DNS to route users to the geographically closest healthy endpoint (measured by actual network latency, not physical location) among several regional deployments. Which Route 53 routing policy fits this?", "o": ["Failover routing, which sends users to the region that answers health checks the fastest", "Geolocation routing, which sends users to the region closest to them by network latency", "Geoproximity routing, which sends users to the lowest-latency region regardless of bias settings", "Latency-based routing, which sends users to the region with the lowest measured latency"], "a": 3, "e": "<b>Latency-based routing<\/b> uses AWS's continuously measured network latency data between users (grouped by origin) and each AWS region to direct traffic to the region that historically provides the best (lowest) latency for that user — it is about actual network performance, not simple geographic proximity.", "w": "(B) Geolocation routes by the user's location, not by latency. (C) Geoproximity routes by distance and a configurable bias. (A) Failover switches to a secondary only when the primary is unhealthy."}, {"id": 4227208918, "d": "dep", "t": "r53", "q": "What is the key difference between a Route 53 Alias record and a traditional CNAME record?", "o": ["Alias records can be used at the zone apex and point to AWS resources, while CNAME cannot be used there", "Alias records are charged per query like CNAME records, but they have a lower TTL", "CNAME records can be used at the zone apex, while alias records only work for subdomains", "Alias records can point to any public DNS name, while CNAME records only point to AWS resources"], "a": 0, "e": "<b>Alias records<\/b> are a Route 53-specific extension that can be used at the zone apex (which the DNS standard prohibits for CNAME) and point natively to supported AWS resources; Route 53 resolves them internally without an extra DNS hop, and there's no additional charge for Alias queries to AWS resource targets. CNAME records, by DNS specification, cannot coexist with other records at the zone apex and require an additional resolution step.", "w": "(C) The apex restriction applies to CNAME. (D) Alias targets are limited to AWS resources and records in the same zone. (B) Queries to alias records that point to AWS resources are free, and aliases have no TTL setting."}, {"id": 1277558776, "d": "dep", "t": "r53", "q": "A Route 53 failover routing policy is configured with a primary and a secondary record. What determines when Route 53 starts responding with the secondary record instead of the primary?", "o": ["A CloudWatch alarm on the load balancer must be configured to flip the records manually", "The primary record must be deleted from the hosted zone before the secondary answers", "A failing health check on the primary record makes Route 53 answer with the secondary record", "Route 53 switches after the record TTL expires, whether or not the primary is healthy"], "a": 2, "e": "Failover routing relies on an associated <b>Route 53 Health Check<\/b> monitoring the primary endpoint. When the health check reports the primary as unhealthy, Route 53 automatically starts responding to queries with the secondary record instead — enabling automated DNS-level failover without manual action.", "w": "(A) Route 53 switches automatically based on its health check; nothing is flipped manually. (D) The TTL controls caching, not failover. (B) Records stay in place; the health check status decides."}, {"id": 4195063227, "d": "dep", "t": "vpc", "q": "What is the purpose of a NAT Gateway in a VPC architecture with public and private subnets?", "o": ["It connects the VPC to on-premises networks over an encrypted tunnel", "It lets internet clients start connections to instances in a private subnet through a public address", "It encrypts traffic between private subnets and the internet gateway with TLS", "It lets private subnet resources start outbound connections to the internet without accepting inbound ones"], "a": 3, "e": "A <b>NAT Gateway<\/b>, placed in a public subnet with a route to an Internet Gateway, allows instances in private subnets to make outbound-only connections to the internet (for updates, external API calls, etc.) via network address translation, while the private instances remain unreachable directly from the internet since no inbound route exists to them.", "w": "(B) A NAT gateway blocks unsolicited inbound connections. (C) NAT translates addresses; it does not encrypt. (A) That is a Site-to-Site VPN."}, {"id": 253206111, "d": "dep", "t": "vpc", "q": "Two VPCs in different AWS accounts need to communicate privately using private IP addresses, without traffic going over the public internet, and without overlapping CIDR ranges. What VPC feature enables this?", "o": ["A transit gateway attachment, which is the only way to connect VPCs in different accounts", "VPC peering, which connects two VPCs with non-overlapping CIDR ranges over private IPs", "A VPC endpoint in one VPC that expo
